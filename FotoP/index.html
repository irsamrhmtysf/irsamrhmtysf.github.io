<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FotoRingan" />
  <meta name="description" content="Kompres foto WhatsApp & Instagram secara offline. Privat, cepat, elegan. Tidak ada data yang meninggalkan perangkat Anda." />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>FotoRingan</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <div id="app">
    <!-- Subtle background glow -->
    <div class="bg-glow" aria-hidden="true"></div>

    <!-- Header -->
    <header class="header">
      <div class="logo-wrap">
        <div class="logo-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#g)"/>
            <path d="M8 18.5L11.2 14.8L14.1 17.5L19.5 10.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9.5" cy="10.5" r="1.6" fill="white"/>
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="28" y2="28">
                <stop stop-color="#6366F1"/>
                <stop offset="1" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1>FotoComp</h1>
          <p class="tagline">Offline • Privat • Elegan</p>
        </div>
      </div>
    </header>

    <!-- Home View -->
    <main id="home-view" class="view active">
      <section class="hero">
        <div class="hero-badge">
          <span class="pulse"></span>
          100% Offline
        </div>
        <h2>Kompres foto tanpa<br>kehilangan kendali</h2>
        <p class="hero-desc">
          Semua proses terjadi di perangkat Anda.<br>
          Tidak ada server. Tidak ada jejak.
        </p>
      </section>

      <section class="actions">
        <label class="card-btn primary" for="file-input">
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <div class="card-content">
            <strong>Pilih dari Galeri</strong>
            <span>Bisa pilih banyak foto sekaligus</span>
          </div>
          <div class="card-arrow">→</div>
        </label>
        <input type="file" id="file-input" accept="image/*" multiple hidden />

        <button class="card-btn" id="btn-camera" type="button">
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <div class="card-content">
            <strong>Ambil dari Kamera</strong>
            <span>Langsung foto lalu kompres</span>
          </div>
          <div class="card-arrow">→</div>
        </button>

        <button class="card-btn muted" id="btn-scan" type="button" disabled>
          <div class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </div>
          <div class="card-content">
            <strong>Scan Dokumen → PDF</strong>
            <span>Segera hadir</span>
          </div>
        </button>
      </section>

      <footer class="home-footer">
        <div class="trust-pills">
          <span>🔒 Privat</span>
          <span>⚡ Cepat</span>
          <span>✨ Tanpa Iklan Berlebihan</span>
        </div>
      </footer>
    </main>

    <!-- Compress View -->
    <main id="compress-view" class="view">
      <div class="top-bar">
        <button id="btn-back" class="btn-icon-only" aria-label="Kembali">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span id="image-counter" class="counter"></span>
        <div style="width:40px"></div>
      </div>

      <div class="preview-wrap">
        <div class="preview-frame">
          <img id="preview-image" alt="Preview foto" />
          <div class="preview-overlay" id="processing-overlay" hidden>
            <div class="spinner"></div>
            <span>Memproses…</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="presets" id="presets" role="tablist">
          <button class="preset active" data-preset="custom" role="tab">Custom</button>
          <button class="preset" data-preset="whatsapp_standard" role="tab">WhatsApp</button>
          <button class="preset" data-preset="whatsapp_hd" role="tab">WA HD</button>
          <button class="preset" data-preset="instagram_feed" role="tab">IG Feed</button>
          <button class="preset" data-preset="instagram_story" role="tab">IG Story</button>
        </div>

        <div class="slider-block" id="quality-group">
          <div class="slider-header">
            <span>Kualitas</span>
            <span id="quality-value" class="quality-badge">80%</span>
          </div>
          <input type="range" id="quality-slider" min="20" max="100" value="80" step="5" />
          <div class="slider-labels">
            <span>Kecil</span>
            <span>Seimbang</span>
            <span>Terbaik</span>
          </div>
        </div>

        <div class="stats" id="result-info" hidden>
          <div class="stat">
            <span class="stat-label">Asli</span>
            <span class="stat-value" id="original-size">—</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-label">Hasil</span>
            <span class="stat-value accent" id="compressed-size">—</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-label">Hemat</span>
            <span class="stat-value success" id="saved-percent">—</span>
          </div>
        </div>

        <div class="cta-row">
          <button id="btn-compress" class="btn-main">
            <span class="btn-label">Kompres Sekarang</span>
          </button>
          <button id="btn-download" class="btn-main success" hidden>
            <span class="btn-label">Simpan Hasil</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
