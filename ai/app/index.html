<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Free AI</title>
<style>
  :root { --safe: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: #f5f8ff; font: 16px/1.5 system-ui, sans-serif; overflow: hidden; background: #070b16; }
  .mesh { position: fixed; inset: -20%; z-index: 0; pointer-events: none; background: radial-gradient(40% 40% at 20% 20%, #6d5efc, transparent 60%), radial-gradient(35% 35% at 85% 10%, #1aa6ff, transparent 55%), radial-gradient(40% 40% at 70% 90%, #ff4fd8, transparent 55%), radial-gradient(30% 30% at 10% 80%, #3dffe0, transparent 50%); filter: blur(8px); animation: drift 16s ease-in-out infinite alternate; }
  body.thinking .mesh { animation-duration: 4s; filter: blur(4px) brightness(1.25); }
  body.reply .mesh { filter: blur(2px) brightness(1.45); }
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; align-items: center; padding: 12px 14px 8px; }
  .mark { width: 36px; height: 36px; border-radius: 12px; flex: none; background: conic-gradient(from 120deg, #8ab4ff, #c58bff, #7dffd2, #8ab4ff); box-shadow: 0 0 18px rgba(140,160,255,.55); animation: spin 8s linear infinite; }
  body.thinking .mark { animation-duration: 1.1s; }
  h1 { font-size: 16px; margin: 0; font-weight: 700; }
  h1 span { display: block; font-size: 12px; font-weight: 500; color: #c9d4ee; }
  .icon { margin-left: auto; width: 36px; height: 36px; padding: 0; border-radius: 999px; background: rgba(10,16,32,.72); color: #fff; border: 1px solid rgba(255,255,255,.16); }
  #log { flex: 1; overflow: auto; padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .hello { margin: auto; text-align: center; max-width: 28rem; }
  .hello h2 { margin: 8px 0; font-size: 30px; background: linear-gradient(90deg, #8ab4ff, #d7b4ff, #7dffd2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hello p { color: #c5d0e8; margin: 0; }
  .msg { max-width: 92%; padding: 12px 14px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; animation: pop .35s cubic-bezier(.2,1.2,.3,1); }
  .user { align-self: flex-end; background: linear-gradient(135deg, #4c6fff, #7a4dff); box-shadow: 0 8px 24px rgba(80,90,255,.28); }
  .bot { align-self: flex-start; background: rgba(16,22,40,.78); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); }
  .bot.fresh { box-shadow: 0 0 0 1px rgba(160,220,255,.45), 0 0 32px rgba(120,160,255,.35); }
  .meta { font-size: 11px; color: #b7c4e2; margin-bottom: 4px; }
  .orb { display: flex; gap: 6px; align-items: center; height: 22px; }
  .orb i { width: 8px; height: 8px; border-radius: 50%; display: block; background: linear-gradient(180deg, #9ec1ff, #d9b6ff); animation: bounce 1s infinite ease-in-out; }
  .orb i:nth-child(2) { animation-delay: .15s; } .orb i:nth-child(3) { animation-delay: .3s; }
  form { padding: 10px 12px calc(12px + var(--safe)); }
  .box { display: flex; gap: 8px; align-items: flex-end; background: rgba(12,18,34,.86); border: 1px solid rgba(255,255,255,.14); border-radius: 22px; padding: 8px; backdrop-filter: blur(16px); box-shadow: 0 10px 40px rgba(80,90,255,.18); }
  textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: #fff; font: inherit; min-height: 24px; max-height: 120px; padding: 8px 6px; }
  button { border: 0; border-radius: 16px; padding: 10px 14px; font-weight: 700; color: #08101f; background: linear-gradient(135deg, #9ec1ff, #d7b4ff 55%, #7dffd2); min-width: 72px; display: inline-flex; align-items: center; justify-content: center; }
  button:disabled { opacity: .8; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(8,16,31,.25); border-top-color: #08101f; animation: spin .7s linear infinite; display: none; }
  button.loading .spin { display: block; } button.loading .label { display: none; }
  .flash { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 80%, rgba(180,220,255,.35), transparent 55%); }
  body.reply .flash { animation: flash .7s ease; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-6px); opacity: 1; } }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.08); } }
  @keyframes pop { from { transform: translateY(10px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes flash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="flash"></div>
<div id="app">
  <header>
    <div class="mark"></div>
    <h1>Free AI<span id="state">Ready · no key</span></h1>
    <button class="icon" id="sound" type="button" aria-label="sound">♪</button>
  </header>
  <div id="log">
    <div class="hello">
      <h2>Ask anything</h2>
      <p>Open knowledge first, so an answer lands fast. A free model fills in when it is free. No account.</p>
    </div>
  </div>
  <form id="box">
    <div class="box">
      <textarea id="q" rows="1" placeholder="Message Free AI"></textarea>
      <button id="send" type="submit"><span class="spin"></span><span class="label">Send</span></button>
    </div>
  </form>
</div>
<script>
const MODELS = ["mistral-Nemo-Instruct-2407", "codestral-latest", "GLM-5.3-Flash", "nemotron-3-nano:30b"];
const log = document.getElementById("log");
const q = document.getElementById("q");
const sendBtn = document.getElementById("send");
const state = document.getElementById("state");
const cache = JSON.parse(localStorage.getItem("freeai-cache") || "{}");
let history = [];
let soundOn = localStorage.getItem("freeai-sound") !== "0";
let audio, pulse, turn = 0;

document.getElementById("sound").textContent = soundOn ? "♪" : "×";
document.getElementById("sound").onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem("freeai-sound", soundOn ? "1" : "0");
  document.getElementById("sound").textContent = soundOn ? "♪" : "×";
  if (!soundOn) stopPulse(); else blip(520, .06);
};
function ctx() { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); return audio; }
function tone(freq, dur, gain) {
  if (!soundOn) return;
  const a = ctx(); const o = a.createOscillator(); const g = a.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(gain || .04, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function blip(f, d) { tone(f, d || .08, .04); }
function startPulse() { if (!soundOn || pulse) return; const a = ctx(); pulse = a.createOscillator(); const g = a.createGain(); pulse.frequency.value = 180; g.gain.value = .025; pulse.connect(g); g.connect(a.destination); pulse.start(); }
function stopPulse() { if (!pulse) return; try { pulse.stop(); } catch (e) {} pulse = null; }
function replySound() { tone(660, .09, .05); setTimeout(() => tone(880, .12, .05), 90); if (navigator.vibrate) navigator.vibrate(16); }

function add(role, node) {
  const hello = log.querySelector(".hello"); if (hello) hello.remove();
  const el = document.createElement("div"); el.className = "msg " + role; el.appendChild(node);
  log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
}
function textMsg(role, text, meta) {
  const wrap = document.createElement("div");
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; wrap.appendChild(m); }
  const body = document.createElement("div"); body.textContent = text; wrap.appendChild(body);
  const el = add(role, wrap); if (role === "bot") el.classList.add("fresh"); return body;
}
function typeInto(body, text) {
  let i = 0;
  const step = () => { i += Math.max(3, Math.ceil(text.length / 24)); body.textContent = text.slice(0, i); log.scrollTop = log.scrollHeight; if (i < text.length) requestAnimationFrame(step); };
  step();
}
function saveCache(key, val) {
  cache[key] = val;
  const keys = Object.keys(cache);
  if (keys.length > 40) delete cache[keys[0]];
  localStorage.setItem("freeai-cache", JSON.stringify(cache));
}

async function wiki(query) {
  const lang = /[^\x00-\x7F]/.test(query) ? "id" : "en";
  const search = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&namespace=0&format=json&origin=*`);
  const found = await search.json();
  const title = found?.[1]?.[0];
  if (!title) return "";
  const sum = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if (!sum.ok) return "";
  const data = await sum.json();
  if (!data.extract) return "";
  return data.extract + (data.content_urls?.desktop?.page ? "\n\n" + data.content_urls.desktop.page : "");
}
async function model(query) {
  const id = MODELS[turn++ % MODELS.length];
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try {
    const res = await fetch("https://api.llm7.io/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer unused" },
      signal: ctrl.signal,
      body: JSON.stringify({
        model: id,
        max_tokens: 280,
        temperature: 0.4,
        messages: [{ role: "system", content: "Answer in plain short sentences. No preamble." }, { role: "user", content: query }]
      })
    });
    if (!res.ok) return "";
    const data = await res.json();
    return (data.choices?.[0]?.message?.content || "").trim();
  } catch (e) { return ""; }
  finally { clearTimeout(timer); }
}
async function answer(query) {
  const key = query.toLowerCase().trim();
  if (cache[key]) return cache[key];
  const [open, ai] = await Promise.all([wiki(query).catch(() => ""), model(query)]);
  let text = "";
  let via = "Open knowledge";
  if (ai && ai.length > 40) { text = ai; via = "Open model"; }
  else if (open && ai) { text = ai + "\n\n" + open; via = "Open model + knowledge"; }
  else if (open) { text = open; via = "Open knowledge"; }
  else if (ai) { text = ai; via = "Open model"; }
  if (!text) return null;
  const packed = { text, via };
  saveCache(key, packed);
  return packed;
}

document.getElementById("box").onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || sendBtn.disabled) return;
  q.value = "";
  blip(420, .07);
  textMsg("user", text);
  history.push(text);
  const orb = document.createElement("div"); orb.className = "orb"; orb.innerHTML = "<i></i><i></i><i></i>";
  const pending = add("bot", orb);
  sendBtn.disabled = true; sendBtn.classList.add("loading");
  document.body.classList.add("thinking"); startPulse();
  state.textContent = "Looking";
  const packed = await answer(text);
  pending.remove(); stopPulse();
  document.body.classList.remove("thinking");
  document.body.classList.add("reply");
  replySound();
  if (packed) {
    typeInto(textMsg("bot", "", packed.via), packed.text);
    state.textContent = packed.via;
  } else {
    textMsg("bot", "No open source answered this one. Ask it a different way.", "retry");
    state.textContent = "Ready";
  }
  setTimeout(() => document.body.classList.remove("reply"), 700);
  sendBtn.disabled = false; sendBtn.classList.remove("loading"); q.focus();
};
q.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("box").requestSubmit(); } };
</script>
</body>
</html>
