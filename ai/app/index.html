<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Free AI</title>
<style>
  :root { --bg:#0c0e12; --panel:#161b24; --line:#2a3142; --text:#eeeae3; --muted:#8e96a8; --accent:#e7a23a; --safe:env(safe-area-inset-bottom,0px); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, sans-serif; }
  #app { height:100%; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  b { letter-spacing:.04em; }
  select { flex:1; background:#10141c; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px; }
  #log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:92%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#2a3344; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .meta { color:var(--muted); font-size:11px; margin-bottom:4px; }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + var(--safe)); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; min-height:46px; max-height:140px; background:#10141c; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:10px; font:inherit; }
  button { background:var(--accent); color:#1a1204; border:0; border-radius:12px; padding:0 16px; font-weight:700; }
  button:disabled { opacity:.5; }
  .empty { color:var(--muted); text-align:center; margin-top:18vh; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>FREE AI</b>
    <select id="model" aria-label="model"></select>
  </header>
  <div id="log"><div class="empty">Ask anything. No key. No signup.</div></div>
  <form id="box">
    <textarea id="q" rows="1" placeholder="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const MODELS = [
  { id: "DeepSeek-V4-Flash-0731", label: "DeepSeek Flash", kind: "llm7" },
  { id: "GLM-5.3-Flash", label: "GLM 5.3 Flash", kind: "llm7" },
  { id: "codestral-latest", label: "Codestral", kind: "llm7" },
  { id: "minimax-m2.7", label: "Minimax", kind: "llm7" },
  { id: "mistral-Nemo-Instruct-2407", label: "Mistral Nemo", kind: "llm7" },
  { id: "nemotron-3-nano:30b", label: "Nemotron Nano", kind: "llm7" },
  { id: "openai-fast", label: "GPT-OSS 20B", kind: "pollinations" }
];
const log = document.getElementById("log");
const q = document.getElementById("q");
const sel = document.getElementById("model");
const sendBtn = document.getElementById("send");
let history = [];

sel.innerHTML = MODELS.map((m, i) => `<option value="${i}">${m.label}</option>`).join("");
const saved = localStorage.getItem("freeai-model");
if (saved) sel.value = saved;
sel.onchange = () => localStorage.setItem("freeai-model", sel.value);

function add(role, text, meta) {
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "bot");
  el.innerHTML = (meta ? `<div class="meta"></div>` : "") + "";
  if (meta) el.querySelector(".meta").textContent = meta;
  const body = document.createElement("div");
  body.textContent = text;
  el.appendChild(body);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return body;
}

async function ask(model, messages) {
  if (model.kind === "llm7") {
    const res = await fetch("https://api.llm7.io/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer unused" },
      body: JSON.stringify({ model: model.id, messages, temperature: 0.7 })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || ("HTTP " + res.status));
    const text = data.choices?.[0]?.message?.content;
    if (!text) throw new Error("Empty reply");
    return text;
  }
  const res = await fetch("https://text.pollinations.ai/openai", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: model.id, messages, stream: false })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || ("HTTP " + res.status));
  const text = data.choices?.[0]?.message?.content;
  if (!text) throw new Error("Empty reply");
  return text;
}

async function fallbackGet(prompt) {
  const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt.slice(0, 1500)));
  if (!res.ok) throw new Error("All models failed");
  return await res.text();
}

document.getElementById("box").onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  add("user", text);
  history.push({ role: "user", content: text });
  const start = Number(sel.value) || 0;
  const order = MODELS.map((_, i) => MODELS[(start + i) % MODELS.length]);
  sendBtn.disabled = true;
  const body = add("bot", "…", order[0].label);
  try {
    let answer = "", used = order[0].label, err = "";
    for (const model of order) {
      try {
        body.parentElement.querySelector(".meta").textContent = model.label;
        answer = await ask(model, history.slice(-10));
        used = model.label;
        break;
      } catch (ex) {
        err = ex.message || String(ex);
      }
    }
    if (!answer) answer = await fallbackGet(text);
    body.textContent = answer;
    body.parentElement.querySelector(".meta").textContent = used;
    history.push({ role: "assistant", content: answer });
  } catch (ex) {
    body.textContent = "Failed. " + (ex.message || ex);
  } finally {
    sendBtn.disabled = false;
    q.focus();
  }
};
q.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("box").requestSubmit(); } };
</script>
</body>
</html>
