<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Free AI</title>
<style>
  :root { --safe: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: #f4f7ff; font: 16px/1.5 system-ui, sans-serif; }
  body {
    background:
      radial-gradient(900px 500px at 10% -10%, #6d5efc 0%, transparent 55%),
      radial-gradient(700px 420px at 110% 0%, #1aa6ff 0%, transparent 50%),
      radial-gradient(800px 500px at 50% 120%, #ff4fd8 0%, transparent 46%),
      #070b16;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; align-items: center; padding: 12px 14px 8px; }
  .mark {
    width: 36px; height: 36px; border-radius: 12px; flex: none;
    background: conic-gradient(from 120deg, #8ab4ff, #c58bff, #7dffd2, #8ab4ff);
    animation: spin 8s linear infinite;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 700; }
  h1 span { display: block; font-size: 12px; font-weight: 500; color: #c9d4ee; }
  select {
    margin-left: auto; max-width: 46vw; background: rgba(10,16,32,.72); color: #fff;
    border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 8px 12px;
  }
  #log { flex: 1; overflow: auto; padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .hello { margin: auto; text-align: center; max-width: 28rem; }
  .hello h2 {
    margin: 8px 0; font-size: 28px;
    background: linear-gradient(90deg, #8ab4ff, #d7b4ff, #7dffd2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hello p { color: #c5d0e8; margin: 0; }
  .msg { max-width: 92%; padding: 12px 14px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: linear-gradient(135deg, #4c6fff, #7a4dff); }
  .bot { align-self: flex-start; background: rgba(16,22,40,.78); border: 1px solid rgba(255,255,255,.1); }
  .meta { font-size: 11px; color: #b7c4e2; margin-bottom: 4px; }
  .orb { display: flex; gap: 6px; align-items: center; height: 22px; }
  .orb i {
    width: 8px; height: 8px; border-radius: 50%; display: block;
    background: linear-gradient(180deg, #9ec1ff, #d9b6ff);
    animation: bounce 1s infinite ease-in-out;
  }
  .orb i:nth-child(2) { animation-delay: .15s; }
  .orb i:nth-child(3) { animation-delay: .3s; }
  form {
    display: flex; gap: 8px; padding: 10px 12px calc(12px + var(--safe));
  }
  .box {
    flex: 1; display: flex; gap: 8px; align-items: flex-end;
    background: rgba(12,18,34,.86); border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px; padding: 8px 8px 8px 14px;
    box-shadow: 0 10px 40px rgba(80,90,255,.18);
  }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent; color: #fff;
    font: inherit; min-height: 24px; max-height: 120px; padding: 8px 0;
  }
  button {
    border: 0; border-radius: 16px; padding: 10px 14px; font-weight: 700; color: #08101f;
    background: linear-gradient(135deg, #9ec1ff, #d7b4ff 55%, #7dffd2);
    min-width: 72px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:disabled { opacity: .8; }
  .spin {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(8,16,31,.25); border-top-color: #08101f;
    animation: spin .7s linear infinite; display: none;
  }
  button.loading .spin { display: block; }
  button.loading .label { display: none; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-6px); opacity: 1; } }
  @keyframes spin { to { transform: rotate(1turn); } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark"></div>
    <h1>Free AI<span>No key. Just ask.</span></h1>
    <select id="model" aria-label="model"></select>
  </header>
  <div id="log">
    <div class="hello">
      <h2>Ask anything</h2>
      <p>Open models answer here. If one is busy, another takes the turn.</p>
    </div>
  </div>
  <form id="box">
    <div class="box">
      <textarea id="q" rows="1" placeholder="Message Free AI"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
</div>
<script>
const MODELS = [
  { id: "DeepSeek-V4-Flash-0731", label: "DeepSeek", kind: "llm7" },
  { id: "GLM-5.3-Flash", label: "GLM", kind: "llm7" },
  { id: "codestral-latest", label: "Codestral", kind: "llm7" },
  { id: "mistral-Nemo-Instruct-2407", label: "Mistral", kind: "llm7" },
  { id: "Qwen3.5-9B", label: "Qwen 9B", kind: "ovh" },
  { id: "gpt-oss-20b", label: "GPT-OSS", kind: "ovh" },
  { id: "Meta-Llama-3_3-70B-Instruct", label: "Llama 70B", kind: "ovh" }
];
const log = document.getElementById("log");
const q = document.getElementById("q");
const sel = document.getElementById("model");
const sendBtn = document.getElementById("send");
let history = [];

sel.innerHTML = MODELS.map((m, i) => `<option value="${i}">${m.label}</option>`).join("");
sel.value = localStorage.getItem("freeai-model") || "0";
sel.onchange = () => localStorage.setItem("freeai-model", sel.value);

function add(role, node) {
  const hello = log.querySelector(".hello");
  if (hello) hello.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.appendChild(node);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function textMsg(role, text, meta) {
  const wrap = document.createElement("div");
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    wrap.appendChild(m);
  }
  const body = document.createElement("div");
  body.textContent = text;
  wrap.appendChild(body);
  return add(role, wrap);
}

async function post(url, body, headers, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...headers },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || data.message || ("HTTP " + res.status));
    const text = data.choices?.[0]?.message?.content;
    if (!text) throw new Error("Empty reply");
    return text.trim();
  } finally {
    clearTimeout(t);
  }
}
function llm7(model, messages) {
  return post("https://api.llm7.io/v1/chat/completions", {
    model, messages, temperature: 0.6, max_tokens: 800
  }, { Authorization: "Bearer unused" }, 28000);
}
function ovh(model, messages) {
  return post("https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions", {
    model, messages, temperature: 0.6, max_tokens: 700
  }, {}, 22000);
}
async function pollinations(prompt) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 18000);
  try {
    const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt.slice(0, 1200)) + "?nocache=" + Date.now(), { signal: ctrl.signal });
    const text = await res.text();
    if (!res.ok || /api key|budget|error/i.test(text.slice(0, 180))) throw new Error("Pollinations busy");
    return text.trim();
  } finally { clearTimeout(t); }
}

async function answer(messages, prompt) {
  const start = Number(sel.value) || 0;
  const order = MODELS.map((_, i) => MODELS[(start + i) % MODELS.length]);
  let last = "no reply";
  for (const model of order) {
    try {
      const text = model.kind === "llm7" ? await llm7(model.id, messages) : await ovh(model.id, messages);
      return { text, label: model.label };
    } catch (err) {
      last = err.name === "AbortError" ? model.label + " timed out" : (err.message || String(err));
      if (/429|concurrent|rate/i.test(last)) {
        await new Promise(r => setTimeout(r, 1500));
        try {
          const text = model.kind === "llm7" ? await llm7(model.id, messages) : await ovh(model.id, messages);
          return { text, label: model.label };
        } catch (err2) {
          last = err2.message || last;
        }
      }
    }
  }
  try {
    return { text: await pollinations(prompt), label: "Open text" };
  } catch (err) {
    throw new Error(last + ". " + (err.message || ""));
  }
}

document.getElementById("box").onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || sendBtn.disabled) return;
  q.value = "";
  textMsg("user", text);
  history.push({ role: "user", content: text });
  const orb = document.createElement("div");
  orb.className = "orb";
  orb.innerHTML = "<i></i><i></i><i></i>";
  const pending = add("bot", orb);
  sendBtn.disabled = true;
  try {
    const res = await answer(history.slice(-8), text);
    pending.remove();
    textMsg("bot", res.text, res.label);
    history.push({ role: "assistant", content: res.text });
  } catch (err) {
    pending.remove();
    textMsg("bot", "Could not reach a free model. Tap Send again.\n" + (err.message || err), "retry");
    history.pop();
  } finally {
    sendBtn.disabled = false;
    sendBtn.classList.remove("loading");
    q.focus();
  }
};
q.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("box").requestSubmit(); }
};
</script>
</body>
</html>
