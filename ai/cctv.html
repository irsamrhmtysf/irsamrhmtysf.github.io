<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CCTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
.header{padding:12px 16px;background:linear-gradient(90deg,#111,#1a1a2e);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.header h1{font-size:1.1rem;font-weight:600;color:#00d4ff}
.badge{background:#e11;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.main{display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1200px;margin:0 auto}
.video-wrap{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 8px 32px rgba(0,0,0,.5)}
video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
canvas{pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:#16161f;border:1px solid #2a2a3a;border-radius:10px;padding:12px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:#00d4ff}
.stat .label{font-size:.75rem;color:#888;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:#00d4ff;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#2a2a3a;color:#ccc}
.status{font-size:.8rem;color:#888;flex:1}
.log{background:#111;border-radius:8px;padding:10px;font-size:.75rem;max-height:100px;overflow-y:auto;color:#6a6;font-family:monospace}
@media(min-width:768px){.main{padding:20px}.header h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="header">
  <h1>Computer Vision</h1>
  <span class="badge">LIVE</span>
</div>
<div class="main">
  <div class="video-wrap">
    <video id="video" muted playsinline autoplay></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="c-person">0</div><div class="label">People</div></div>
    <div class="stat"><div class="num" id="c-car">0</div><div class="label">Cars</div></div>
    <div class="stat"><div class="num" id="c-motor">0</div><div class="label">Motorcycles</div></div>
    <div class="stat"><div class="num" id="c-bus">0</div><div class="label">Buses</div></div>
    <div class="stat"><div class="num" id="c-truck">0</div><div class="label">Trucks</div></div>
    <div class="stat"><div class="num" id="c-total">0</div><div class="label">Total</div></div>
  </div>
  <div class="controls">
    <button id="btnStart" onclick="startCV()">Start Detection</button>
    <button class="secondary" onclick="stopCV()">Stop</button>
    <span class="status" id="status">Ready - Model loading...</span>
  </div>
  <div class="log" id="log">System ready.</div>
</div>
<script>
const STREAM = "https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8";
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let model = null;
let detecting = false;
let animId = null;

function log(msg) {
  var el = document.getElementById("log");
  el.textContent = new Date().toLocaleTimeString() + " | " + msg + "\n" + el.textContent.slice(0, 400);
}

function initStream() {
  if (Hls.isSupported()) {
    var hls = new Hls({enableWorker: true, lowLatencyMode: true});
    hls.loadSource(STREAM);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      video.play();
      log("HLS stream connected");
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = STREAM;
    video.play();
  }
}

async function loadModel() {
  try {
    model = await cocoSsd.load({base: "lite_mobilenet_v2"});
    document.getElementById("status").textContent = "Model ready - Press Start";
    log("COCO-SSD model loaded");
  } catch (e) {
    log("Model error: " + e.message);
  }
}

function cluster(boxes, thresh) {
  if (!thresh) thresh = 50;
  if (!boxes.length) return [];
  var used = new Array(boxes.length).fill(false);
  var clusters = [];
  for (var i = 0; i < boxes.length; i++) {
    if (used[i]) continue;
    var c = [boxes[i]];
    used[i] = true;
    for (var j = i + 1; j < boxes.length; j++) {
      if (used[j]) continue;
      var dx = (boxes[i][0] + boxes[i][2] / 2) - (boxes[j][0] + boxes[j][2] / 2);
      var dy = (boxes[i][1] + boxes[i][3] / 2) - (boxes[j][1] + boxes[j][3] / 2);
      if (Math.hypot(dx, dy) < thresh) {
        c.push(boxes[j]);
        used[j] = true;
      }
    }
    clusters.push(c);
  }
  return clusters;
}

async function detect() {
  if (!detecting || !model || video.readyState < 2) {
    animId = requestAnimationFrame(detect);
    return;
  }
  var w = video.videoWidth;
  var h = video.videoHeight;
  if (w === 0) {
    animId = requestAnimationFrame(detect);
    return;
  }
  canvas.width = w;
  canvas.height = h;
  var preds = await model.detect(video);
  ctx.clearRect(0, 0, w, h);
  var map = {person: 0, car: 0, motorcycle: 0, bus: 0, truck: 0};
  var boxes = [];
  preds.forEach(function (p) {
    if (p.score < 0.45) return;
    var cls = p.class;
    if (!(cls in map)) return;
    map[cls]++;
    var x = p.bbox[0];
    var y = p.bbox[1];
    var bw = p.bbox[2];
    var bh = p.bbox[3];
    boxes.push(p.bbox);
    ctx.strokeStyle = cls === "person" ? "#0f0" : "#00d4ff";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.font = "14px sans-serif";
    ctx.fillText(cls + " " + Math.round(p.score * 100) + "%", x, y > 15 ? y - 4 : y + 14);
  });
  var clusters = cluster(boxes);
  clusters.forEach(function (c) {
    if (c.length < 2) return;
    var cx = 0;
    var cy = 0;
    c.forEach(function (b) {
      cx += (b[0] + b[2] / 2);
      cy += (b[1] + b[3] / 2);
    });
    cx /= c.length;
    cy /= c.length;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, 6.28);
    ctx.fillStyle = "#f0f";
    ctx.fill();
  });
  document.getElementById("c-person").textContent = map.person;
  document.getElementById("c-car").textContent = map.car;
  document.getElementById("c-motor").textContent = map.motorcycle;
  document.getElementById("c-bus").textContent = map.bus;
  document.getElementById("c-truck").textContent = map.truck;
  document.getElementById("c-total").textContent = Object.values(map).reduce(function (a, b) { return a + b; }, 0);
  document.getElementById("status").textContent = "Detecting - " + preds.length + " objects - " + clusters.length + " clusters";
  animId = requestAnimationFrame(detect);
}

function startCV() {
  if (!model) {
    log("Model not ready");
    return;
  }
  detecting = true;
  document.getElementById("btnStart").disabled = true;
  log("Detection started");
  detect();
}

function stopCV() {
  detecting = false;
  if (animId) cancelAnimationFrame(animId);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById("btnStart").disabled = false;
  document.getElementById("status").textContent = "Stopped";
  log("Detection stopped");
}

initStream();
loadModel();
</script>
</body>
</html>
