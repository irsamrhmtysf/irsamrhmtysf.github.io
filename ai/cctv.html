<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batam AI Traffic Vision | APACE-style</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0e14;--card:#12161f;--border:#1e2533;--accent:#00c2ff;--green:#00e676;--orange:#ff9100;--red:#ff1744;--purple:#d500f9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#d0d8e4;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;font-size:14px}
.topbar{background:linear-gradient(90deg,#0d111a,#151c2c);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.topbar h1{font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:.3px}
.badge-live{background:var(--red);color:#fff;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:4px;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:grid;grid-template-columns:1fr;gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media(min-width:900px){.layout{grid-template-columns:1.4fr 1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;overflow:hidden}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
canvas{pointer-events:none}
.cam-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
select,input[type=text]{background:#0d111a;color:#c8d0dc;border:1px solid #2a3344;border-radius:6px;padding:7px 10px;font-size:.82rem;flex:1;min-width:120px}
button{background:var(--accent);color:#000;border:none;padding:7px 12px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.8rem}
.density{text-align:center;padding:10px;border-radius:8px;font-weight:700;font-size:1.1rem;margin:8px 0;letter-spacing:.5px}
.d-sangat-lengang{background:#0a2f1a;color:var(--green)}
.d-lengang{background:#0d3b1f;color:#69f0ae}
.d-normal{background:#1a2a3a;color:var(--accent)}
.d-padat{background:#3a2a0a;color:var(--orange)}
.d-sangat-padat{background:#3a0a0a;color:var(--red)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:500px){.metrics{grid-template-columns:repeat(3,1fr)}}
.metric{background:#0d111a;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.metric .val{font-size:1.45rem;font-weight:700;color:var(--accent);line-height:1.1}
.metric .lbl{font-size:.68rem;color:#7a8494;margin-top:2px}
.cls-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.cls{background:#0d111a;border-radius:6px;padding:8px 4px;text-align:center;border:1px solid var(--border)}
.cls .n{font-size:1.25rem;font-weight:700}
.cls .l{font-size:.62rem;color:#7a8494}
.chart-box{height:160px;margin-top:8px}
.status-line{font-size:.72rem;color:#6a7484;margin-top:6px}
.decision{background:#0d1a12;border:1px solid #1a3a28;border-radius:8px;padding:10px;margin-top:8px;font-size:.82rem;line-height:1.4}
.decision strong{color:var(--green)}
.log{font-family:monospace;font-size:.68rem;color:#4caf50;max-height:70px;overflow-y:auto;margin-top:6px;background:#0a0d12;padding:6px;border-radius:4px}
</style>
</head>
<body>
<div class="topbar">
  <h1>BATAM AI TRAFFIC VISION</h1>
  <span class="badge-live">LIVE AI</span>
</div>

<div class="layout">
  <div class="card">
    <div class="cam-row">
      <select id="camSelect" onchange="changeCam()">
        <option value="https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8">Simp. Kuda 1</option>
        <option value="https://matanya.batam.go.id/cctv/atap/stream.m3u8">Atap Kantor Walikota</option>
        <option value="https://matanya.batam.go.id/cctv/casablanca2/stream.m3u8">Simp. Casablanca</option>
        <option value="https://matanya.batam.go.id/cctv/matakucing1/stream.m3u8">Mata Kucing 1</option>
        <option value="https://matanya.batam.go.id/cctv/pasarjodoh2/stream.m3u8">Pasar Jodoh 2</option>
        <option value="https://matanya.batam.go.id/cctv/madanipancuran/stream.m3u8">Bundaran Madani Pancuran</option>
        <option value="https://matanya.batam.go.id/cctv/madaniseipanas/stream.m3u8">Madani Arah S. Panas</option>
        <option value="https://matanya.batam.go.id/cctv/batuaji/stream.m3u8">SP Batu Aji</option>
        <option value="https://matanya.batam.go.id/cctv/gerutara/stream.m3u8">Gerb. Utara Engku Putri</option>
        <option value="https://matanya.batam.go.id/cctv/southgate/stream.m3u8">Gerb. Selatan Engku Putri</option>
        <option value="https://matanya.batam.go.id/cctv/kejaksaanbi/stream.m3u8">Kejaksaan BI</option>
        <option value="https://matanya.batam.go.id/cctv/punggur1/stream.m3u8">Pelabuhan Punggur</option>
        <option value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8">Pelabuhan Sekupang</option>
        <option value="https://matanya.batam.go.id/cctv/delta2/stream.m3u8">Delta Villa 2</option>
        <option value="https://matanya.batam.go.id/cctv/sambau2/stream.m3u8">Sambau 2</option>
        <option value="https://matanya.batam.go.id/cctv/pura1/stream.m3u8">Pura Sei Ladi 1</option>
        <option value="https://matanya.batam.go.id/cctv/cobaan/stream.m3u8">Pos DPRD</option>
        <option value="https://matanya.batam.go.id/cctv/sambau1/stream.m3u8">Sambau 1</option>
        <option value="https://matanya.batam.go.id/cctv/sukajadi2/stream.m3u8">Sukajadi 2</option>
        <option value="https://matanya.batam.go.id/cctv/southlink1/stream.m3u8">Tanjakan Southlink</option>
      </select>
      <input type="text" id="customUrl" placeholder="Paste m3u8 URL...">
      <button onclick="loadCustom()">Load</button>
    </div>
    <div class="video-box">
      <video id="video" muted playsinline autoplay></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="status-line" id="status">Initializing AI model...</div>
    <div class="log" id="log">System online.</div>
  </div>

  <div class="card">
    <div id="densityBox" class="density d-normal">NORMAL</div>

    <div class="metrics">
      <div class="metric"><div class="val" id="m-now">0</div><div class="lbl">Kendaraan Sekarang</div></div>
      <div class="metric"><div class="val" id="m-min">0</div><div class="lbl">Vol / Menit</div></div>
      <div class="metric"><div class="val" id="m-total">0</div><div class="lbl">Total Sesi</div></div>
      <div class="metric"><div class="val" id="m-speed">-</div><div class="lbl">Est. Kecepatan</div></div>
      <div class="metric"><div class="val" id="m-people">0</div><div class="lbl">Pejalan Kaki</div></div>
      <div class="metric"><div class="val" id="m-cluster">0</div><div class="lbl">Klaster</div></div>
    </div>

    <div class="cls-grid">
      <div class="cls"><div class="n" id="c-motor" style="color:#ffea00">0</div><div class="l">Motor</div></div>
      <div class="cls"><div class="n" id="c-mobil" style="color:#00c2ff">0</div><div class="l">Mobil</div></div>
      <div class="cls"><div class="n" id="c-sedang" style="color:#ff9100">0</div><div class="l">Sedang</div></div>
      <div class="cls"><div class="n" id="c-bus" style="color:#d500f9">0</div><div class="l">Bus</div></div>
      <div class="cls"><div class="n" id="c-truk" style="color:#ff1744">0</div><div class="l">Truk</div></div>
    </div>

    <!-- <div class="chart-box"><canvas id="volChart"></canvas></div> -->

    <div class="decision" id="decision">
      <strong>Keputusan AI:</strong> Menunggu data lalu lintas...
    </div>
  </div>
</div>

<script>
var STREAM = "https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8";
var video = document.getElementById("video");
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var model = null, detecting = false, animId = null, hls = null;
var frameSkip = 0, SKIP = 3;
var prevCentroids = [];
var sessionTotal = 0;
var minuteBuffer = [];
var chartData = {labels: [], values: []};
var volChart = null;
var speedSamples = [];

function log(msg) {
  var el = document.getElementById("log");
  el.textContent = new Date().toLocaleTimeString() + " | " + msg + "\n" + el.textContent.slice(0, 280);
}
function setDensity(total) {
  var box = document.getElementById("densityBox");
  var cls, txt;
  if (total <= 2) { cls = "d-sangat-lengang"; txt = "SANGAT LENGANG"; }
  else if (total <= 5) { cls = "d-lengang"; txt = "LENGANG"; }
  else if (total <= 12) { cls = "d-normal"; txt = "NORMAL"; }
  else if (total <= 20) { cls = "d-padat"; txt = "PADAT"; }
  else { cls = "d-sangat-padat"; txt = "SANGAT PADAT"; }
  box.className = "density " + cls;
  box.textContent = txt;
  return txt;
}
function updateDecision(total, density, motor, mobil) {
  var el = document.getElementById("decision");
  var rec = "";
  if (density.indexOf("SANGAT PADAT") >= 0) rec = "Lalu lintas sangat padat. Pertimbangkan rekayasa lalu lintas atau pengalihan. Prioritaskan keselamatan.";
  else if (density.indexOf("PADAT") >= 0) rec = "Kepadatan meningkat. Pantau terus. Siapkan langkah mitigasi jika tren naik.";
  else if (density.indexOf("NORMAL") >= 0) rec = "Kondisi normal. Tidak ada tindakan khusus diperlukan saat ini.";
  else rec = "Lalu lintas lengang. Kondisi optimal untuk perjalanan.";
  el.innerHTML = "<strong>Keputusan AI:</strong> " + rec + " <br><small>Motor: " + motor + " | Mobil: " + mobil + " | Total objek: " + total + "</small>";
}

function initChart() {
  var ctxC = document.getElementById("volChart").getContext("2d");
  volChart = new Chart(ctxC, {
    type: "line",
    data: {
      labels: chartData.labels,
      datasets: [{
        label: "Volume",
        data: chartData.values,
        borderColor: "#00c2ff",
        backgroundColor: "rgba(0,194,255,0.12)",
        tension: 0.3,
        fill: true,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { beginAtZero: true, ticks: { color: "#6a7484", font: { size: 10 } }, grid: { color: "#1e2533" } }
      }
    }
  });
}
function pushChart(val) {
  var t = new Date().toLocaleTimeString().slice(0, 5);
  chartData.labels.push(t);
  chartData.values.push(val);
  if (chartData.labels.length > 30) { chartData.labels.shift(); chartData.values.shift(); }
  if (volChart) volChart.update("none");
}

function destroyHls() { if (hls) { hls.destroy(); hls = null; } }
function initStream(url) {
  STREAM = url;
  destroyHls();
  detecting = false;
  if (animId) cancelAnimationFrame(animId);
  ctx.clearRect(0, 0, canvas.width || 1, canvas.height || 1);
  prevCentroids = [];
  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 8 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      video.play().catch(function () {});
      log("Stream connected");
      tryAutoStart();
    });
    hls.on(Hls.Events.ERROR, function (e, d) { if (d.fatal) log("Stream error"); });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play().catch(function () {});
    tryAutoStart();
  }
}
function changeCam() {
  document.getElementById("customUrl").value = "";
  initStream(document.getElementById("camSelect").value);
  log("Camera switched");
}
function loadCustom() {
  var u = document.getElementById("customUrl").value.trim();
  if (u) { initStream(u); log("Custom URL loaded"); }
}

async function loadModel() {
  try {
    model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    document.getElementById("status").textContent = "AI model ready • Auto starting...";
    log("COCO-SSD loaded");
    tryAutoStart();
  } catch (e) {
    log("Model fail: " + e.message);
    document.getElementById("status").textContent = "Model error";
  }
}
function tryAutoStart() {
  if (model && video.readyState >= 2 && !detecting) {
    detecting = true;
    document.getElementById("status").textContent = "AI detecting live...";
    log("Detection started");
    detect();
  }
}

function estimateSpeed(curr) {
  if (!prevCentroids.length || !curr.length) { prevCentroids = curr; return null; }
  var speeds = [];
  for (var i = 0; i < curr.length; i++) {
    var best = 9999, bestJ = -1;
    for (var j = 0; j < prevCentroids.length; j++) {
      var d = Math.hypot(curr[i].x - prevCentroids[j].x, curr[i].y - prevCentroids[j].y);
      if (d < best && d < 80) { best = d; bestJ = j; }
    }
    if (bestJ >= 0 && best > 2) {
      var kmh = Math.min(120, Math.round(best * 0.4));
      speeds.push(kmh);
    }
  }
  prevCentroids = curr;
  if (!speeds.length) return null;
  var avg = Math.round(speeds.reduce(function (a, b) { return a + b; }, 0) / speeds.length);
  speedSamples.push(avg);
  if (speedSamples.length > 10) speedSamples.shift();
  return Math.round(speedSamples.reduce(function (a, b) { return a + b; }, 0) / speedSamples.length);
}

async function detect() {
  if (!detecting || !model) return;
  if (video.readyState < 2) { animId = requestAnimationFrame(detect); return; }
  frameSkip++;
  if (frameSkip < SKIP) { animId = requestAnimationFrame(detect); return; }
  frameSkip = 0;

  var w = video.videoWidth, h = video.videoHeight;
  if (!w) { animId = requestAnimationFrame(detect); return; }
  canvas.width = w; canvas.height = h;

  var preds = await model.detect(video, 25);
  ctx.clearRect(0, 0, w, h);

  var counts = { motor: 0, mobil: 0, sedang: 0, bus: 0, truk: 0, person: 0 };
  var boxes = [];
  var centroids = [];

  for (var i = 0; i < preds.length; i++) {
    var p = preds[i];
    if (p.score < 0.38) continue;
    var cls = p.class;
    var cat = null;
    if (cls === "person") cat = "person";
    else if (cls === "motorcycle" || cls === "bicycle") cat = "motor";
    else if (cls === "car") cat = "mobil";
    else if (cls === "bus") cat = "bus";
    else if (cls === "truck") cat = "truk";
    else if (cls === "train" || cls === "boat") cat = "sedang";
    if (!cat) continue;

    counts[cat]++;
    var x = p.bbox[0], y = p.bbox[1], bw = p.bbox[2], bh = p.bbox[3];
    boxes.push(p.bbox);
    centroids.push({ x: x + bw / 2, y: y + bh / 2 });

    var color = cat === "person" ? "#00e676" : cat === "motor" ? "#ffea00" : cat === "mobil" ? "#00c2ff" : cat === "bus" ? "#d500f9" : "#ff1744";
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = color;
    ctx.font = "12px sans-serif";
    ctx.fillText(cls + " " + Math.round(p.score * 100) + "%", x, y > 12 ? y - 3 : y + 12);
  }

  var clusters = 0;
  var used = new Array(boxes.length).fill(false);
  for (var a = 0; a < boxes.length; a++) {
    if (used[a]) continue;
    clusters++;
    used[a] = true;
    for (var b = a + 1; b < boxes.length; b++) {
      if (used[b]) continue;
      var dx = (boxes[a][0] + boxes[a][2] / 2) - (boxes[b][0] + boxes[b][2] / 2);
      var dy = (boxes[a][1] + boxes[a][3] / 2) - (boxes[b][1] + boxes[b][3] / 2);
      if (Math.hypot(dx, dy) < 70) used[b] = true;
    }
  }

  var totalVeh = counts.motor + counts.mobil + counts.sedang + counts.bus + counts.truk;
  var totalAll = totalVeh + counts.person;
  if (totalVeh > 0) sessionTotal++;

  var now = Date.now();
  minuteBuffer.push({ t: now, n: totalVeh });
  minuteBuffer = minuteBuffer.filter(function (x) { return now - x.t < 60000; });
  var volMin = 0;
  for (var m = 0; m < minuteBuffer.length; m++) volMin += minuteBuffer[m].n;
  volMin = Math.round(volMin / Math.max(1, minuteBuffer.length / 12));

  var avgSpeed = estimateSpeed(centroids);

  document.getElementById("c-motor").textContent = counts.motor;
  document.getElementById("c-mobil").textContent = counts.mobil;
  document.getElementById("c-sedang").textContent = counts.sedang;
  document.getElementById("c-bus").textContent = counts.bus;
  document.getElementById("c-truk").textContent = counts.truk;
  document.getElementById("m-now").textContent = totalVeh;
  document.getElementById("m-min").textContent = volMin;
  document.getElementById("m-total").textContent = sessionTotal;
  document.getElementById("m-people").textContent = counts.person;
  document.getElementById("m-cluster").textContent = clusters;
  document.getElementById("m-speed").textContent = avgSpeed ? avgSpeed + " km/h" : "-";

  var dens = setDensity(totalVeh);
  updateDecision(totalAll, dens, counts.motor, counts.mobil);
  document.getElementById("status").textContent = "Live AI • " + totalAll + " objek • " + dens;

  if (Math.random() < 0.3) pushChart(totalVeh);

  animId = requestAnimationFrame(detect);
}

video.addEventListener("playing", tryAutoStart);
initChart();
initStream(STREAM);
loadModel();
</script>
</body>
</html>
