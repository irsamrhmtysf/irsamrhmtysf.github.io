<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Private Vision</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.3.2/dist/coco-ssd.min.js"></script>
<style>
body{margin:0;background:#050505;color:#eee;font-family:system-ui}
.header{padding:10px;background:#111;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{padding:10px;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}
.btn{padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.btn-g{background:#00ff88;color:#000;flex:1}
.btn-d{background:#222;color:#fff;flex:1}
.wrap{max-width:960px;margin:auto;padding:10px}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:contain}
#canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#bar{height:3px;background:#00ff88;width:0%;transition:width.3s}
.card{background:#151515;padding:8px;border-radius:8px;text-align:center}
</style>
</head>
<body>
<div class="header">
  <b>PRIVATE VISION</b><span style="font-size:10px;background:#00ff88;color:#000;padding:2px 6px;border-radius:10px">OFFLINE • NO UPLOAD</span>
  <select id="modelSel" style="margin-left:auto;min-width:220px">
    <option value="lite">LITE - 1.8MB - 0.5s Load</option>
    <option value="fast" selected>FAST - 6MB - 2s - Recommended</option>
    <option value="accurate">ACCURATE - YOLOv5n - 7MB</option>
    <option value="big">BIG - YOLOv8n - 12MB - Best Accuracy</option>
  </select>
</div>
<div id="bar"></div>

<div class="wrap">
  <div id="log" style="font-size:12px;color:#888;margin:6px 0">Ready. Video plays instantly. AI loads in background.</div>
  <div style="display:flex;gap:8px;margin:8px 0">
    <button class="btn btn-g" id="btnCam">USE DEVICE CAMERA</button>
    <button class="btn btn-d" id="btnUrl">USE STREAM URL</button>
  </div>
  <input id="urlInput" type="password" value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8" placeholder="Paste.m3u8 here (hidden for privacy)" style="width:100%;box-sizing:border-box">
  <div style="font-size:11px;color:#555"><input type="checkbox" id="showUrl" onchange="document.getElementById('urlInput').type=this.checked?'text':'password'"> show URL • <span id="fps">0 FPS</span> • <span id="modelInfo">Loading...</span></div>

  <div class="stage" style="margin-top:10px">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="overlay" style="position:absolute;color:#444">No signal - Start Camera or Stream</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px">
    <div class="card"><b id="c-car">0</b><br>Car</div>
    <div class="card"><b id="c-bike">0</b><br>Bike</div>
    <div class="card"><b id="c-truck">0</b><br>Truck</div>
    <div class="card"><b id="c-person">0</b><br>Person</div>
    <div class="card"><b id="c-total">0</b><br>Total</div>
  </div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-d" onclick="stopAll()">STOP & WIPE</button>
    <button class="btn btn-d" onclick="document.getElementById('urlInput').value='';stopAll()">CLEAR URL</button>
  </div>
</div>

<script>
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/";
let cocoModel=null, yoloSession=null, currentType='fast', hls=null, stream=null, animId=null, isDetecting=false;
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const MODELS={
  lite:{type:'coco', base:'lite_mobilenet_v2'},
  fast:{type:'coco', base:'mobilenet_v2'},
  accurate:{type:'yolo', url:'https://huggingface.co/Xenova/yolov8n/resolve/main/onnx/model.onnx'},
  big:{type:'yolo', url:'https://huggingface.co/Xenova/yolov8s/resolve/main/onnx/model.onnx'}
};
const CLASSES=["person","bicycle","car","motorcycle","airplane","bus","train","truck","boat","traffic light","fire hydrant","stop sign","parking meter","bench","bird","cat","dog","horse","sheep","cow","elephant","bear","zebra","giraffe","backpack","umbrella","handbag","tie","suitcase","frisbee","skis","snowboard","sports ball","kite","baseball bat","baseball glove","skateboard","surfboard","tennis racket","bottle","wine glass","cup","fork","knife","spoon","bowl","banana","apple","sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","chair","couch","potted plant","bed","dining table","toilet","tv","laptop","mouse","remote","keyboard","cell phone","microwave","oven","toaster","sink","refrigerator","book","clock","vase","scissors","teddy bear","hair drier","toothbrush"];

function setBar(p){document.getElementById('bar').style.width=p+'%'}
function log(t){document.getElementById('log').innerText=t}

async function loadModel(type){
  currentType=type; setBar(10); document.getElementById('modelInfo').innerText='Loading '+type+'...';
  try{
    if(MODELS[type].type==='coco'){
      log(`Loading ${type.toUpperCase()} - ${type==='lite'?'1.8MB - fastest':'6MB - balanced'} - offline`);
      setBar(40); cocoModel=await cocoSsd.load({base:MODELS[type].base}); yoloSession=null; setBar(100);
      log(`${type.toUpperCase()} READY - Video works instantly`);
    }else{
      log(`Loading ${type.toUpperCase()} YOLO - ${type==='accurate'?'12MB':'22MB'} - may take 10-15s first time`);
      setBar(20); cocoModel=null;
      yoloSession=await ort.InferenceSession.create(MODELS[type].url,{executionProviders:['wasm'],graphOptimizationLevel:'all'});
      setBar(100); log(`${type.toUpperCase()} READY - Real YOLO running 100% offline`);
    }
    document.getElementById('modelInfo').innerText=type.toUpperCase()+' ready'; setTimeout(()=>setBar(0),1000);
  }catch(e){ log('Load failed, fallback LITE: '+e.message); currentType='lite'; cocoModel=await cocoSsd.load({base:'lite_mobilenet_v2'}); }
}

function preprocess(video){
  const size=640;
  const tempCanvas=document.createElement('canvas'); tempCanvas.width=size; tempCanvas.height=size;
  const tCtx=tempCanvas.getContext('2d');
  tCtx.drawImage(video,0,0,size,size);
  const data=tCtx.getImageData(0,0,size,size).data;
  const float32=new Float32Array(3*size*size);
  for(let i=0,j=0;i<data.length;i+=4,j++){
    float32[j]=data[i]/255; float32[j+size*size]=data[i+1]/255; float32[j+2*size*size]=data[i+2]/255;
  }
  return float32;
}

function iou(a,b){ const x1=Math.max(a[0],b[0]), y1=Math.max(a[1],b[1]), x2=Math.min(a[2],b[2]), y2=Math.min(a[3],b[3]); const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1); const ua=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-inter; return inter/ua; }

async function detectYOLO(){
  if(!yoloSession||video.readyState<2) return [];
  const input=preprocess(video);
  const tensor=new ort.Tensor('float32',input,[1,3,640,640]);
  const feeds={images:tensor};
  const results=await yoloSession.run(feeds);
  const output=results[Object.keys(results)[0]].data;
  let boxes=[];
  for(let i=0;i<8400;i++){
    let maxScore=0, classId=-1;
    for(let c=0;c<80;c++){ let s=output[4*8400 + c*8400 + i]; if(s>maxScore){maxScore=s; classId=c;} }
    if(maxScore>0.35){
      let x=output[i], y=output[8400+i], w=output[2*8400+i], h=output[3*8400+i];
      let x1=(x-w/2)/640*canvas.width, y1=(y-h/2)/640*canvas.height, x2=(x+w/2)/640*canvas.width, y2=(y+h/2)/640*canvas.height;
      boxes.push({x1,y1,x2,y2,score:maxScore,classId});
    }
  }
  boxes.sort((a,b)=>b.score-a.score);
  let final=[];
  for(let b of boxes){
    if(!final.some(f=>f.classId===b.classId && iou([f.x1,f.y1,f.x2,f.y2],[b.x1,b.y1,b.x2,b.y2])>0.5)) final.push(b);
    if(final.length>20) break;
  }
  return final;
}

async function useCamera(){
  stopAll(); log('Requesting camera...');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:640,facingMode:'environment'},audio:false});
    video.srcObject=stream; await video.play(); document.getElementById('overlay').style.display='none'; startLoop();
  }catch(e){ log('Camera error: '+e.message+' - Need HTTPS + Chrome'); }
}
function useStream(){
  stopAll(); let url=document.getElementById('urlInput').value.trim(); if(!url) return alert('Paste URL');
  log('Connecting stream - private, no log'); document.getElementById('overlay').style.display='none';
  const play=(src)=>{
    if(Hls.isSupported()){
      hls=new Hls(); hls.loadSource(src); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().then(()=>startLoop()));
      hls.on(Hls.Events.ERROR,(ev,d)=>{ if(d.fatal){ log('CORS blocked, trying proxy...'); hls.destroy(); play('https://corsproxy.io/?'+encodeURIComponent(url)); } });
    }else{ video.src=src; video.play().then(()=>startLoop()); }
  }; play(url);
}

function startLoop(){
  if(isDetecting) return; isDetecting=true; let last=performance.now(), f=0;
  canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||360;
  const loop=async()=>{
    if(video.readyState>=2){
      if(canvas.width!==video.videoWidth){ canvas.width=video.videoWidth; canvas.height=video.videoHeight; }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let counts={car:0,bike:0,truck:0,person:0,total:0};
      try{
        if(cocoModel){
          let preds=await cocoModel.detect(video,20,currentType==='lite'?0.45:0.35);
          preds.forEach(p=>{
            if(['car','motorcycle','bus','truck','person'].includes(p.class)){
              if(p.class==='car') counts.car++; else if(p.class==='motorcycle') counts.bike++; else if(p.class==='truck'||p.class==='bus') counts.truck++; else counts.person++;
              counts.total++; ctx.strokeStyle='#00ff88'; ctx.lineWidth=2; ctx.strokeRect(...p.bbox);
              ctx.fillStyle='#00ff88'; ctx.font='11px monospace'; ctx.fillText(p.class+' '+Math.round(p.score*100)+'%',p.bbox[0],p.bbox[1]-4);
            }
          });
        }else if(yoloSession){
          let boxes=await detectYOLO();
          boxes.forEach(b=>{
            let name=CLASSES[b.classId]; let isVehicle=['car','motorcycle','bus','truck','bicycle'].includes(name);
            if(isVehicle||name==='person'){
              if(name==='car') counts.car++; else if(name==='motorcycle'||name==='bicycle') counts.bike++; else if(name==='truck'||name==='bus') counts.truck++; else counts.person++;
              counts.total++; ctx.strokeStyle=isVehicle?'#00ff88':'#00d4ff'; ctx.lineWidth=2;
              ctx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
              ctx.fillStyle=ctx.strokeStyle; ctx.fillText(name+' '+Math.round(b.score*100)+'%',b.x1,b.y1-4);
            }
          });
        }
      }catch(e){}
      document.getElementById('c-car').innerText=counts.car; document.getElementById('c-bike').innerText=counts.bike;
      document.getElementById('c-truck').innerText=counts.truck; document.getElementById('c-person').innerText=counts.person;
      document.getElementById('c-total').innerText=counts.total;
      f++; if(performance.now()-last>1000){ document.getElementById('fps').innerText=Math.round(f*1000/(performance.now()-last))+' FPS'; f=0; last=performance.now(); }
    }
    animId=requestAnimationFrame(loop);
  }; loop();
}

function stopAll(){
  isDetecting=false; if(animId) cancelAnimationFrame(animId);
  if(hls){hls.destroy();hls=null} if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.pause(); video.src=''; video.srcObject=null; ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('overlay').style.display='block';
}

document.getElementById('btnCam').onclick=useCamera;
document.getElementById('btnUrl').onclick=useStream;
document.getElementById('modelSel').onchange=e=>loadModel(e.target.value);
loadModel('fast');
</script>
</body>
</html>
