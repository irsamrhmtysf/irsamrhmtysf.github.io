<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Vision V3 - YOLOv12 Offline</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<!-- ONLINE CDN - will fallback to local if blocked -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js" onerror="this.onerror=null; loadLocal('ort.min.js')"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js" onerror="loadLocal('tf.min.js')"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.3.2/dist/coco-ssd.min.js" onerror="loadLocal('coco-ssd.min.js')"></script>
<style>
body{margin:0;background:#070707;color:#eee;font-family:system-ui}
.h{padding:10px;background:#111;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input{padding:9px;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:8px}
.btn{padding:10px 14px;border:0;border-radius:9px;font-weight:700;cursor:pointer}
.g{background:#00ff88;color:#000}.d{background:#222;color:#fff}.y{background:#ffdd00;color:#000}
.wrap{max-width:1000px;margin:auto;padding:8px}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
#video{width:100%;height:100%;object-fit:contain} #cvs{position:absolute;top:0;left:0;width:100%;height:100%}
#bar{height:3px;background:#00ff88;width:0%;transition:.3s}
.card{background:#141414;padding:8px;border-radius:8px;text-align:center;font-size:12px}
</style>
<script>
function loadLocal(f){let s=document.createElement('script'); s.src='./'+f; document.head.appendChild(s); console.log('Loaded local '+f);}
if(typeof ort!=='undefined'){ort.env.wasm.wasmPaths="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/"; ort.env.wasm.numThreads=1;}
</script>
</head>
<body>
<div class="h">
  <b>VISION V3 - YOLOv12</b>
  <select id="modelSel">
    <option value="coco-lite">COCO LITE - 0.3s - Offline OK</option>
    <option value="coco-fast" selected>COCO FAST - 1.5s - Offline OK</option>
    <option value="yolo12n">YOLOv12n - 6MB - Best Speed/Acc</option>
    <option value="yolo12s">YOLOv12s - 21MB - Most Accurate</option>
  </select>
  <span id="mode" style="font-size:10px;background:#222;padding:3px 7px;border-radius:10px">Checking...</span>
</div>
<div id="bar"></div>
<div class="wrap">
  <div id="log" style="font-size:12px;color:#888">Init...</div>
  <div style="display:flex;gap:6px;margin:8px 0">
    <button class="btn g" id="btnCam">CAMERA</button>
    <button class="btn d" id="btnUrl">STREAM</button>
    <button class="btn y" id="btnLine">DRAW LINE</button>
    <button class="btn d" id="btnClear">CLEAR</button>
  </div>
  <input id="urlInput" type="password" value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8" style="width:100%;box-sizing:border-box">
  <div class="stage" style="margin-top:8px">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="cvs"></canvas>
  </div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px">
    <div class="card"><b id="cc">0</b><br>Car</div><div class="card"><b id="cb">0</b><br>Motor</div><div class="card"><b id="ct">0</b><br>Truck/Bus</div><div class="card"><b id="cp">0</b><br>Person</div><div class="card"><b id="ctot">0</b><br>Cross</div>
  </div>
</div>

<script>
let model=null, mType='coco', hls=null, stream=null, animId=null, line=null, tmp=[], drawing=false;
let tracks={}, nextId=0, counts={car:0,motor:0,truck:0,person:0,total:0};
const video=document.getElementById('video'), cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
const CLASSES=["person","bicycle","car","motorcycle","airplane","bus","train","truck","boat","traffic light"];
const log=t=>document.getElementById('log').innerText=t;
const setBar=p=>document.getElementById('bar').style.width=p+'%';
const setMode=t=>document.getElementById('mode').innerText=t;

async function loadModel(type){
  setBar(10); mType=type.startsWith('yolo')?'yolo':'coco';
  try{
    if(mType==='coco'){
      let base=type==='coco-lite'?'lite_mobilenet_v2':'mobilenet_v2';
      log('Loading COCO '+base+' - works offline...');
      setBar(40);
      // wait for cocoSsd to be available (local or CDN)
      for(let i=0;i<50 &&!window.cocoSsd;i++){await new Promise(r=>setTimeout(r,100));}
      model=await cocoSsd.load({base}); setBar(100); setMode('COCO OFFLINE READY'); log('COCO READY');
    }else{
      // YOLOv12
      let localFile = type==='yolo12n'?'./yolov12n.onnx':'./yolov12s.onnx';
      let cdnUrl = type==='yolo12n'
       ? 'https://huggingface.co/Ultralytics/YOLOv12n/resolve/main/yolov12n.onnx'
        : 'https://huggingface.co/Ultralytics/YOLOv12s/resolve/main/yolov12s.onnx';
      let cdnFallback = 'https://cdn.jsdelivr.net/gh/ultralytics/assets@main/yolov8n.onnx';

      log('Trying YOLOv12 OFFLINE: '+localFile);
      setBar(20);
      try{
        // Try local first
        model=await ort.InferenceSession.create(localFile, {executionProviders:['wasm']});
        setBar(100); setMode('YOLOv12 OFFLINE'); log('YOLOv12n OFFLINE READY - no internet needed');
      }catch(eLocal){
        log('Local not found, trying CDN: '+cdnUrl);
        setBar(40);
        try{
          model=await ort.InferenceSession.create(cdnUrl, {executionProviders:['wasm']});
          setBar(100); setMode('YOLOv12 ONLINE'); log('YOLOv12 ONLINE READY');
        }catch(eCdn){
          log('CDN blocked, trying fallback YOLOv8n...');
          try{
            model=await ort.InferenceSession.create(cdnFallback, {executionProviders:['wasm']});
            setBar(100); setMode('YOLOv8 ONLINE'); log('YOLOv8n READY (fallback)');
          }catch(e2){
            throw e2;
          }
        }
      }
    }
  }catch(e){
    log('YOLO failed: '+e.message+' -> fallback COCO LITE');
    for(let i=0;i<50 &&!window.cocoSsd;i++){await new Promise(r=>setTimeout(r,100));}
    model=await cocoSsd.load({base:'lite_mobilenet_v2'}); mType='coco'; setMode('COCO FALLBACK');
  }
  setTimeout(()=>setBar(0),1000);
}

function preprocess(){
  const S=640; let tmpC=document.createElement('canvas'); tmpC.width=S; tmpC.height=S;
  let tCtx=tmpC.getContext('2d'); tCtx.drawImage(video,0,0,S,S);
  let d=tCtx.getImageData(0,0,S,S).data; let f=new Float32Array(3*S*S);
  for(let i=0,j=0;i<d.length;i+=4,j++){ f[j]=d[i]/255; f[j+S*S]=d[i+1]/255; f[j+2*S*S]=d[i+2]/255; }
  return new ort.Tensor('float32', f, [1,3,S,S]);
}
function iou(a,b){let x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[2],b[2]),y2=Math.min(a[3],b[3]); let inter=Math.max(0,x2-x1)*Math.max(0,y2-y1); let u=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-inter; return inter/(u||1);}
function getSide(px,py){ if(!line) return 0; return (line[2]-line[0])*(py-line[1]) - (line[3]-line[1])*(px-line[0]); }

async function detectFrame(){
  if(mType==='coco'){
    return (await model.detect(video,15,0.4)).map(p=>({bbox:p.bbox, class:p.class, score:p.score, x1:p.bbox[0], y1:p.bbox[1], x2:p.bbox[0]+p.bbox[2], y2:p.bbox[1]+p.bbox[3]}));
  }else{
    let input=preprocess(); let feeds={images:input}; let out=await model.run(feeds);
    let data=out[Object.keys(out)[0]].data; let boxes=[];
    for(let i=0;i<8400;i++){
      let max=0, cid=-1;
      for(let c=4;c<84;c++){ let s=data[c*8400+i]; if(s>max){max=s; cid=c-4;}}
      if(max>0.35){let x=data[i], y=data[8400+i], w=data[2*8400+i], h=data[3*8400+i];
        let x1=(x-w/2)/640*cvs.width, y1=(y-h/2)/640*cvs.height, x2=(x+w/2)/640*cvs.width, y2=(y+h/2)/640*cvs.height;
        if(cid<10) boxes.push({x1,y1,x2,y2,bbox:[x1,y1,x2-x1,y2-y1],class:CLASSES[cid],score:max});
      }
    }
    boxes.sort((a,b)=>b.score-a.score); let fin=[]; for(let b of boxes){ if(!fin.some(f=>f.class===b.class && iou([f.x1,f.y1,f.x2,f.y2],[b.x1,b.y1,b.x2,b.y2])>0.5)) fin.push(b);} return fin;
  }
}

function startLoop(){
  if(animId) cancelAnimationFrame(animId); cvs.width=video.videoWidth||640; cvs.height=video.videoHeight||360;
  let loop=async()=>{
    if(video.readyState>=2){
      if(cvs.width!==video.videoWidth){cvs.width=video.videoWidth; cvs.height=video.videoHeight;}
      ctx.clearRect(0,0,cvs.width,cvs.height);
      if(line){ctx.strokeStyle='#00ff88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(line[0],line[1]);ctx.lineTo(line[2],line[3]);ctx.stroke();}
      if(tmp.length==1){ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(tmp[0][0],tmp[0][1],5,0,7);ctx.fill();}

      try{
        let dets=await detectFrame(); let newTracks={};
        dets.forEach(d=>{
          if(!['car','motorcycle','bus','truck','bicycle','person'].includes(d.class)) return;
          let cx=d.x1+d.bbox[2]/2, cy=d.y1+d.bbox[3]/2;
          let best=null, bestDist=1000;
          for(let id in tracks){let t=tracks[id]; let dist=Math.hypot(t.x-cx, t.y-cy); if(dist<bestDist && dist<80){bestDist=dist; best=t;}}
          let cur=best? best : {id:nextId++, side:getSide(cx,cy), counted:false};
          cur.x=cx; cur.y=cy; cur.bbox=d.bbox; cur.class=d.class;
          if(line &&!cur.counted){
            let ns=getSide(cx,cy); if(cur.side!==0 && ns!==0 && Math.sign(cur.side)!==Math.sign(ns)){
              cur.counted=true;
              if(d.class==='car') counts.car++; else if(d.class==='motorcycle'||d.class==='bicycle') counts.motor++; else if(d.class==='bus'||d.class==='truck') counts.truck++; else counts.person++;
              counts.total++;
            } cur.side=ns;
          }
          newTracks[cur.id]=cur;
          ctx.strokeStyle=cur.counted?'#ffaa00':'#00ff88'; ctx.lineWidth=2; ctx.strokeRect(...d.bbox);
          ctx.fillStyle=ctx.strokeStyle; ctx.font='11px monospace'; ctx.fillText(d.class+'#'+cur.id, d.x1, d.y1-4);
        });
        tracks=newTracks;
      }catch(e){}

      document.getElementById('cc').innerText=counts.car; document.getElementById('cb').innerText=counts.motor;
      document.getElementById('ct').innerText=counts.truck; document.getElementById('cp').innerText=counts.person; document.getElementById('ctot').innerText=counts.total;
    }
    animId=requestAnimationFrame(loop);
  }; loop();
}

function useCam(){ if(hls){hls.destroy();hls=null} if(stream){stream.getTracks().forEach(t=>t.stop())} navigator.mediaDevices.getUserMedia({video:{width:640},audio:false}).then(s=>{stream=s; video.srcObject=s; video.play(); startLoop();});}
function useUrl(u){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null} if(hls){hls.destroy();hls=null} let url=u||document.getElementById('urlInput').value.trim(); if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play();startLoop();});hls.on(Hls.Events.ERROR,(ev,d)=>{if(d.fatal){hls.destroy();useUrl('https://corsproxy.io/?'+encodeURIComponent(url));}});}else{video.src=url;video.play();startLoop();}}

cvs.addEventListener('click', e=>{ if(!drawing) return; let r=cvs.getBoundingClientRect(); let x=(e.clientX-r.left)*(cvs.width/r.width); let y=(e.clientY-r.top)*(cvs.height/r.height); tmp.push([x,y]); if(tmp.length===2){line=[...tmp[0],...tmp[1]]; tmp=[]; drawing=false; counts={car:0,motor:0,truck:0,person:0,total:0};}});

document.getElementById('btnCam').onclick=useCam; document.getElementById('btnUrl').onclick=()=>useUrl();
document.getElementById('btnLine').onclick=()=>{drawing=!drawing; tmp=[]; document.getElementById('btnLine').innerText=drawing?'TAP 2 POINTS':'DRAW LINE';};
document.getElementById('btnClear').onclick=()=>{line=null; tmp=[]; drawing=false; counts={car:0,motor:0,truck:0,person:0,total:0};};
document.getElementById('modelSel').onchange=e=>loadModel(e.target.value);
loadModel('coco-lite');
</script>
</body>
</html>
