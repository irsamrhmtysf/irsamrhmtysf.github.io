<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batam AI Vision</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c12;color:#d0d8e4;font-family:system-ui,-apple-system,sans-serif;font-size:14px;min-height:100vh}
.header{background:#11151f;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2533}
.header h1{font-size:1rem;font-weight:700;color:#00d4ff}
.badge{background:#ff1744;color:#fff;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:4px}
.wrap{max-width:920px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.cam{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select{flex:1;min-width:130px;background:#151a24;color:#d0d8e4;border:1px solid #2a3344;border-radius:6px;padding:8px 10px;font-size:.82rem}
.thresh{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#8a94a4}
.thresh input[type=range]{width:90px;accent-color:#00d4ff}
.thresh span{min-width:32px;color:#00d4ff;font-weight:600}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
canvas{pointer-events:none}
.panel{background:#12161f;border:1px solid #1e2533;border-radius:8px;padding:12px}
.title{font-size:.7rem;color:#7a8494;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.box{background:#0a0c12;border-radius:8px;padding:12px 4px;text-align:center}
.box .num{font-size:1.7rem;font-weight:700;line-height:1}
.box .lab{font-size:.7rem;color:#8a94a4;margin-top:4px}
.dens{text-align:center;padding:10px;border-radius:6px;font-weight:700;font-size:1.05rem;margin:10px 0}
.d1{background:#0a2f1a;color:#00e676}.d2{background:#0d3b1f;color:#69f0ae}
.d3{background:#1a2a3a;color:#00d4ff}.d4{background:#3a2a0a;color:#ff9100}.d5{background:#3a0a0a;color:#ff1744}
.total{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.total .box .num{font-size:1.25rem}
.report{background:#0c1810;border:1px solid #1a3a28;border-radius:6px;padding:10px;font-size:.8rem;line-height:1.45;margin-top:8px}
.report b{color:#00e676}
.log{background:#000;border:1px solid #0a3;border-radius:4px;padding:8px;font-size:.68rem;color:#0f0;font-family:"Courier New",Consolas,monospace;max-height:110px;overflow-y:auto;margin-top:8px;line-height:1.55;text-shadow:0 0 4px #0f05}
</style>
</head>
<body>
<div class="header">
  <h1>BATAM AI VISION</h1>
  <span class="badge">LIVE</span>
</div>

<div class="wrap">
  <div class="cam">
    <select id="cam" onchange="switchCam()">
      <option value="https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8">Simp. Kuda 1</option>
      <option value="https://matanya.batam.go.id/cctv/atap/stream.m3u8">Atap Walikota</option>
      <option value="https://matanya.batam.go.id/cctv/casablanca2/stream.m3u8">Casablanca</option>
      <option value="https://matanya.batam.go.id/cctv/matakucing1/stream.m3u8">Mata Kucing 1</option>
      <option value="https://matanya.batam.go.id/cctv/pasarjodoh2/stream.m3u8">Pasar Jodoh 2</option>
      <option value="https://matanya.batam.go.id/cctv/madanipancuran/stream.m3u8">Bundaran Madani</option>
      <option value="https://matanya.batam.go.id/cctv/batuaji/stream.m3u8">SP Batu Aji</option>
      <option value="https://matanya.batam.go.id/cctv/gerutara/stream.m3u8">Gerb. Utara</option>
      <option value="https://matanya.batam.go.id/cctv/southgate/stream.m3u8">Gerb. Selatan</option>
      <option value="https://matanya.batam.go.id/cctv/punggur1/stream.m3u8">Pel. Punggur</option>
      <option value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8">Pel. Sekupang</option>
      <option value="https://matanya.batam.go.id/cctv/delta2/stream.m3u8">Delta Villa 2</option>
    </select>
    <select id="modelSel" onchange="changeModel()">
      <option value="lite_mobilenet_v2" selected>Fast (lite_mobilenet_v2)</option>
      <option value="mobilenet_v2">Balanced (mobilenet_v2)</option>
      <option value="lite_mobilenet_v2">Speed Priority (lite)</option>
      <option value="mobilenet_v2">Accuracy Priority (v2)</option>
      <option value="mobilenet_v2">Standard COCO-SSD</option>
    </select>
    <div class="thresh">Conf <input type="range" id="conf" min="20" max="70" value="35" oninput="updateConf(this.value)"><span id="confVal">0.35</span></div>
  </div>

  <div class="video">
    <video id="v" muted playsinline autoplay></video>
    <canvas id="c"></canvas>
  </div>

  <div class="panel">
    <div class="title">Realtime Detection</div>
    <div class="counts">
      <div class="box"><div class="num" id="r-car" style="color:#00d4ff">0</div><div class="lab">Car</div></div>
      <div class="box"><div class="num" id="r-bus" style="color:#d500f9">0</div><div class="lab">Bus</div></div>
      <div class="box"><div class="num" id="r-truck" style="color:#ff1744">0</div><div class="lab">Truck</div></div>
      <div class="box"><div class="num" id="r-motor" style="color:#ffea00">0</div><div class="lab">Motor</div></div>
    </div>

    <div id="dens" class="dens d3">NORMAL</div>

    <div class="title">Total Counted</div>
    <div class="total">
      <div class="box"><div class="num" id="t-car" style="color:#00d4ff">0</div><div class="lab">Car</div></div>
      <div class="box"><div class="num" id="t-bus" style="color:#d500f9">0</div><div class="lab">Bus</div></div>
      <div class="box"><div class="num" id="t-truck" style="color:#ff1744">0</div><div class="lab">Truck</div></div>
      <div class="box"><div class="num" id="t-motor" style="color:#ffea00">0</div><div class="lab">Motor</div></div>
    </div>

    <div class="report" id="rep"><b>Analysis:</b> Waiting...</div>
    <div class="log" id="log">> SYSTEM ONLINE_</div>
  </div>
</div>

<script>
var video = document.getElementById("v");
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var model = null;
var running = false;
var hls = null;
var frameSkip = 0;
var prevTracks = [];
var totals = { car: 0, bus: 0, truck: 0, motor: 0 };
var confThreshold = 0.35;
var classMap = {
  car: "car", bus: "bus", truck: "truck",
  motorcycle: "motor", bicycle: "motor"
};

// Click sound
var audioCtx = null;
function clickSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 800;
    o.type = "square";
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime + 0.08);
  } catch (e) {}
}

function log(msg) {
  var el = document.getElementById("log");
  var t = new Date().toLocaleTimeString();
  el.innerHTML = "> [" + t + "] " + msg + "<br>" + el.innerHTML;
  if (el.innerHTML.length > 700) el.innerHTML = el.innerHTML.slice(0, 700);
}

function updateConf(v) {
  clickSound();
  confThreshold = parseInt(v, 10) / 100;
  document.getElementById("confVal").textContent = confThreshold.toFixed(2);
  log("CONFIDENCE → " + confThreshold.toFixed(2));
}

function resetCounts() {
  totals = { car: 0, bus: 0, truck: 0, motor: 0 };
  prevTracks = [];
  document.getElementById("r-car").textContent = "0";
  document.getElementById("r-bus").textContent = "0";
  document.getElementById("r-truck").textContent = "0";
  document.getElementById("r-motor").textContent = "0";
  document.getElementById("t-car").textContent = "0";
  document.getElementById("t-bus").textContent = "0";
  document.getElementById("t-truck").textContent = "0";
  document.getElementById("t-motor").textContent = "0";
  document.getElementById("dens").className = "dens d3";
  document.getElementById("dens").textContent = "NORMAL";
  document.getElementById("rep").innerHTML = "<b>Analysis:</b> Reset.";
  log("COUNTS RESET TO ZERO");
}

function setDensity(n) {
  var el = document.getElementById("dens");
  var cls, txt;
  if (n <= 2) { cls = "d1"; txt = "SANGAT LENGANG"; }
  else if (n <= 5) { cls = "d2"; txt = "LENGANG"; }
  else if (n <= 11) { cls = "d3"; txt = "NORMAL"; }
  else if (n <= 18) { cls = "d4"; txt = "PADAT"; }
  else { cls = "d5"; txt = "SANGAT PADAT"; }
  el.className = "dens " + cls;
  el.textContent = txt;
  return txt;
}

function setReport(dens, rt) {
  var msg = "";
  if (dens.indexOf("SANGAT PADAT") >= 0) msg = "Sangat padat. Rekomendasi: rekayasa / pengalihan.";
  else if (dens.indexOf("PADAT") >= 0) msg = "Padat. Pantau terus.";
  else if (dens.indexOf("NORMAL") >= 0) msg = "Normal. Kondisi aman.";
  else msg = "Lengang. Optimal.";
  document.getElementById("rep").innerHTML =
    "<b>Analysis:</b> " + msg +
    " | Car:" + rt.car + " Bus:" + rt.bus + " Truck:" + rt.truck + " Motor:" + rt.motor;
}

function matchTracks(curr) {
  var added = { car: 0, bus: 0, truck: 0, motor: 0 };
  var used = [];
  for (var i = 0; i < prevTracks.length; i++) used.push(false);
  for (var i = 0; i < curr.length; i++) {
    var best = 80, bestIdx = -1;
    for (var j = 0; j < prevTracks.length; j++) {
      if (used[j] || prevTracks[j].k !== curr[i].k) continue;
      var dx = curr[i].x - prevTracks[j].x;
      var dy = curr[i].y - prevTracks[j].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < best) { best = d; bestIdx = j; }
    }
    if (bestIdx >= 0) used[bestIdx] = true;
    else added[curr[i].k]++;
  }
  prevTracks = curr;
  return added;
}

async function detectLoop() {
  if (!running || !model) return;
  if (video.readyState < 2) { requestAnimationFrame(detectLoop); return; }
  frameSkip++;
  if (frameSkip < 2) { requestAnimationFrame(detectLoop); return; }
  frameSkip = 0;

  var w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) { requestAnimationFrame(detectLoop); return; }
  canvas.width = w; canvas.height = h;

  try {
    var preds = await model.detect(video, 20);
    ctx.clearRect(0, 0, w, h);
    var rt = { car: 0, bus: 0, truck: 0, motor: 0 };
    var tracks = [];

    for (var i = 0; i < preds.length; i++) {
      var p = preds[i];
      if (p.score < confThreshold) continue;
      var key = classMap[p.class];
      if (!key) continue;
      rt[key]++;
      var x = p.bbox[0], y = p.bbox[1], bw = p.bbox[2], bh = p.bbox[3];
      tracks.push({ x: x + bw / 2, y: y + bh / 2, k: key });
      var col = key === "car" ? "#00d4ff" : key === "bus" ? "#d500f9" : key === "truck" ? "#ff1744" : "#ffea00";
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.strokeRect(x, y, bw, bh);
      ctx.fillStyle = col; ctx.font = "12px sans-serif";
      ctx.fillText(p.class + " " + Math.round(p.score * 100) + "%", x, y > 12 ? y - 3 : y + 12);
    }

    var added = matchTracks(tracks);
    totals.car += added.car; totals.bus += added.bus;
    totals.truck += added.truck; totals.motor += added.motor;

    var totalNow = rt.car + rt.bus + rt.truck + rt.motor;
    document.getElementById("r-car").textContent = rt.car;
    document.getElementById("r-bus").textContent = rt.bus;
    document.getElementById("r-truck").textContent = rt.truck;
    document.getElementById("r-motor").textContent = rt.motor;
    document.getElementById("t-car").textContent = totals.car;
    document.getElementById("t-bus").textContent = totals.bus;
    document.getElementById("t-truck").textContent = totals.truck;
    document.getElementById("t-motor").textContent = totals.motor;

    var dens = setDensity(totalNow);
    setReport(dens, rt);
  } catch (err) {
    log("DETECT ERROR: " + (err.message || "unknown"));
  }
  requestAnimationFrame(detectLoop);
}

function startDetection() {
  if (model && video.readyState >= 2 && !running) {
    running = true;
    log("DETECTION LOOP STARTED");
    detectLoop();
  }
}

function destroyStream() {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  running = false;
}

function loadStream(url) {
  destroyStream();
  resetCounts();
  log("CONNECTING STREAM...");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 8 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      video.play().catch(function () {});
      log("STREAM CONNECTED & PLAYING");
      setTimeout(startDetection, 600);
    });
    hls.on(Hls.Events.ERROR, function (evt, data) {
      if (data.fatal) log("STREAM ERROR: " + data.type);
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play().catch(function () {});
    log("STREAM CONNECTED (NATIVE)");
    setTimeout(startDetection, 600);
  } else {
    log("HLS NOT SUPPORTED");
  }
}

function switchCam() {
  clickSound();
  log("CAMERA SWITCH → RESET");
  loadStream(document.getElementById("cam").value);
}

async function changeModel() {
  clickSound();
  var base = document.getElementById("modelSel").value;
  var name = document.getElementById("modelSel").options[document.getElementById("modelSel").selectedIndex].text;
  running = false;
  model = null;
  log("LOADING MODEL: " + name);
  try {
    model = await cocoSsd.load({ base: base });
    log("MODEL READY: " + name);
    startDetection();
  } catch (e) {
    log("MODEL FAILED: " + (e.message || "error"));
  }
}

async function loadModel() {
  log("LOADING DEFAULT: Fast (lite_mobilenet_v2)");
  try {
    model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    log("MODEL READY: Fast (lite_mobilenet_v2)");
    startDetection();
  } catch (e) {
    log("MODEL FAILED");
  }
}

video.addEventListener("playing", function () {
  log("VIDEO PLAYING");
  setTimeout(startDetection, 400);
});

log("SYSTEM ONLINE");
loadStream("https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8");
loadModel();
</script>
</body>
</html>
