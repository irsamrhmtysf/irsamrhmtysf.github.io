<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batam Traffic AI Vision</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07090f;color:#c8d0dc;font-family:system-ui,-apple-system,sans-serif;font-size:13px;min-height:100vh}
.header{background:#0c1018;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1c2433}
.header h1{font-size:.9rem;font-weight:700;color:#00d4ff}
.live{background:#ff1744;color:#fff;font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;gap:5px;align-items:center;overflow-x:auto;padding-bottom:2px}
.item{display:flex;align-items:center;gap:4px;background:#151a24;border:1px solid #1c2433;border-radius:6px;padding:5px 7px;flex:0 0 auto}
.item select,.item input[type=range]{background:transparent;color:#c8d0dc;border:none;font-size:.75rem;outline:none}
.item select{max-width:130px}
.item input[type=range]{width:62px;accent-color:#00d4ff}
.ico{font-size:.85rem;line-height:1}
.val{color:#00d4ff;font-size:.7rem;font-weight:700;min-width:24px}
button{background:#151a24;color:#c8d0dc;border:1px solid #1c2433;border-radius:6px;padding:6px 8px;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
button.active{background:#00d4ff;color:#000;border-color:#00d4ff}
button:disabled{opacity:.35;cursor:not-allowed}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:1px solid #1c2433;touch-action:none}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#c{pointer-events:auto}
.ov{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.72);color:#fff;font-size:.62rem;padding:3px 7px;border-radius:4px;font-family:monospace;z-index:5;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:#10141c;border:1px solid #1c2433;border-radius:8px;padding:10px}
.t{font-size:.62rem;color:#6b7585;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;font-weight:600}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stat{background:#0a0d14;border-radius:6px;padding:8px 3px;text-align:center}
.stat .n{font-size:1.35rem;font-weight:700;line-height:1}
.stat .l{font-size:.6rem;color:#6b7585;margin-top:2px}
.dens{text-align:center;padding:7px;border-radius:6px;font-weight:700;font-size:.85rem;margin:7px 0}
.d0{background:#1a1a1a;color:#666}.d1{background:#062816;color:#00e676}.d2{background:#0a2f1a;color:#69f0ae}
.d3{background:#0e1c2a;color:#00d4ff}.d4{background:#2a1e08;color:#ff9100}.d5{background:#2a0a0a;color:#ff1744}
.report{background:#081410;border:1px solid #153525;border-radius:6px;padding:7px;font-size:.72rem;line-height:1.4}
.report b{color:#00e676}
.health{background:#120a0a;border:1px solid #3a1515;border-radius:6px;padding:7px;font-size:.7rem;line-height:1.4;margin-top:7px;display:none;color:#ff8a80}
.health.show{display:block}
.log{background:#000;border:1px solid #1a3a22;border-radius:4px;padding:6px;font-size:.62rem;font-family:"Courier New",monospace;max-height:92px;overflow-y:auto;margin-top:7px;line-height:1.5}
.lg{color:#00e676}.lr{color:#ff5252}.ly{color:#ffd54f}.lb{color:#40c4ff}.lm{color:#6b7585}
.hint{font-size:.68rem;color:#6b7585;margin-top:5px}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.6rem;font-weight:700;margin-left:5px}
.off{background:#333;color:#aaa}.on{background:#0a3a2a;color:#00e676}
</style>
</head>
<body>
<div class="header">
  <h1>BATAM TRAFFIC AI VISION</h1>
  <span class="live">● LIVE</span>
</div>

<div class="wrap">
  <div class="bar">
    <div class="item"><span class="ico">📷</span>
      <select id="cam" onchange="switchCam()">
        <option value="https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8">Simp. Kuda 1</option>
        <option value="https://matanya.batam.go.id/cctv/simpkuda2/stream.m3u8">Simp. Kuda 2</option>
        <option value="https://matanya.batam.go.id/cctv/atap/stream.m3u8">Alun-Alun Engku Putri</option>
        <option value="https://matanya.batam.go.id/cctv/gerselatan/stream.m3u8">Engku Putri Selatan</option>
        <option value="https://matanya.batam.go.id/cctv/gerutara/stream.m3u8">Engku Putri Utara</option>
        <option value="https://matanya.batam.go.id/cctv/madani1/stream.m3u8">Madani Ocarina</option>
        <option value="https://matanya.batam.go.id/cctv/madanipancuran/stream.m3u8">Bundaran Madani</option>
        <option value="https://matanya.batam.go.id/cctv/casablanca2/stream.m3u8">Casablanca</option>
        <option value="https://matanya.batam.go.id/cctv/matakucing1/stream.m3u8">Mata Kucing 1</option>
        <option value="https://matanya.batam.go.id/cctv/matakucing2/stream.m3u8">Mata Kucing 2</option>
        <option value="https://matanya.batam.go.id/cctv/pasarjodoh1/stream.m3u8">Pasar Jodoh 1</option>
        <option value="https://matanya.batam.go.id/cctv/pasarjodoh2/stream.m3u8">Pasar Jodoh 2</option>
        <option value="https://matanya.batam.go.id/cctv/batuaji/stream.m3u8">SP Batu Aji</option>
        <option value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8">Pel. Sekupang</option>
        <option value="https://matanya.batam.go.id/cctv/punggur1/stream.m3u8">Pel. Punggur</option>
        <option value="https://matanya.batam.go.id/cctv/danganom1/stream.m3u8">Dang Anom 1</option>
        <option value="https://matanya.batam.go.id/cctv/danganom2/stream.m3u8">Dang Anom 2</option>
        <option value="https://matanya.batam.go.id/cctv/pura1/stream.m3u8">Pura Sei Ladi 1</option>
        <option value="https://matanya.batam.go.id/cctv/pura2/stream.m3u8">Pura Sei Ladi 2</option>
        <option value="https://matanya.batam.go.id/cctv/seiladi1/stream.m3u8">Sei Ladi 1</option>
        <option value="https://matanya.batam.go.id/cctv/seiladi2/stream.m3u8">Sei Ladi 2</option>
        <option value="https://matanya.batam.go.id/cctv/seiladi3/stream.m3u8">Sei Ladi 3</option>
        <option value="https://matanya.batam.go.id/cctv/southlink1/stream.m3u8">Southlink 1</option>
        <option value="https://matanya.batam.go.id/cctv/southlink2/stream.m3u8">Southlink 2</option>
        <option value="https://matanya.batam.go.id/cctv/southgate/stream.m3u8">Gerb. Selatan</option>
        <option value="https://matanya.batam.go.id/cctv/delta2/stream.m3u8">Delta Villa 2</option>
      </select>
    </div>
    <div class="item"><span class="ico">🧠</span>
      <select id="modelSel" onchange="onModelChange()">
        <option value="off" selected>Off</option>
        <option value="mobilenet_v2">Accurate</option>
        <option value="lite_mobilenet_v2">Fast</option>
      </select>
    </div>
    <div class="item"><span class="ico">🎯</span>
      <input type="range" id="conf" min="12" max="50" value="20" oninput="updateConf(this.value)" disabled>
      <span class="val" id="confVal">0.20</span>
    </div>
    <div class="item"><span class="ico">➖</span>
      <select id="lineSize" onchange="onLineSizeChange()" disabled>
        <option value="20">Thin</option>
        <option value="45" selected>Med</option>
        <option value="80">Thick</option>
        <option value="120">XL</option>
      </select>
    </div>
    <button id="btnLine" onclick="toggleLineMode()" disabled>✏️ Line</button>
    <button id="btnClear" onclick="clearLine()" disabled>✕</button>
  </div>

  <div class="video-box">
    <video id="v" muted playsinline autoplay></video>
    <canvas id="c"></canvas>
    <div class="ov" id="overlay">Camera only</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="t">Realtime <span id="modeBadge" class="badge off">OFF</span></div>
      <div class="counts">
        <div class="stat"><div class="n" id="r-car" style="color:#00d4ff">0</div><div class="l">Car</div></div>
        <div class="stat"><div class="n" id="r-bus" style="color:#d500f9">0</div><div class="l">Bus</div></div>
        <div class="stat"><div class="n" id="r-truck" style="color:#ff1744">0</div><div class="l">Truck</div></div>
        <div class="stat"><div class="n" id="r-motor" style="color:#ffea00">0</div><div class="l">Motor</div></div>
      </div>
      <div id="dens" class="dens d0">—</div>
      <div class="report" id="rep"><b>Status:</b> Camera only.</div>
      <div class="health" id="health"></div>
    </div>
    <div class="card">
      <div class="t">Line Count</div>
      <div class="counts">
        <div class="stat"><div class="n" id="l-car" style="color:#00d4ff">0</div><div class="l">Car</div></div>
        <div class="stat"><div class="n" id="l-bus" style="color:#d500f9">0</div><div class="l">Bus</div></div>
        <div class="stat"><div class="n" id="l-truck" style="color:#ff1744">0</div><div class="l">Truck</div></div>
        <div class="stat"><div class="n" id="l-motor" style="color:#ffea00">0</div><div class="l">Motor</div></div>
      </div>
      <div class="hint">AI ON → pick size → Line → 2 taps on road</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
var video=document.getElementById("v"),canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
var model=null,aiOn=false,running=false,hls=null,frameSkip=0;
var confThreshold=0.20,lineBand=45;
var classMap={car:"car",bus:"bus",truck:"truck",motorcycle:"motor",bicycle:"motor"};
var COLORS={car:"#00d4ff",bus:"#d500f9",truck:"#ff1744",motor:"#ffea00"};
var tracks={},nextId=1,lineCounts={car:0,bus:0,truck:0,motor:0};
var line=null,lineMode=false,linePoints=[];
var health={bootTime:Date.now(),streamOk:false,streamError:null,modelOk:false,modelError:null,detectFrames:0,lastDetectAt:0,lastError:null};

function beep(){try{if(!window._ac)window._ac=new(window.AudioContext||window.webkitAudioContext);var o=window._ac.createOscillator(),g=window._ac.createGain();o.connect(g);g.connect(window._ac.destination);o.frequency.value=780;o.type="square";g.gain.setValueAtTime(0.06,window._ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,window._ac.currentTime+0.06);o.start();o.stop(window._ac.currentTime+0.06)}catch(e){}}

function log(msg,kind){
  var el=document.getElementById("log");
  var cls=kind==="err"?"lr":kind==="warn"?"ly":kind==="info"?"lb":kind==="wait"?"lm":"lg";
  var t=new Date().toLocaleTimeString();
  el.innerHTML="<div class='"+cls+"'>["+t+"] "+msg+"</div>"+el.innerHTML;
  if(el.innerHTML.length>900) el.innerHTML=el.innerHTML.slice(0,900);
}

function updateConf(v){beep();confThreshold=parseInt(v,10)/100;document.getElementById("confVal").textContent=confThreshold.toFixed(2);log("Confidence "+confThreshold.toFixed(2),"info")}
function onLineSizeChange(){lineBand=parseInt(document.getElementById("lineSize").value,10);log("Line size "+lineBand+"px","info");beep()}

function showHealth(msg){var el=document.getElementById("health");el.className="health show";el.innerHTML="<b>Report:</b> "+msg;log(msg,"err")}
function checkHealth(){
  var age=(Date.now()-health.bootTime)/1000; if(age<6) return;
  var issues=[];
  if(!health.streamOk) issues.push("Camera not playing ("+(health.streamError||"timeout")+")");
  if(aiOn&&!health.modelOk) issues.push("AI model failed ("+(health.modelError||"unknown")+")");
  if(aiOn&&health.modelOk&&health.detectFrames===0&&age>18) issues.push("AI loaded but no frames (waiting/stuck)");
  if(aiOn&&health.lastDetectAt&&(Date.now()-health.lastDetectAt)>12000) issues.push("Detection stopped >12s");
  if(issues.length) showHealth(issues.join(" | ")+" | t="+Math.round(age)+"s");
}
setInterval(checkHealth,3000);

function setUIMode(mode){
  var badge=document.getElementById("modeBadge");
  var on=mode!=="off";
  badge.className="badge "+(on?"on":"off"); badge.textContent=on?"ON":"OFF";
  document.getElementById("conf").disabled=!on;
  document.getElementById("btnLine").disabled=!on;
  document.getElementById("btnClear").disabled=!on;
  document.getElementById("lineSize").disabled=!on;
  if(!on){
    document.getElementById("overlay").textContent="Camera only";
    document.getElementById("dens").className="dens d0";
    document.getElementById("dens").textContent="—";
    document.getElementById("rep").innerHTML="<b>Status:</b> Camera only.";
  }
}

function resetCounts(){
  lineCounts={car:0,bus:0,truck:0,motor:0}; tracks={};
  ["r-car","r-bus","r-truck","r-motor","l-car","l-bus","l-truck","l-motor"].forEach(function(id){document.getElementById(id).textContent="0"});
}

function setDensity(n){
  var el=document.getElementById("dens"),c,t;
  if(n<=0){c="d0";t="—"}else if(n<=2){c="d1";t="SANGAT LENGANG"}else if(n<=5){c="d2";t="LENGANG"}else if(n<=11){c="d3";t="NORMAL"}else if(n<=18){c="d4";t="PADAT"}else{c="d5";t="SANGAT PADAT"}
  el.className="dens "+c; el.textContent=t; return t;
}
function setReport(dens,rt){
  var msg=dens==="—"?"Waiting...":dens.indexOf("SANGAT PADAT")>=0?"Sangat padat.":dens.indexOf("PADAT")>=0?"Padat.":dens.indexOf("NORMAL")>=0?"Normal.":"Lengang.";
  var tot=lineCounts.car+lineCounts.bus+lineCounts.truck+lineCounts.motor;
  var extra=line?("<br><b>Line:</b> "+tot+" (C"+lineCounts.car+" B"+lineCounts.bus+" T"+lineCounts.truck+" M"+lineCounts.motor+")"):"";
  document.getElementById("rep").innerHTML="<b>Decision:</b> "+msg+" Now C"+rt.car+" B"+rt.bus+" T"+rt.truck+" M"+rt.motor+extra;
}

function getLinePixels(){if(!line)return null;var w=canvas.width||1,h=canvas.height||1;return{x1:line.nx1*w,y1:line.ny1*h,x2:line.nx2*w,y2:line.ny2*h}}
function distToLine(x,y){var L=getLinePixels();if(!L)return 9999;var dx=L.x2-L.x1,dy=L.y2-L.y1,len2=dx*dx+dy*dy;if(len2<1)return 9999;var t=((x-L.x1)*dx+(y-L.y1)*dy)/len2;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(L.x1+t*dx),y-(L.y1+t*dy))}
function sideOfLine(x,y){var L=getLinePixels();if(!L)return 0;return (L.x2-L.x1)*(y-L.y1)-(L.y2-L.y1)*(x-L.x1)}

function toggleLineMode(){if(!aiOn)return;lineMode=!lineMode;linePoints=[];document.getElementById("btnLine").classList.toggle("active",lineMode);log(lineMode?"Draw line: tap 2 points","wait");beep()}
function clearLine(){line=null;linePoints=[];tracks={};lineCounts={car:0,bus:0,truck:0,motor:0};["l-car","l-bus","l-truck","l-motor"].forEach(function(id){document.getElementById(id).textContent="0"});log("Line cleared","info");beep()}
function getCanvasPos(e){var r=canvas.getBoundingClientRect();var cx=e.touches?e.touches[0].clientX:e.clientX;var cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-r.left)*(canvas.width/r.width),y:(cy-r.top)*(canvas.height/r.height)}}
function onCanvasClick(e){if(!lineMode||!aiOn)return;e.preventDefault();var p=getCanvasPos(e);linePoints.push(p);if(linePoints.length===1){log("Point 1 set","wait")}else{var w=canvas.width||1,h=canvas.height||1;line={nx1:linePoints[0].x/w,ny1:linePoints[0].y/h,nx2:linePoints[1].x/w,ny2:linePoints[1].y/h};linePoints=[];lineMode=false;document.getElementById("btnLine").classList.remove("active");tracks={};lineCounts={car:0,bus:0,truck:0,motor:0};["l-car","l-bus","l-truck","l-motor"].forEach(function(id){document.getElementById(id).textContent="0"});log("Line active "+lineBand+"px","ok")}}
canvas.addEventListener("click",onCanvasClick);
canvas.addEventListener("touchstart",onCanvasClick,{passive:false});

function updateTracks(dets){
  var MAX_DIST=180,MAX_AGE=26,used={},neu={};
  for(var id in tracks) tracks[id].age=(tracks[id].age||0)+1;
  for(var i=0;i<dets.length;i++){
    var d=dets[i],best=null,cost=1e9;
    for(var id in tracks){
      if(used[id])continue;
      var t=tracks[id],pen=t.k===d.k?1:1.5;
      var dist=Math.hypot((t.x+(t.vx||0))-d.x,(t.y+(t.vy||0))-d.y)*pen;
      if(t.s&&d.s) dist*=Math.min(Math.max(t.s,d.s)/Math.max(1,Math.min(t.s,d.s)),2);
      if(dist<MAX_DIST&&dist<cost){cost=dist;best=id}
    }
    if(best!==null){
      used[best]=true;
      var old=tracks[best],vx=(d.x-old.x)*0.5+(old.vx||0)*0.5,vy=(d.y-old.y)*0.5+(old.vy||0)*0.5;
      var ns=sideOfLine(d.x,d.y),counted=!!old.counted,near=distToLine(d.x,d.y)<=lineBand;
      if(line&&!counted&&near&&old.side!==0&&ns!==0&&(old.side>0)!==(ns>0)&&Math.hypot(d.x-old.x,d.y-old.y)>2){
        counted=true; lineCounts[d.k]=(lineCounts[d.k]||0)+1;
        document.getElementById("l-"+d.k).textContent=lineCounts[d.k];
        log("Counted "+d.k+" total "+(lineCounts.car+lineCounts.bus+lineCounts.truck+lineCounts.motor),"ok");
      }
      neu[best]={x:d.x,y:d.y,k:d.k,s:d.s||old.s||0,side:ns,vx:vx,vy:vy,age:0,counted:counted};
    }else neu[nextId++]={x:d.x,y:d.y,k:d.k,s:d.s||0,side:sideOfLine(d.x,d.y),vx:0,vy:0,age:0,counted:false};
  }
  for(var id in tracks){if(!used[id]&&(tracks[id].age||0)<MAX_AGE){var t=tracks[id];neu[id]={x:t.x+(t.vx||0),y:t.y+(t.vy||0),k:t.k,s:t.s||0,side:t.side,vx:(t.vx||0)*0.8,vy:(t.vy||0)*0.8,age:t.age,counted:!!t.counted}}}
  tracks=neu;
}

async function detectLoop(){
  if(!running||!aiOn||!model)return;
  if(video.readyState<2){requestAnimationFrame(detectLoop);return}
  frameSkip++; if(frameSkip<2){requestAnimationFrame(detectLoop);return} frameSkip=0;
  var w=video.videoWidth,h=video.videoHeight; if(!w||!h){requestAnimationFrame(detectLoop);return}
  canvas.width=w; canvas.height=h;
  try{
    var preds=await model.detect(video,30);
    ctx.clearRect(0,0,w,h);
    var rt={car:0,bus:0,truck:0,motor:0},dets=[];
    for(var i=0;i<preds.length;i++){
      var p=preds[i]; if(p.score<confThreshold) continue;
      var key=classMap[p.class]; if(!key) continue;
      rt[key]++;
      var x=p.bbox[0],y=p.bbox[1],bw=p.bbox[2],bh=p.bbox[3];
      dets.push({x:x+bw/2,y:y+bh/2,k:key,s:bw*bh});
      ctx.strokeStyle=COLORS[key]; ctx.lineWidth=2; ctx.strokeRect(x,y,bw,bh);
      ctx.fillStyle=COLORS[key]; ctx.font="bold 11px system-ui";
      ctx.fillText(p.class+" "+Math.round(p.score*100)+"%",x,y>12?y-3:y+12);
    }
    updateTracks(dets);
    if(line){
      var L=getLinePixels();
      ctx.strokeStyle="rgba(0,255,136,.28)"; ctx.lineWidth=lineBand*2;
      ctx.beginPath(); ctx.moveTo(L.x1,L.y1); ctx.lineTo(L.x2,L.y2); ctx.stroke();
      ctx.strokeStyle="#00ff88"; ctx.lineWidth=3; ctx.setLineDash([8,5]);
      ctx.beginPath(); ctx.moveTo(L.x1,L.y1); ctx.lineTo(L.x2,L.y2); ctx.stroke(); ctx.setLineDash([]);
    }
    if(linePoints.length===1){ctx.fillStyle="#ff0";ctx.beginPath();ctx.arc(linePoints[0].x,linePoints[0].y,7,0,Math.PI*2);ctx.fill()}
    document.getElementById("r-car").textContent=rt.car;
    document.getElementById("r-bus").textContent=rt.bus;
    document.getElementById("r-truck").textContent=rt.truck;
    document.getElementById("r-motor").textContent=rt.motor;
    setReport(setDensity(rt.car+rt.bus+rt.truck+rt.motor),rt);
    document.getElementById("overlay").textContent="AI • "+(rt.car+rt.bus+rt.truck+rt.motor)+" obj"+(line?" • LINE":"");
    health.detectFrames++; health.lastDetectAt=Date.now();
  }catch(err){health.lastError=err.message||"detect"; log("Detect error: "+health.lastError,"err")}
  requestAnimationFrame(detectLoop);
}

function stopAI(){aiOn=false;running=false;model=null;if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height);resetCounts();setUIMode("off");log("AI off — camera only","info")}
function startAI(){if(!model||!aiOn)return;if(video.readyState>=2&&!running){running=true;log("Detection started","ok");detectLoop()}}

async function onModelChange(){
  beep();
  var val=document.getElementById("modelSel").value;
  if(val==="off"){stopAI();return}
  aiOn=false;running=false;model=null;setUIMode("ai");
  log("Loading model "+val+"...","wait");
  health.modelOk=false;health.modelError=null;
  try{
    model=await cocoSsd.load({base:val});
    aiOn=true;health.modelOk=true;
    log("Model ready","ok"); startAI();
  }catch(e){
    health.modelError=e.message||"fail";
    log("Model failed: "+health.modelError,"err");
    document.getElementById("modelSel").value="off"; stopAI();
    showHealth("AI model failed: "+health.modelError);
  }
}

function destroyStream(){if(hls){try{hls.destroy()}catch(e){}hls=null}running=false}
function loadStream(url){
  destroyStream(); resetCounts();
  health.streamOk=false; health.streamError=null;
  log("Connecting camera...","wait");
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:8});
    hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){video.play().catch(function(){});health.streamOk=true;log("Camera stream OK","ok");if(aiOn)setTimeout(startAI,350)});
    hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal){health.streamError=d.type||"fatal";log("Stream fail: "+health.streamError,"err");showHealth("Camera failed: "+health.streamError)}});
  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url; video.play().catch(function(){}); health.streamOk=true; log("Camera native OK","ok"); if(aiOn)setTimeout(startAI,350);
  }else{health.streamError="HLS unsupported"; log("HLS not supported","err"); showHealth("Browser cannot play CCTV stream")}
}
function switchCam(){beep();log("Switch camera","info");loadStream(document.getElementById("cam").value)}
video.addEventListener("playing",function(){health.streamOk=true;if(aiOn)setTimeout(startAI,250)});
video.addEventListener("error",function(){health.streamError="video error";log("Video error","err");showHealth("Video error. Try another camera.")});

setUIMode("off");
log("System online — camera only","ok");
loadStream("https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8");
</script>
