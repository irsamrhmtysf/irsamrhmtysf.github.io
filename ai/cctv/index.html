<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batam YOLO Traffic Vision</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c12;color:#d0d8e4;font-family:system-ui,-apple-system,sans-serif;font-size:14px;min-height:100vh}
.header{background:#11151f;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2533}
.header h1{font-size:1rem;font-weight:700;color:#00d4ff}
.badge{background:#ff1744;color:#fff;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:4px}
.wrap{max-width:900px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.cam{display:flex;gap:6px;flex-wrap:wrap}
select,input{flex:1;min-width:120px;background:#151a24;color:#d0d8e4;border:1px solid #2a3344;border-radius:6px;padding:8px 10px;font-size:.85rem}
button{background:#00d4ff;color:#000;border:none;padding:8px 14px;border-radius:6px;font-weight:600;font-size:.85rem}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
canvas{pointer-events:none}
.panel{background:#12161f;border:1px solid #1e2533;border-radius:8px;padding:12px}
.title{font-size:.7rem;color:#7a8494;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.box{background:#0a0c12;border-radius:8px;padding:12px 6px;text-align:center}
.box .num{font-size:1.8rem;font-weight:700;line-height:1}
.box .lab{font-size:.7rem;color:#8a94a4;margin-top:4px}
.dens{text-align:center;padding:10px;border-radius:6px;font-weight:700;font-size:1.05rem;margin:10px 0}
.d1{background:#0a2f1a;color:#00e676}.d2{background:#0d3b1f;color:#69f0ae}
.d3{background:#1a2a3a;color:#00d4ff}.d4{background:#3a2a0a;color:#ff9100}.d5{background:#3a0a0a;color:#ff1744}
.total{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.total .box .num{font-size:1.3rem}
.status{font-size:.75rem;color:#6a7484;margin-top:8px;text-align:center}
.report{background:#0c1810;border:1px solid #1a3a28;border-radius:6px;padding:10px;font-size:.8rem;line-height:1.45;margin-top:8px}
.report b{color:#00e676}
</style>
</head>
<body>
<div class="header">
  <h1>BATAM YOLO TRAFFIC</h1>
  <span class="badge">LIVE</span>
</div>

<div class="wrap">
  <div class="cam">
    <select id="cam" onchange="switchCam()">
      <option value="https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8">Simp. Kuda 1</option>
      <option value="https://matanya.batam.go.id/cctv/atap/stream.m3u8">Atap Walikota</option>
      <option value="https://matanya.batam.go.id/cctv/casablanca2/stream.m3u8">Casablanca</option>
      <option value="https://matanya.batam.go.id/cctv/matakucing1/stream.m3u8">Mata Kucing 1</option>
      <option value="https://matanya.batam.go.id/cctv/pasarjodoh2/stream.m3u8">Pasar Jodoh 2</option>
      <option value="https://matanya.batam.go.id/cctv/madanipancuran/stream.m3u8">Bundaran Madani</option>
      <option value="https://matanya.batam.go.id/cctv/batuaji/stream.m3u8">SP Batu Aji</option>
      <option value="https://matanya.batam.go.id/cctv/gerutara/stream.m3u8">Gerb. Utara</option>
      <option value="https://matanya.batam.go.id/cctv/southgate/stream.m3u8">Gerb. Selatan</option>
      <option value="https://matanya.batam.go.id/cctv/punggur1/stream.m3u8">Pel. Punggur</option>
      <option value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8">Pel. Sekupang</option>
      <option value="https://matanya.batam.go.id/cctv/delta2/stream.m3u8">Delta Villa 2</option>
    </select>
    <input id="url" type="text" placeholder="Custom m3u8...">
    <button onclick="loadUrl()">Load</button>
  </div>

  <div class="video">
    <video id="v" muted playsinline autoplay></video>
    <canvas id="c"></canvas>
  </div>

  <div class="panel">
    <div class="title">Realtime Count</div>
    <div class="counts">
      <div class="box"><div class="num" id="r-car" style="color:#00d4ff">0</div><div class="lab">Car</div></div>
      <div class="box"><div class="num" id="r-bus" style="color:#d500f9">0</div><div class="lab">Bus</div></div>
      <div class="box"><div class="num" id="r-truck" style="color:#ff1744">0</div><div class="lab">Truck</div></div>
      <div class="box"><div class="num" id="r-motor" style="color:#ffea00">0</div><div class="lab">Motor</div></div>
    </div>

    <div id="dens" class="dens d3">NORMAL</div>

    <div class="title">Total Counted</div>
    <div class="total">
      <div class="box"><div class="num" id="t-car" style="color:#00d4ff">0</div><div class="lab">Car</div></div>
      <div class="box"><div class="num" id="t-bus" style="color:#d500f9">0</div><div class="lab">Bus</div></div>
      <div class="box"><div class="num" id="t-truck" style="color:#ff1744">0</div><div class="lab">Truck</div></div>
      <div class="box"><div class="num" id="t-motor" style="color:#ffea00">0</div><div class="lab">Motor</div></div>
    </div>

    <div class="report" id="rep"><b>Report:</b> Waiting for data...</div>
    <div class="status" id="st">Loading model...</div>
  </div>
</div>

<script>
const video=document.getElementById("v"),canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let model=null,run=false,hls=null,skip=0,prev=[];
const tot={car:0,bus:0,truck:0,motor:0};
const map={car:"car",bus:"bus",truck:"truck",motorcycle:"motor",bicycle:"motor"};

function dens(n){
  const e=document.getElementById("dens");
  let c,t;
  if(n<=2){c="d1";t="SANGAT LENGANG"}
  else if(n<=5){c="d2";t="LENGANG"}
  else if(n<=11){c="d3";t="NORMAL"}
  else if(n<=18){c="d4";t="PADAT"}
  else{c="d5";t="SANGAT PADAT"}
  e.className="dens "+c;e.textContent=t;return t;
}

function report(n,d,r){
  let m="";
  if(d.includes("SANGAT PADAT"))m="Sangat padat. Rekomendasi rekayasa/pengalihan.";
  else if(d.includes("PADAT"))m="Padat. Pantau terus.";
  else if(d.includes("NORMAL"))m="Normal. Kondisi aman.";
  else m="Lengang. Optimal.";
  document.getElementById("rep").innerHTML=`<b>Report:</b> ${m} Car:${r.car} Bus:${r.bus} Truck:${r.truck} Motor:${r.motor}`;
}

function track(curr){
  const add={car:0,bus:0,truck:0,motor:0};
  const used=new Array(prev.length).fill(false);
  for(const o of curr){
    let best=70,idx=-1;
    for(let j=0;j<prev.length;j++){
      if(used[j]||prev[j].k!==o.k)continue;
      const d=Math.hypot(o.x-prev[j].x,o.y-prev[j].y);
      if(d<best){best=d;idx=j}
    }
    if(idx>=0)used[idx]=true;
    else add[o.k]++;
  }
  prev=curr;
  return add;
}

async function loop(){
  if(!run||!model)return;
  if(video.readyState<2){requestAnimationFrame(loop);return}
  if(++skip<2){requestAnimationFrame(loop);return}
  skip=0;
  const w=video.videoWidth,h=video.videoHeight;
  if(!w){requestAnimationFrame(loop);return}
  canvas.width=w;canvas.height=h;
  const preds=await model.detect(video,16);
  ctx.clearRect(0,0,w,h);
  const rt={car:0,bus:0,truck:0,motor:0},tracks=[];
  for(const p of preds){
    if(p.score<.4)continue;
    const k=map[p.class];
    if(!k)continue;
    rt[k]++;
    const [x,y,bw,bh]=p.bbox;
    tracks.push({x:x+bw/2,y:y+bh/2,k});
    const col=k==="car"?"#00d4ff":k==="bus"?"#d500f9":k==="truck"?"#ff1744":"#ffea00";
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);
    ctx.fillStyle=col;ctx.font="12px sans-serif";
    ctx.fillText(p.class+" "+Math.round(p.score*100)+"%",x,y>12?y-3:y+12);
  }
  const added=track(tracks);
  tot.car+=added.car;tot.bus+=added.bus;tot.truck+=added.truck;tot.motor+=added.motor;
  const n=rt.car+rt.bus+rt.truck+rt.motor;
  document.getElementById("r-car").textContent=rt.car;
  document.getElementById("r-bus").textContent=rt.bus;
  document.getElementById("r-truck").textContent=rt.truck;
  document.getElementById("r-motor").textContent=rt.motor;
  document.getElementById("t-car").textContent=tot.car;
  document.getElementById("t-bus").textContent=tot.bus;
  document.getElementById("t-truck").textContent=tot.truck;
  document.getElementById("t-motor").textContent=tot.motor;
  const d=dens(n);
  report(n,d,rt);
  document.getElementById("st").textContent=`Live • ${n} objects • ${d}`;
  requestAnimationFrame(loop);
}

function startDetect(){
  if(model&&video.readyState>=2&&!run){run=true;loop()}
}

function kill(){if(hls){hls.destroy();hls=null}run=false;prev=[]}
function loadStream(url){
  kill();
  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:5});
    hls.loadSource(url);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});startDetect()});
  }else{video.src=url;video.play().catch(()=>{});startDetect()}
}
function switchCam(){document.getElementById("url").value="";loadStream(document.getElementById("cam").value)}
function loadUrl(){const u=document.getElementById("url").value.trim();if(u)loadStream(u)}

async function init(){
  try{
    model=await cocoSsd.load({base:"mobilenet_v2"});
    document.getElementById("st").textContent="Model ready";
    startDetect();
  }catch(e){document.getElementById("st").textContent="Model failed"}
}
video.addEventListener("playing",startDetect);
loadStream("https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8");
init();
</script>
</body>
</html>
