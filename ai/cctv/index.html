<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
.header{padding:10px 14px;background:linear-gradient(90deg,#111,#1a1a2e);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;flex-wrap:wrap;gap:8px}
.header h1{font-size:1rem;font-weight:600;color:#00d4ff}
.badge{background:#e11;color:#fff;font-size:.65rem;padding:2px 7px;border-radius:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.main{display:flex;flex-direction:column;gap:10px;padding:10px;max-width:1100px;margin:0 auto}
.video-wrap{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 6px 24px rgba(0,0,0,.5)}
video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
canvas{pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:500px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:#16161f;border:1px solid #2a2a3a;border-radius:8px;padding:8px 4px;text-align:center}
.stat .num{font-size:1.5rem;font-weight:700;color:#00d4ff;line-height:1.1}
.stat .label{font-size:.68rem;color:#888;margin-top:1px}
.select-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,input[type=text]{background:#1a1a25;color:#eee;border:1px solid #333;border-radius:6px;padding:8px 10px;font-size:.85rem;flex:1;min-width:140px}
button{background:#00d4ff;color:#000;border:none;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.85rem;white-space:nowrap}
button.secondary{background:#2a2a3a;color:#ccc}
.status{font-size:.75rem;color:#888}
.log{background:#111;border-radius:6px;padding:8px;font-size:.7rem;max-height:90px;overflow-y:auto;color:#6a6;font-family:monospace}
</style>
</head>
