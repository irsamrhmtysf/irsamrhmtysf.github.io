<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batam AI Traffic Vision</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0e14;--card:#12161f;--bd:#1e2533;--acc:#00c2ff;--g:#00e676;--o:#ff9100;--r:#ff1744}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#c8d0dc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;min-height:100vh}
.top{background:#0d111a;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.top h1{font-size:.95rem;font-weight:700;color:var(--acc)}
.live{background:var(--r);color:#fff;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:3px}
.main{display:grid;grid-template-columns:1fr;gap:10px;padding:10px;max-width:1200px;margin:0 auto}
@media(min-width:860px){.main{grid-template-columns:1.35fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.cam{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
select,input{background:#0d111a;color:#c8d0dc;border:1px solid #2a3344;border-radius:5px;padding:6px 8px;font-size:.78rem;flex:1;min-width:110px}
button{background:var(--acc);color:#000;border:none;padding:6px 10px;border-radius:5px;font-weight:600;cursor:pointer;font-size:.78rem}
.vbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
canvas{pointer-events:none}
.dens{text-align:center;padding:7px;border-radius:5px;font-weight:700;font-size:.95rem;margin-bottom:8px}
.d1{background:#0a2f1a;color:var(--g)}.d2{background:#0d3b1f;color:#69f0ae}.d3{background:#1a2a3a;color:var(--acc)}
.d4{background:#3a2a0a;color:var(--o)}.d5{background:#3a0a0a;color:var(--r)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item{background:#0d111a;border:1px solid var(--bd);border-radius:5px;padding:8px 4px;text-align:center}
.item .n{font-size:1.35rem;font-weight:700;line-height:1.1}
.item .l{font-size:.62rem;color:#7a8494;margin-top:2px}
.ttl{font-size:.68rem;color:#6a7484;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 5px;font-weight:600}
.chart-box{height:110px;margin-top:4px}
.dec{background:#0c1810;border:1px solid #1a3a28;border-radius:5px;padding:8px;font-size:.75rem;line-height:1.4;margin-top:8px}
.dec b{color:var(--g)}
.st{font-size:.68rem;color:#5a6474;margin-top:6px}
.run{font-size:.72rem;color:#8a94a4;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="top">
  <h1>BATAM AI TRAFFIC VISION</h1>
  <span class="live">LIVE</span>
</div>

<div class="main">
  <div class="card">
    <div class="cam">
      <select id="camSelect" onchange="changeCam()">
        <option value="https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8">Simp. Kuda 1</option>
        <option value="https://matanya.batam.go.id/cctv/atap/stream.m3u8">Atap Walikota</option>
        <option value="https://matanya.batam.go.id/cctv/casablanca2/stream.m3u8">Casablanca</option>
        <option value="https://matanya.batam.go.id/cctv/matakucing1/stream.m3u8">Mata Kucing 1</option>
        <option value="https://matanya.batam.go.id/cctv/pasarjodoh2/stream.m3u8">Pasar Jodoh 2</option>
        <option value="https://matanya.batam.go.id/cctv/madanipancuran/stream.m3u8">Bundaran Madani</option>
        <option value="https://matanya.batam.go.id/cctv/madaniseipanas/stream.m3u8">Madani S.Panas</option>
        <option value="https://matanya.batam.go.id/cctv/batuaji/stream.m3u8">SP Batu Aji</option>
        <option value="https://matanya.batam.go.id/cctv/gerutara/stream.m3u8">Gerb. Utara</option>
        <option value="https://matanya.batam.go.id/cctv/southgate/stream.m3u8">Gerb. Selatan</option>
        <option value="https://matanya.batam.go.id/cctv/kejaksaanbi/stream.m3u8">Kejaksaan BI</option>
        <option value="https://matanya.batam.go.id/cctv/punggur1/stream.m3u8">Pel. Punggur</option>
        <option value="https://matanya.batam.go.id/cctv/sekupang/stream.m3u8">Pel. Sekupang</option>
        <option value="https://matanya.batam.go.id/cctv/delta2/stream.m3u8">Delta Villa 2</option>
        <option value="https://matanya.batam.go.id/cctv/sambau2/stream.m3u8">Sambau 2</option>
        <option value="https://matanya.batam.go.id/cctv/pura1/stream.m3u8">Pura Sei Ladi</option>
        <option value="https://matanya.batam.go.id/cctv/cobaan/stream.m3u8">Pos DPRD</option>
      </select>
      <input type="text" id="customUrl" placeholder="m3u8 URL...">
      <button onclick="loadCustom()">Load</button>
    </div>
    <div class="vbox">
      <video id="video" muted playsinline autoplay></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="st" id="status">Loading COCO-SSD...</div>
  </div>

  <div class="card">
    <div id="dens" class="dens d3">NORMAL</div>

    <div class="ttl">Realtime Detection</div>
    <div class="grid4">
      <div class="item"><div class="n" id="rt-m" style="color:#00c2ff">0</div><div class="l">Mobil</div></div>
      <div class="item"><div class="n" id="rt-b" style="color:#d500f9">0</div><div class="l">Bis</div></div>
      <div class="item"><div class="n" id="rt-t" style="color:#ff1744">0</div><div class="l">Truk</div></div>
      <div class="item"><div class="n" id="rt-o" style="color:#ffea00">0</div><div class="l">Motor</div></div>
    </div>

    <div class="ttl">Grafik Volume</div>
    <div class="chart-box"><canvas id="chart"></canvas></div>

    <div class="ttl">Total Counted</div>
    <div class="grid4">
      <div class="item"><div class="n" id="al-m" style="color:#00c2ff">0</div><div class="l">Mobil</div></div>
      <div class="item"><div class="n" id="al-b" style="color:#d500f9">0</div><div class="l">Bis</div></div>
      <div class="item"><div class="n" id="al-t" style="color:#ff1744">0</div><div class="l">Truk</div></div>
      <div class="item"><div class="n" id="al-o" style="color:#ffea00">0</div><div class="l">Motor</div></div>
    </div>
    <div class="run">Waktu sistem: <b id="run">00:00:00</b></div>

    <div class="dec" id="dec"><b>Analisis & Keputusan:</b> Menunggu data...</div>
  </div>
</div>

<script>
var STREAM="https://matanya.batam.go.id/cctv/simpkuda1/stream.m3u8";
var video=document.getElementById("video"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
var model=null,detecting=false,animId=null,hls=null,frameSkip=0,SKIP=2;
var start=Date.now(),all={m:0,b:0,t:0,o:0},hist=[],chartL=[],chartV=[],ch=null;
var prevTracks=[]; // simple tracking for better counting

function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;return(h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function setDens(n){var e=document.getElementById("dens"),c,t;if(n<=2){c="d1";t="SANGAT LENGANG"}else if(n<=5){c="d2";t="LENGANG"}else if(n<=11){c="d3";t="NORMAL"}else if(n<=18){c="d4";t="PADAT"}else{c="d5";t="SANGAT PADAT"}e.className="dens "+c;e.textContent=t;return t}
function decide(tot,dens,tr,rt){var e=document.getElementById("dec"),m="";
if(dens.indexOf("SANGAT PADAT")>=0)m="Sangat padat. Rekomendasi: rekayasa lalu lintas / pengalihan.";
else if(dens.indexOf("PADAT")>=0)m="Padat. Pantau 5-10 menit ke depan.";
else if(dens.indexOf("NORMAL")>=0)m="Normal. Tidak perlu tindakan khusus.";
else m="Lengang. Kondisi optimal.";
if(tr>2.5)m+=" Prediksi: tren naik.";
else if(tr<-2.5)m+=" Prediksi: tren turun.";
else m+=" Prediksi: stabil.";
m+=" [M:"+rt.m+" B:"+rt.b+" T:"+rt.t+" O:"+rt.o+"]";
e.innerHTML="<b>Analisis & Keputusan:</b> "+m}

function initCh(){ch=new Chart(document.getElementById("chart").getContext("2d"),{type:"line",data:{labels:chartL,datasets:[{data:chartV,borderColor:"#00c2ff",backgroundColor:"rgba(0,194,255,.1)",tension:.35,fill:true,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{beginAtZero:true,ticks:{color:"#5a6474",font:{size:9}},grid:{color:"#1e2533"}}}})}
function pushCh(v){chartL.push("");chartV.push(v);if(chartL.length>35){chartL.shift();chartV.shift()}if(ch)ch.update("none")}

function killH(){if(hls){hls.destroy();hls=null}}
function initS(u){STREAM=u;killH();detecting=false;prevTracks=[];if(animId)cancelAnimationFrame(animId);if(Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:6});hls.loadSource(u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,function(){video.play().catch(function(){});tryA()})}else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=u;video.play().catch(function(){});tryA()}}
function changeCam(){document.getElementById("customUrl").value="";initS(document.getElementById("camSelect").value)}
function loadCustom(){var u=document.getElementById("customUrl").value.trim();if(u)initS(u)}

async function loadM(){try{model=await cocoSsd.load({base:"mobilenet_v2"});document.getElementById("status").textContent="COCO-SSD ready • detecting";tryA()}catch(e){document.getElementById("status").textContent="Model error"}}
function tryA(){if(model&&video.readyState>=2&&!detecting){detecting=true;detect()}}

function matchTracks(curr){
  var newCount={m:0,b:0,t:0,o:0};
  var matched=new Array(prevTracks.length).fill(false);
  for(var i=0;i<curr.length;i++){
    var best=80,bestJ=-1;
    for(var j=0;j<prevTracks.length;j++){
      if(matched[j]||prevTracks[j].k!==curr[i].k)continue;
      var d=Math.hypot(curr[i].x-prevTracks[j].x,curr[i].y-prevTracks[j].y);
      if(d<best){best=d;bestJ=j}
    }
    if(bestJ>=0){matched[bestJ]=true} // existing
    else{newCount[curr[i].k]++} // new object
  }
  prevTracks=curr;
  return newCount;
}

async function detect(){if(!detecting||!model)return;if(video.readyState<2){animId=requestAnimationFrame(detect);return}frameSkip++;if(frameSkip<SKIP){animId=requestAnimationFrame(detect);return}frameSkip=0;
var w=video.videoWidth,h=video.videoHeight;if(!w){animId=requestAnimationFrame(detect);return}canvas.width=w;canvas.height=h;
var preds=await model.detect(video,20);ctx.clearRect(0,0,w,h);
var rt={m:0,b:0,t:0,o:0},tracks=[];
for(var i=0;i<preds.length;i++){var p=preds[i];if(p.score<.42)continue;var c=p.class,k=null;if(c==="car")k="m";else if(c==="bus")k="b";else if(c==="truck")k="t";else if(c==="motorcycle"||c==="bicycle")k="o";if(!k)continue;rt[k]++;
var x=p.bbox[0],y=p.bbox[1],bw=p.bbox[2],bh=p.bbox[3];
tracks.push({x:x+bw/2,y:y+bh/2,k:k});
var col=k==="m"?"#00c2ff":k==="b"?"#d500f9":k==="t"?"#ff1744":"#ffea00";
ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);ctx.fillStyle=col;ctx.font="11px sans-serif";ctx.fillText(c+" "+Math.round(p.score*100)+"%",x,y>11?y-2:y+11)}
var added=matchTracks(tracks);
all.m+=added.m;all.b+=added.b;all.t+=added.t;all.o+=added.o;
var tot=rt.m+rt.b+rt.t+rt.o;hist.push(tot);if(hist.length>20)hist.shift();
var avg=hist.reduce(function(a,b){return a+b},0)/hist.length;var tr=tot-avg;
document.getElementById("rt-m").textContent=rt.m;document.getElementById("rt-b").textContent=rt.b;document.getElementById("rt-t").textContent=rt.t;document.getElementById("rt-o").textContent=rt.o;
document.getElementById("al-m").textContent=all.m;document.getElementById("al-b").textContent=all.b;document.getElementById("al-t").textContent=all.t;document.getElementById("al-o").textContent=all.o;
document.getElementById("run").textContent=fmt(Date.now()-start);
var dens=setDens(tot);decide(tot,dens,tr,rt);
if(Math.random()<.35)pushCh(tot);
document.getElementById("status").textContent="Live • "+tot+" objek • "+dens;
animId=requestAnimationFrame(detect)}

video.addEventListener("playing",tryA);
initCh();initS(STREAM);loadM();
setInterval(function(){document.getElementById("run").textContent=fmt(Date.now()-start)},1000);
</script>
</body>
</html>
