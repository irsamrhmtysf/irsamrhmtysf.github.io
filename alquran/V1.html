<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Quran Tematik</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#020617;--card:rgba(15,23,42,.7);--accent:#38bdf8;--text:#e2e8f0}
  .light{--bg:#f8fafc;--card:rgba(255,255,255,.85);--accent:#0284c7;--text:#0f172a}
  body{font-family:Inter,system-ui;background:var(--bg);color:var(--text);transition:background .4s,color .4s}
  .font-ar{font-family:Amiri,serif}
  #sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at bottom,#0f172a 0%,#020617 80%);transition:opacity .5s}
  .light #sky{opacity:.15}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) infinite ease-in-out}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  .glass{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,.15)}
  .player-bar{transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s}
  .player-full{transition:opacity .3s,transform .35s cubic-bezier(.34,1.3,.64,1)}
  .highlight{background:linear-gradient(90deg,rgba(56,189,248,.25),transparent);border-radius:6px;padding:2px 4px}
  .progress{height:4px;background:rgba(148,163,184,.25);border-radius:99px;overflow:hidden;cursor:pointer}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}
  .btn-ctrl{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .btn-ctrl:active{transform:scale(.92)}
  .scroll-smooth{scroll-behavior:smooth}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:4px}
</style>
</head>
<body class="min-h-screen overflow-x-hidden scroll-smooth">
<div id="sky"></div>

<!-- Main -->
<div class="relative z-10 max-w-lg mx-auto px-4 pt-5 pb-32">
  <header class="flex items-center justify-between mb-5">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Al Quran Tematik</h1>
      <p class="text-xs opacity-60">Islamic Cosmic • Tematik</p>
    </div>
    <div class="flex gap-2">
      <button id="ambientBtn" onclick="toggleAmbient()" class="w-9 h-9 rounded-full glass flex items-center justify-center text-sm" title="Ambient">♪</button>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass flex items-center justify-center text-sm" title="Day/Night">◐</button>
    </div>
  </header>

  <div class="mb-4 sticky top-2 z-20">
    <div class="glass rounded-2xl px-3 py-2.5 flex items-center gap-2">
      <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="search" type="search" placeholder="Cari tema..." class="bg-transparent w-full outline-none text-sm" autocomplete="off">
    </div>
  </div>

  <div id="themes" class="space-y-2"></div>
</div>

<!-- Mini Player Bar (Spotify style) -->
<div id="miniBar" class="player-bar fixed bottom-0 inset-x-0 z-40 translate-y-full opacity-0">
  <div class="max-w-lg mx-auto px-3 pb-3 pt-1">
    <div class="glass rounded-2xl p-3 flex items-center gap-3 shadow-2xl cursor-pointer" onclick="openFullPlayer()">
      <div class="w-11 h-11 rounded-xl bg-sky-500/20 flex items-center justify-center text-lg font-ar shrink-0">ق</div>
      <div class="flex-1 min-w-0">
        <p id="miniTitle" class="text-sm font-semibold truncate">—</p>
        <p id="miniSub" class="text-xs opacity-60 truncate">Siap diputar</p>
      </div>
      <button onclick="event.stopPropagation();togglePlay()" id="miniPlay" class="btn-ctrl bg-sky-500 text-white text-lg">▶</button>
    </div>
  </div>
</div>

<!-- Full Player (Centered Modal) -->
<div id="fullPlayer" class="player-full fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="closeFullPlayer()"></div>
  <div class="relative glass w-full max-w-md rounded-3xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
    <button onclick="closeFullPlayer()" class="absolute top-4 right-4 w-8 h-8 rounded-full glass flex items-center justify-center text-lg opacity-70">×</button>
    
    <div class="text-center mb-5">
      <p id="fpSurah" class="text-xs uppercase tracking-widest opacity-60 mb-1">—</p>
      <h2 id="fpTitle" class="text-lg font-bold">—</h2>
    </div>

    <div id="fpAr" class="font-ar text-2xl leading-loose text-right mb-4 min-h-[4rem] transition-all"></div>
    <div id="fpId" class="text-sm leading-relaxed opacity-80 mb-6 min-h-[3rem]"></div>

    <!-- Progress -->
    <div class="progress mb-1" id="progressBar" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="flex justify-between text-xs opacity-50 mb-5">
      <span id="timeCur">0:00</span>
      <span id="timeTotal">0:00</span>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-center gap-5 mb-4">
      <button onclick="restart()" class="btn-ctrl glass text-lg" title="Restart">↺</button>
      <button onclick="togglePlay()" id="fpPlay" class="btn-ctrl bg-sky-500 text-white text-2xl w-16 h-16 shadow-lg shadow-sky-500/30">▶</button>
      <button onclick="stopAll()" class="btn-ctrl glass text-lg" title="Stop">⏹</button>
    </div>

    <div class="flex justify-center gap-3 text-xs">
      <button onclick="playTTS()" class="px-4 py-2 rounded-full glass">Arti (TTS)</button>
      <a id="fpLink" href="#" target="_blank" class="px-4 py-2 rounded-full glass">quran.com</a>
    </div>
  </div>
</div>

<audio id="ambient" loop preload="none" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b5f1e4e0c.mp3?filename=soft-ambient-112191.mp3"></audio>

<script>
const SURAH=["","Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Lail","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const THEMES={"Alam Semesta":[[2,164],[3,190],[21,30],[21,33],[36,38],[36,40],[41,11],[51,47],[55,5],[55,7],[67,3],[88,17]],"Tauhid":[[2,163],[2,255],[3,2],[3,18],[4,48],[6,102],[16,36],[17,42],[21,22],[37,35],[39,3],[112,1]],"Iman kepada Allah":[[2,255],[3,2],[6,59],[6,103],[13,9],[20,8],[24,35],[59,22],[59,23],[59,24]],"Hari Akhir":[[3,185],[6,31],[22,7],[36,51],[39,68],[50,20],[69,13],[75,6],[78,17],[81,1],[82,1],[99,1]],"Akhlak Mulia":[[2,177],[3,134],[4,36],[16,90],[17,23],[25,63],[31,18],[49,11],[49,12],[68,4]],"Sabar":[[2,153],[2,155],[3,200],[16,126],[18,28],[31,17],[39,10],[42,43],[70,5],[103,3]],"Shalat":[[2,3],[2,43],[4,103],[11,114],[17,78],[20,14],[29,45],[70,34],[108,2]],"Zakat & Infak":[[2,43],[2,110],[2,261],[2,267],[9,60],[9,103],[57,18],[64,16]],"Kisah Nabi":[[2,124],[7,59],[7,65],[7,73],[7,85],[11,25],[19,16],[21,51],[21,83],[27,15],[37,102]],"Surga":[[2,25],[3,133],[9,72],[13,23],[18,31],[36,55],[47,15],[55,46],[56,12],[76,5]],"Neraka":[[2,24],[3,131],[4,56],[14,16],[18,29],[22,19],[39,16],[67,6],[74,26],[104,4]],"Ilmu":[[2,31],[2,269],[3,18],[16,78],[20,114],[35,28],[39,9],[58,11],[96,1],[96,5]]};

let current=null,audio=null,isPlaying=false,raf=null;

function stars(){const s=document.getElementById('sky');for(let i=0;i<70;i++){const d=document.createElement('div');d.className='star';const sz=Math.random()*1.8+.6;d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(2+Math.random()*4).toFixed(1)}s`;s.appendChild(d)}}

function render(q=''){const el=document.getElementById('themes');el.innerHTML='';const f=q.toLowerCase();
Object.entries(THEMES).forEach(([tema,list])=>{
if(f&&!tema.toLowerCase().includes(f))return;
const card=document.createElement('div');card.className='glass rounded-2xl overflow-hidden';
card.innerHTML=`<button class="w-full flex items-center justify-between px-4 py-3.5 text-left" data-t="${tema}"><span class="font-medium text-sm">${tema}</span><span class="text-xs opacity-40">${list.length}</span></button><div class="hidden px-2 pb-2 space-y-1" id="l-${tema.replace(/\s/g,'')}"></div>`;
el.appendChild(card);
const btn=card.querySelector('button'),listEl=card.querySelector('div');
list.forEach(([s,a])=>{const b=document.createElement('button');b.className='w-full text-left px-3 py-2 rounded-xl text-sm opacity-80 hover:bg-sky-500/15 hover:opacity-100 transition';b.textContent=`${SURAH[s]} (${s}.${a})`;b.onclick=e=>{e.stopPropagation();loadAyah(s,a)};listEl.appendChild(b)});
btn.onclick=()=>{document.querySelectorAll('[id^=l-]').forEach(x=>x.classList.add('hidden'));const open=!listEl.classList.contains('hidden');if(!open)listEl.classList.remove('hidden')}})}

async function loadAyah(s,a){
current={s,a};document.getElementById('miniTitle').textContent=`${SURAH[s]} ${s}:${a}`;document.getElementById('miniSub').textContent='Memuat...';
document.getElementById('fpSurah').textContent=SURAH[s];document.getElementById('fpTitle').textContent=`Ayat ${a}`;
document.getElementById('fpAr').innerHTML='<div class="loader mx-auto w-6 h-6 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>';
document.getElementById('fpId').textContent='';document.getElementById('fpLink').href=`https://quran.com/${s}/${a}`;
showMini();openFullPlayer();
try{const[ar,id]=await Promise.all([fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`).then(r=>r.json()),fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/id.indonesian`).then(r=>r.json())]);
document.getElementById('fpAr').textContent=ar.data.text;document.getElementById('fpId').textContent=id.data.text;
document.getElementById('miniSub').textContent=id.data.text.slice(0,40)+'...';playAudio()}catch{document.getElementById('fpId').textContent='Gagal memuat'}}

function playAudio(){if(!current)return;stopAudioOnly();const p=n=>String(n).padStart(3,'0');
audio=new Audio(`https://everyayah.com/data/Alafasy_128kbps/${p(current.s)}${p(current.a)}.mp3`);
audio.addEventListener('loadedmetadata',()=>{document.getElementById('timeTotal').textContent=fmt(audio.duration)});
audio.addEventListener('timeupdate',updateProgress);audio.addEventListener('ended',()=>{isPlaying=false;updateBtns();document.getElementById('fpAr').classList.remove('highlight')});
audio.play().then(()=>{isPlaying=true;updateBtns();document.getElementById('fpAr').classList.add('highlight')}).catch(()=>{})}

function togglePlay(){if(!audio)return;if(isPlaying){audio.pause();isPlaying=false;document.getElementById('fpAr').classList.remove('highlight')}else{audio.play();isPlaying=true;document.getElementById('fpAr').classList.add('highlight')}updateBtns()}
function restart(){if(!audio)return;audio.currentTime=0;audio.play();isPlaying=true;document.getElementById('fpAr').classList.add('highlight');updateBtns()}
function stopAll(){stopAudioOnly();speechSynthesis.cancel();isPlaying=false;updateBtns();document.getElementById('fpAr').classList.remove('highlight');document.getElementById('progressFill').style.width='0%'}
function stopAudioOnly(){if(audio){audio.pause();audio=null}cancelAnimationFrame(raf)}

function updateProgress(){if(!audio)return;const pct=(audio.currentTime/audio.duration)*100;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('timeCur').textContent=fmt(audio.currentTime)}
function seek(e){if(!audio||!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration}
function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${sec<10?'0':''}${sec}`}
function updateBtns(){const icon=isPlaying?'⏸':'▶';document.getElementById('miniPlay').textContent=icon;document.getElementById('fpPlay').textContent=icon}

function showMini(){const b=document.getElementById('miniBar');b.classList.remove('translate-y-full','opacity-0')}
function openFullPlayer(){const p=document.getElementById('fullPlayer');p.classList.remove('opacity-0','pointer-events-none');p.classList.add('opacity-100');document.body.style.overflow='hidden'}
function closeFullPlayer(){const p=document.getElementById('fullPlayer');p.classList.add('opacity-0','pointer-events-none');p.classList.remove('opacity-100');document.body.style.overflow=''}

function playTTS(){const t=document.getElementById('fpId').textContent;if(!t||t.includes('Gagal'))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.9;speechSynthesis.speak(u)}
function toggleTheme(){document.documentElement.classList.toggle('dark');document.documentElement.classList.toggle('light')}
function toggleAmbient(){const a=document.getElementById('ambient');if(a.paused){a.volume=.25;a.play().catch(()=>{});document.getElementById('ambientBtn').classList.add('text-sky-400')}else{a.pause();document.getElementById('ambientBtn').classList.remove('text-sky-400')}}

document.getElementById('search').oninput=e=>render(e.target.value);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFullPlayer();if(e.key===' '&&current){e.preventDefault();togglePlay()}});
stars();render();
</script>
</body>
</html>
