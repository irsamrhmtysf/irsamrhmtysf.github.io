<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Al Quran Tematik</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:rgba(15,23,42,.78);--accent:#38bdf8}
.light{--bg:#f1f5f9;--card:rgba(255,255,255,.92);--accent:#0284c7}
body{font-family:Inter,system-ui;background:var(--bg);color:#e2e8f0;margin:0;overflow:hidden;height:100dvh}
.light body{color:#0f172a}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at bottom,#0f172a,#020617 85%)}
.light #sky{opacity:.1}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.glass{background:var(--card);backdrop-filter:blur(22px);border:1px solid rgba(148,163,184,.14)}
.font-ar{font-family:Amiri,serif}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:1.2rem;position:relative}
.highlight{background:linear-gradient(90deg,rgba(56,189,248,.28),transparent);border-radius:8px}
.progress{height:3px;background:rgba(148,163,184,.22);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}
.btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:transform .15s}
.btn:active{transform:scale(.9)}
.mode-btn{padding:.4rem 1rem;border-radius:999px;font-size:.75rem;font-weight:600;transition:all .2s}
.mode-active{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="sky"></div>

<!-- HOME -->
<div id="home" class="relative z-10 h-full flex flex-col max-w-lg mx-auto">
  <header class="flex items-center justify-between px-4 pt-5 pb-3">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Al Quran Tematik</h1>
      <p class="text-xs opacity-50">Belajar • Shorts Mode</p>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleAmbient()" id="ambBtn" class="w-9 h-9 rounded-full glass text-sm" title="Ambient">♪</button>
      <button onclick="openSettings()" class="w-9 h-9 rounded-full glass text-sm" title="Settings">⚙</button>
    </div>
  </header>
  <div class="px-4 mb-3">
    <input id="search" type="search" placeholder="Cari tema..." class="w-full glass rounded-2xl px-4 py-2.5 text-sm outline-none" autocomplete="off">
  </div>
  <div id="themes" class="flex-1 overflow-y-auto px-4 pb-10 space-y-2"></div>
</div>

<!-- SETTINGS -->
<div id="settings" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeSettings()"></div>
  <div class="relative glass w-full max-w-sm rounded-3xl p-6">
    <h3 class="font-bold text-lg mb-4">Pengaturan</h3>
    <p class="text-xs opacity-60 mb-2">Bahasa Arti (TTS)</p>
    <div class="flex gap-2 mb-5">
      <button onclick="setLang('id')" id="lang-id" class="mode-btn flex-1 glass mode-active">Indonesia</button>
      <button onclick="setLang('en')" id="lang-en" class="mode-btn flex-1 glass">English</button>
    </div>
    <p class="text-xs opacity-60 mb-2">Tema</p>
    <div class="flex gap-2 mb-6">
      <button onclick="setTheme('dark')" class="mode-btn flex-1 glass">Night</button>
      <button onclick="setTheme('light')" class="mode-btn flex-1 glass">Day</button>
    </div>
    <button onclick="closeSettings()" class="w-full py-3 rounded-2xl bg-sky-500 text-white font-medium text-sm">Selesai</button>
  </div>
</div>

<!-- FEED -->
<div id="feedWrap" class="fixed inset-0 z-30 hidden">
  <div id="feed" class="feed relative z-10"></div>
  <button onclick="closeFeed()" class="absolute top-4 left-4 z-50 w-10 h-10 rounded-full glass flex items-center justify-center text-lg">←</button>
</div>

<audio id="ambient" loop preload="none" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b5f1e4e0c.mp3?filename=soft-ambient-112191.mp3"></audio>

<script>
const SURAH=["","Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Lail","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const THEMES={"Alam Semesta":[[2,164],[3,190],[21,30],[21,33],[36,38],[36,40],[41,11],[51,47],[55,5],[55,7],[67,3],[88,17]],"Tauhid":[[2,163],[2,255],[3,2],[3,18],[4,48],[6,102],[16,36],[17,42],[21,22],[37,35],[39,3],[112,1]],"Iman kepada Allah":[[2,255],[3,2],[6,59],[6,103],[13,9],[20,8],[24,35],[59,22],[59,23],[59,24]],"Hari Akhir":[[3,185],[6,31],[22,7],[36,51],[39,68],[50,20],[69,13],[75,6],[78,17],[81,1],[82,1],[99,1]],"Akhlak Mulia":[[2,177],[3,134],[4,36],[16,90],[17,23],[25,63],[31,18],[49,11],[49,12],[68,4]],"Sabar":[[2,153],[2,155],[3,200],[16,126],[18,28],[31,17],[39,10],[42,43],[70,5],[103,3]],"Shalat":[[2,3],[2,43],[4,103],[11,114],[17,78],[20,14],[29,45],[70,34],[108,2]],"Zakat & Infak":[[2,43],[2,110],[2,261],[2,267],[9,60],[9,103],[57,18],[64,16]],"Kisah Nabi":[[2,124],[7,59],[7,65],[7,73],[7,85],[11,25],[19,16],[21,51],[21,83],[27,15],[37,102]],"Surga":[[2,25],[3,133],[9,72],[13,23],[18,31],[36,55],[47,15],[55,46],[56,12],[76,5]],"Neraka":[[2,24],[3,131],[4,56],[14,16],[18,29],[22,19],[39,16],[67,6],[74,26],[104,4]],"Ilmu":[[2,31],[2,269],[3,18],[16,78],[20,114],[35,28],[39,9],[58,11],[96,1],[96,5]]};

function globalAyah(s,a){const lens=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];let n=0;for(let i=1;i<s;i++)n+=lens[i-1];return n+a}

let list=[],idx=0,audio=null,isPlaying=false,mode='ngaji',lang='id',observer;

function stars(){const s=document.getElementById('sky');for(let i=0;i<55;i++){const d=document.createElement('div');d.className='star';const sz=.6+Math.random()*1.5;d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s`;s.appendChild(d)}}

function render(q=''){const el=document.getElementById('themes');el.innerHTML='';const f=q.toLowerCase();
Object.entries(THEMES).forEach(([tema,ayahs])=>{
if(f&&!tema.toLowerCase().includes(f))return;
const b=document.createElement('button');
b.className='glass w-full rounded-2xl px-4 py-3.5 text-left flex justify-between items-center active:scale-[.98] transition';
b.innerHTML=`<span class="font-medium text-sm">${tema}</span><span class="text-xs opacity-40">${ayahs.length} ayat</span>`;
b.onclick=()=>openFeed(tema,ayahs);el.appendChild(b)})}

async function openFeed(tema,ayahs){
list=ayahs;idx=0;stopAll();
document.getElementById('home').classList.add('hidden');
document.getElementById('feedWrap').classList.remove('hidden');
const feed=document.getElementById('feed');feed.innerHTML='';
list.forEach(([s,a],i)=>{
const card=document.createElement('div');card.className='card';card.dataset.i=i;
card.innerHTML=`
<div class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full">
  <p class="text-xs uppercase tracking-widest opacity-50 mb-1 text-center">${tema}</p>
  <p class="text-sm font-semibold text-center mb-4 opacity-80">${SURAH[s]} • ${s}:${a}</p>
  <div class="font-ar text-2xl leading-loose text-right mb-3 min-h-[4.5rem]" id="ar-${i}">...</div>
  <div class="text-sm leading-relaxed opacity-85 mb-5 min-h-[3.5rem]" id="id-${i}">Memuat arti...</div>
  <div class="progress mb-1.5"><div class="progress-fill" id="pf-${i}"></div></div>
  <div class="flex justify-between text-xs opacity-40 mb-4"><span id="tc-${i}">0:00</span><span id="tt-${i}">—</span></div>
  <div class="flex justify-center gap-2 mb-4">
    <button class="mode-btn glass ${mode==='ngaji'?'mode-active':''}" id="m-ngaji-${i}" onclick="setMode('ngaji',${i})">Ngaji</button>
    <button class="mode-btn glass ${mode==='arti'?'mode-active':''}" id="m-arti-${i}" onclick="setMode('arti',${i})">Arti</button>
  </div>
  <div class="flex justify-center gap-4">
    <button class="btn glass" onclick="restart(${i})">↺</button>
    <button class="btn bg-sky-500 text-white shadow-lg shadow-sky-500/25" id="play-${i}" onclick="toggle(${i})">▶</button>
    <button class="btn glass" onclick="next()">⏭</button>
  </div>
</div>`;
feed.appendChild(card);loadText(i,s,a)});
setupObserver();setTimeout(()=>play(0),350)}

async function loadText(i,s,a){
const edition=lang==='id'?'id.indonesian':'en.sahih';
try{const[ar,tr]=await Promise.all([
fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`).then(r=>r.json()),
fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/${edition}`).then(r=>r.json())]);
document.getElementById(`ar-${i}`).textContent=ar.data.text;
document.getElementById(`id-${i}`).textContent=tr.data.text;
document.getElementById(`id-${i}`).dataset.text=tr.data.text}catch{document.getElementById(`id-${i}`).textContent='Gagal memuat arti'}}

function setupObserver(){if(observer)observer.disconnect();
observer=new IntersectionObserver(ents=>{ents.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.65){const i=+e.target.dataset.i;if(i!==idx){idx=i;play(i)}}})},{threshold:.65});
document.querySelectorAll('.card').forEach(c=>observer.observe(c))}

function setMode(m,i){mode=m;document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>b.classList.toggle('mode-active',m==='ngaji'));
document.querySelectorAll('[id^=m-arti-]').forEach(b=>b.classList.toggle('mode-active',m==='arti'));
if(i===idx)play(i)}

function play(i){
stopAll();idx=i;
const [s,a]=list[i];
if(mode==='ngaji'){
  const num=globalAyah(s,a);
  audio=new Audio(`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${num}.mp3`);
  audio.addEventListener('loadedmetadata',()=>document.getElementById(`tt-${i}`).textContent=fmt(audio.duration));
  audio.addEventListener('timeupdate',()=>{const pct=(audio.currentTime/audio.duration)*100;document.getElementById(`pf-${i}`).style.width=pct+'%';document.getElementById(`tc-${i}`).textContent=fmt(audio.currentTime);const ar=document.getElementById(`ar-${i}`);if(pct>3)ar.classList.add('highlight')});
  audio.addEventListener('ended',()=>{isPlaying=false;updateBtn(i);setTimeout(next,700)});
  audio.play().then(()=>{isPlaying=true;updateBtn(i)}).catch(()=>{})
}else{
  const text=document.getElementById(`id-${i}`).dataset.text||document.getElementById(`id-${i}`).textContent;
  if(!text||text.includes('Gagal')||text.includes('Memuat'))return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='id'?'id-ID':'en-US';u.rate=.92;
  u.onstart=()=>{isPlaying=true;updateBtn(i);document.getElementById(`id-${i}`).classList.add('highlight')};
  u.onend=()=>{isPlaying=false;updateBtn(i);document.getElementById(`id-${i}`).classList.remove('highlight');setTimeout(next,600)};
  speechSynthesis.speak(u)}}

function toggle(i){if(i!==idx){play(i);return}
if(mode==='ngaji'){if(!audio)return;if(isPlaying){audio.pause();isPlaying=false}else{audio.play();isPlaying=true}updateBtn(i)}
else{if(isPlaying){speechSynthesis.cancel();isPlaying=false;updateBtn(i)}else play(i)}}
function restart(i){stopAll();play(i)}
function next(){if(idx<list.length-1)document.querySelectorAll('.card')[idx+1].scrollIntoView({behavior:'smooth'});else closeFeed()}
function stopAll(){if(audio){audio.pause();audio=null}speechSynthesis.cancel();isPlaying=false;document.querySelectorAll('[id^=play-]').forEach(b=>b.textContent='▶');document.querySelectorAll('.highlight').forEach(el=>el.classList.remove('highlight'))}
function updateBtn(i){const b=document.getElementById(`play-${i}`);if(b)b.textContent=isPlaying?'⏸':'▶'}
function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}
function closeFeed(){stopAll();document.getElementById('feedWrap').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}

function openSettings(){document.getElementById('settings').classList.remove('hidden')}
function closeSettings(){document.getElementById('settings').classList.add('hidden')}
function setLang(l){lang=l;document.getElementById('lang-id').classList.toggle('mode-active',l==='id');document.getElementById('lang-en').classList.toggle('mode-active',l==='en');
if(list.length)list.forEach((_,i)=>{const[s,a]=list[i];loadText(i,s,a)})}
function setTheme(t){document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.classList.toggle('light',t==='light')}
function toggleAmbient(){const a=document.getElementById('ambient');if(a.paused){a.volume=.18;a.play().catch(()=>{});document.getElementById('ambBtn').classList.add('text-sky-400')}else{a.pause();document.getElementById('ambBtn').classList.remove('text-sky-400')}}

document.getElementById('search').oninput=e=>render(e.target.value);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFeed();closeSettings()}if(e.key===' '){e.preventDefault();toggle(idx)}});
stars();render();
</script>
</body>
</html>
