<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Al Quran Tematik</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:rgba(15,23,42,.75);--accent:#38bdf8}
.light{--bg:#f1f5f9;--card:rgba(255,255,255,.9);--accent:#0284c7}
body{font-family:Inter,system-ui;background:var(--bg);color:#e2e8f0;margin:0;overflow:hidden;height:100dvh}
.light body{color:#0f172a}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at bottom,#0f172a,#020617 80%)}
.light #sky{opacity:.12}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.glass{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,.15)}
.font-ar{font-family:Amiri,serif}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:1.25rem;position:relative}
.highlight{background:linear-gradient(90deg,rgba(56,189,248,.3),transparent);border-radius:8px}
.progress{height:3px;background:rgba(148,163,184,.25);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .08s linear}
.btn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;transition:transform .15s}
.btn:active{transform:scale(.9)}
</style>
</head>
<body>
<div id="sky"></div>

<!-- Home -->
<div id="home" class="relative z-10 h-full flex flex-col max-w-lg mx-auto">
  <header class="flex items-center justify-between px-4 pt-5 pb-3">
    <div>
      <h1 class="text-xl font-bold">Al Quran Tematik</h1>
      <p class="text-xs opacity-50">Shorts Mode • Cosmic</p>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleAmbient()" id="ambBtn" class="w-9 h-9 rounded-full glass text-sm">♪</button>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass text-sm">◐</button>
    </div>
  </header>
  <div class="px-4 mb-3">
    <input id="search" type="search" placeholder="Cari tema..." class="w-full glass rounded-2xl px-4 py-2.5 text-sm outline-none" autocomplete="off">
  </div>
  <div id="themes" class="flex-1 overflow-y-auto px-4 pb-8 space-y-2"></div>
</div>

<!-- Feed (Shorts) -->
<div id="feedWrap" class="fixed inset-0 z-30 hidden">
  <div id="feed" class="feed relative z-10"></div>
  <button onclick="closeFeed()" class="absolute top-4 left-4 z-50 w-10 h-10 rounded-full glass flex items-center justify-center text-lg">←</button>
</div>

<audio id="ambient" loop preload="none" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b5f1e4e0c.mp3?filename=soft-ambient-112191.mp3"></audio>

<script>
const SURAH=["","Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Lail","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const THEMES={"Alam Semesta":[[2,164],[3,190],[21,30],[21,33],[36,38],[36,40],[41,11],[51,47],[55,5],[55,7],[67,3],[88,17]],"Tauhid":[[2,163],[2,255],[3,2],[3,18],[4,48],[6,102],[16,36],[17,42],[21,22],[37,35],[39,3],[112,1]],"Iman kepada Allah":[[2,255],[3,2],[6,59],[6,103],[13,9],[20,8],[24,35],[59,22],[59,23],[59,24]],"Hari Akhir":[[3,185],[6,31],[22,7],[36,51],[39,68],[50,20],[69,13],[75,6],[78,17],[81,1],[82,1],[99,1]],"Akhlak Mulia":[[2,177],[3,134],[4,36],[16,90],[17,23],[25,63],[31,18],[49,11],[49,12],[68,4]],"Sabar":[[2,153],[2,155],[3,200],[16,126],[18,28],[31,17],[39,10],[42,43],[70,5],[103,3]],"Shalat":[[2,3],[2,43],[4,103],[11,114],[17,78],[20,14],[29,45],[70,34],[108,2]],"Zakat & Infak":[[2,43],[2,110],[2,261],[2,267],[9,60],[9,103],[57,18],[64,16]],"Kisah Nabi":[[2,124],[7,59],[7,65],[7,73],[7,85],[11,25],[19,16],[21,51],[21,83],[27,15],[37,102]],"Surga":[[2,25],[3,133],[9,72],[13,23],[18,31],[36,55],[47,15],[55,46],[56,12],[76,5]],"Neraka":[[2,24],[3,131],[4,56],[14,16],[18,29],[22,19],[39,16],[67,6],[74,26],[104,4]],"Ilmu":[[2,31],[2,269],[3,18],[16,78],[20,114],[35,28],[39,9],[58,11],[96,1],[96,5]]};

// Global ayah number (1-6236)
function globalAyah(s,a){let n=0;for(let i=1;i<s;i++)n+=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6][i-1];return n+a}

let list=[],idx=0,audio=null,isPlaying=false,observer;

function stars(){const s=document.getElementById('sky');for(let i=0;i<60;i++){const d=document.createElement('div');d.className='star';const sz=.7+Math.random()*1.6;d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s`;s.appendChild(d)}}

function render(q=''){const el=document.getElementById('themes');el.innerHTML='';const f=q.toLowerCase();
Object.entries(THEMES).forEach(([tema,ayahs])=>{
if(f&&!tema.toLowerCase().includes(f))return;
const b=document.createElement('button');
b.className='glass w-full rounded-2xl px-4 py-3.5 text-left flex justify-between items-center';
b.innerHTML=`<span class="font-medium text-sm">${tema}</span><span class="text-xs opacity-40">${ayahs.length}</span>`;
b.onclick=()=>openFeed(tema,ayahs);
el.appendChild(b)})}

async function openFeed(tema,ayahs){
list=ayahs;idx=0;
document.getElementById('home').classList.add('hidden');
document.getElementById('feedWrap').classList.remove('hidden');
const feed=document.getElementById('feed');feed.innerHTML='';
for(let i=0;i<list.length;i++){
const [s,a]=list[i];
const card=document.createElement('div');card.className='card';card.dataset.i=i;
card.innerHTML=`
<div class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full">
  <p class="text-xs uppercase tracking-widest opacity-50 mb-2 text-center">${tema}</p>
  <p class="text-sm font-semibold text-center mb-4 opacity-80">${SURAH[s]} • ${s}:${a}</p>
  <div class="ar font-ar text-2xl leading-loose text-right mb-4 min-h-[5rem]" id="ar-${i}">Memuat...</div>
  <div class="id text-sm leading-relaxed opacity-80 mb-6 min-h-[3rem]" id="id-${i}"></div>
  <div class="progress mb-2"><div class="progress-fill" id="pf-${i}"></div></div>
  <div class="flex justify-between text-xs opacity-40 mb-5"><span id="tc-${i}">0:00</span><span id="tt-${i}">0:00</span></div>
  <div class="flex justify-center gap-4">
    <button class="btn glass" onclick="restart(${i})">↺</button>
    <button class="btn bg-sky-500 text-white shadow-lg shadow-sky-500/30" id="play-${i}" onclick="toggle(${i})">▶</button>
    <button class="btn glass" onclick="next()">⏭</button>
  </div>
</div>`;
feed.appendChild(card);
loadText(i,s,a)}
setupObserver();
setTimeout(()=>play(0),400)}

async function loadText(i,s,a){
try{const[ar,id]=await Promise.all([
fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`).then(r=>r.json()),
fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/id.indonesian`).then(r=>r.json())]);
document.getElementById(`ar-${i}`).textContent=ar.data.text;
document.getElementById(`id-${i}`).textContent=id.data.text}catch{document.getElementById(`id-${i}`).textContent='Gagal memuat'}}

function setupObserver(){
if(observer)observer.disconnect();
observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.7){const i=+e.target.dataset.i;if(i!==idx){idx=i;play(i)}}})},{threshold:.7});
document.querySelectorAll('.card').forEach(c=>observer.observe(c))}

function play(i){
stop();idx=i;
const [s,a]=list[i];
const num=globalAyah(s,a);
audio=new Audio(`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${num}.mp3`);
audio.addEventListener('loadedmetadata',()=>{document.getElementById(`tt-${i}`).textContent=fmt(audio.duration)});
audio.addEventListener('timeupdate',()=>{
const pct=(audio.currentTime/audio.duration)*100;
document.getElementById(`pf-${i}`).style.width=pct+'%';
document.getElementById(`tc-${i}`).textContent=fmt(audio.currentTime);
const ar=document.getElementById(`ar-${i}`);
if(pct>5)ar.classList.add('highlight');else ar.classList.remove('highlight')});
audio.addEventListener('ended',()=>{isPlaying=false;updateBtn(i);setTimeout(next,600)});
audio.play().then(()=>{isPlaying=true;updateBtn(i)}).catch(()=>{})}

function toggle(i){if(!audio||i!==idx){play(i);return}if(isPlaying){audio.pause();isPlaying=false}else{audio.play();isPlaying=true}updateBtn(i)}
function restart(i){if(audio&&i===idx){audio.currentTime=0;audio.play();isPlaying=true;updateBtn(i)}else play(i)}
function next(){if(idx<list.length-1){document.querySelectorAll('.card')[idx+1].scrollIntoView({behavior:'smooth'})}else closeFeed()}
function stop(){if(audio){audio.pause();audio=null}isPlaying=false;document.querySelectorAll('[id^=play-]').forEach(b=>b.textContent='▶')}
function updateBtn(i){const b=document.getElementById(`play-${i}`);if(b)b.textContent=isPlaying?'⏸':'▶'}
function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}
function closeFeed(){stop();document.getElementById('feedWrap').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function toggleTheme(){document.documentElement.classList.toggle('dark');document.documentElement.classList.toggle('light')}
function toggleAmbient(){const a=document.getElementById('ambient');if(a.paused){a.volume=.2;a.play().catch(()=>{});document.getElementById('ambBtn').classList.add('text-sky-400')}else{a.pause();document.getElementById('ambBtn').classList.remove('text-sky-400')}}

document.getElementById('search').oninput=e=>render(e.target.value);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFeed();if(e.key===' '){e.preventDefault();toggle(idx)}});
stars();render();
</script>
</body>
</html>
