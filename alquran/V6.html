async function loadText(i,s,a){
  const arEl=document.getElementById(`ar-${i}`);
  const trEl=document.getElementById(`tr-${i}`);
  const stEl=document.getElementById(`st-${i}`);
  arEl.innerHTML='<div class="loader"></div>';
  trEl.innerHTML='<div class="loader"></div>';
  stEl.textContent='';

  const edition = lang==='id' ? 'id.indonesian' : 'en.sahih';
  let arText='', trText='';
  let tries=0;

  async function fetchOnce(){
    const [arRes, trRes] = await Promise.all([
      fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`),
      fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/${edition}`)
    ]);
    if(!arRes.ok || !trRes.ok) throw new Error('API '+arRes.status);
    const arJ = await arRes.json();
    const trJ = await trRes.json();
    if(!arJ.data?.text || !trJ.data?.text) throw new Error('Empty data');
    return {ar: arJ.data.text, tr: trJ.data.text};
  }

  while(tries<2){
    try{
      const data = await fetchOnce();
      arText=data.ar; trText=data.tr;
      break;
    }catch(e){
      tries++;
      if(tries>=2){
        arEl.textContent='';
        trEl.textContent='Gagal memuat. Periksa koneksi lalu buka ulang tema.';
        stEl.textContent='Error: API / jaringan';
        return;
      }
      await new Promise(r=>setTimeout(r,600));
    }
  }

  // Render Arabic as words for progressive highlight
  const words = arText.split(/\s+/).filter(Boolean);
  arEl.innerHTML = words.map((w,wi)=>`<span class="word" data-w="${wi}">${w}</span>`).join(' ');
  arEl.dataset.wordCount = words.length;

  trEl.textContent = trText;
  trEl.dataset.text = trText;
  stEl.textContent = '';
}

/* ========== SEEK ========== */
function bindSeek(i){
  const wrap=document.getElementById(`pw-${i}`);
  if(!wrap) return;

  const onStart = (e)=>{
    if(i!==idx || mode!=='ngaji' || !audio) return;
    seeking=true;
    seekTo(e,i);
  };
  const onMove = (e)=>{
    if(!seeking || i!==idx) return;
    seekTo(e,i);
  };
  const onEnd = ()=>{ seeking=false; };

  wrap.addEventListener('pointerdown', onStart);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onEnd);
  window.addEventListener('pointercancel', onEnd);
}

function seekTo(e,i){
  if(!audio || !audio.duration) return;
  const wrap=document.getElementById(`pw-${i}`);
  const rect=wrap.getBoundingClientRect();
  const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
  if(clientX==null) return;
  let pct = (clientX - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  audio.currentTime = pct * audio.duration;
  updateProgressUI(i, pct, audio.currentTime);
}

function updateProgressUI(i, pct, curTime){
  const fill=document.getElementById(`pf-${i}`);
  const thumb=document.getElementById(`pt-${i}`);
  const tc=document.getElementById(`tc-${i}`);
  if(fill) fill.style.width = (pct*100)+'%';
  if(thumb) thumb.style.left = (pct*100)+'%';
  if(tc) tc.textContent = fmt(curTime);
}

  const stEl=document.getElementById(`st-${i}`);

  // Wait until content ready
  if(!arEl || arEl.querySelector('.loader') || !trEl?.dataset?.text){
    stEl.textContent='Menunggu konten...';
    setTimeout(()=>play(i), 400);
    return;
  }

  if(mode==='ngaji'){
    stEl.textContent='Ngaji...';
    const num=globalAyah(s,a);
    const url=`https://cdn.islamic.network/quran/audio/128/${reciter}/${num}.mp3`;
    audio=new Audio(url);
    audio.preload='auto';

    audio.addEventListener('loadedmetadata',()=>{
      document.getElementById(`tt-${i}`).textContent=fmt(audio.duration);
    });

    audio.addEventListener('timeupdate',()=>{
      if(seeking || !audio.duration) return;
      const pct=audio.currentTime/audio.duration;
      updateProgressUI(i, pct, audio.currentTime);
      // Progressive word highlight (approximate sync)
      const wc=+arEl.dataset.wordCount || 1;
      const activeIdx=Math.min(wc-1, Math.floor(pct * wc));
      arEl.querySelectorAll('.word').forEach((w,wi)=>{
        w.classList.toggle('active', wi<=activeIdx);
      });
    });

    audio.addEventListener('ended',()=>{
      isPlaying=false;
      updateBtn(i);
      arEl.querySelectorAll('.word').forEach(w=>w.classList.remove('active'));
      // Default: after ngaji → play arti
      if(autoSequence){
        mode='arti';
        document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>b.classList.remove('mode-active'));
        document.querySelectorAll('[id^=m-arti-]').forEach(b=>b.classList.add('mode-active'));
        setTimeout(()=>play(i), 500);
      } else {
        setTimeout(next, 600);
      }
    });

    audio.addEventListener('error',()=>{
      stEl.textContent='Audio gagal (CDN). Coba qori lain.';
      isPlaying=false;
      updateBtn(i);
    });

    audio.play().then(()=>{
      isPlaying=true;
      updateBtn(i);
      stEl.textContent='';
    }).catch(err=>{
      stEl.textContent='Tap Play untuk memulai (browser policy)';
      isPlaying=false;
      updateBtn(i);
    });

  } else {
    // ARTI (TTS)
    stEl.textContent='Arti...';
    const text=trEl.dataset.text || trEl.textContent;
    if(!text || text.includes('Gagal') || text.includes('Memuat')){
      stEl.textContent='Arti belum siap';
      return;
    }
    const u=new SpeechSynthesisUtterance(text);
    u.lang = lang==='id' ? 'id-ID' : 'en-US';
    u.rate = 0.92;
    u.onstart=()=>{
      isPlaying=true;
      updateBtn(i);
      trEl.classList.add('highlight');
      stEl.textContent='';
      // Fake progress for TTS (no exact duration)
      let t=0;
      const est=Math.max(4, text.length/12);
      const iv=setInterval(()=>{
        if(!isPlaying){clearInterval(iv);return}
        t+=0.2;
        const pct=Math.min(0.98, t/est);
        updateProgressUI(i, pct, t);
        if(t>=est) clearInterval(iv);
      },200);
      u._iv=iv;
    };
    u.onend=()=>{
      isPlaying=false;
      updateBtn(i);
      trEl.classList.remove('highlight');
      if(u._iv) clearInterval(u._iv);
      updateProgressUI(i,1,0);
      // After arti → next ayah
      setTimeout(next, 700);
    };
    u.onerror=()=>{
      isPlaying=false;
      updateBtn(i);
      stEl.textContent='TTS gagal / tidak didukung browser';
    };
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
}

function toggle(i){
  if(i!==idx){ play(i); return; }
  if(mode==='ngaji'){
    if(!audio){ play(i); return; }
    if(isPlaying){ audio.pause(); isPlaying=false; }
    else { audio.play(); isPlaying=true; }
    updateBtn(i);
  } else {
    if(isPlaying){ speechSynthesis.cancel(); isPlaying=false; updateBtn(i); }
    else play(i);
  }
}

function restart(i){ stopAll(); mode='ngaji'; autoSequence=true;
  document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>b.classList.add('mode-active'));
  document.querySelectorAll('[id^=m-arti-]').forEach(b=>b.classList.remove('mode-active'));
  play(i);
}

function next(){
  if(idx < list.length-1){
    const nextCard=document.querySelectorAll('.card')[idx+1];
    if(nextCard) nextCard.scrollIntoView({behavior:'smooth'});
  } else {
    closeFeed();
  }
}

function stopAll(){
  if(audio){ audio.pause(); audio.src=''; audio=null; }
  speechSynthesis.cancel();
  isPlaying=false;
  document.querySelectorAll('[id^=play-]').forEach(b=>b.textContent='▶');
  document.querySelectorAll('.word.active').forEach(w=>w.classList.remove('active'));
  document.querySelectorAll('.highlight').forEach(el=>el.classList.remove('highlight'));
}

function updateBtn(i){
  const b=document.getElementById(`play-${i}`);
  if(b) b.textContent = isPlaying ? '⏸' : '▶';
}

/* ========== OBSERVER ========== */
function setupObserver(){
  if(observer) observer.disconnect();
  observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio > 0.65){
        const i = +e.target.dataset.i;
        if(i !== idx){
          idx=i;
          mode='ngaji';
          autoSequence=true;
          document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>b.classList.add('mode-active'));
          document.querySelectorAll('[id^=m-arti-]').forEach(b=>b.classList.remove('mode-active'));
          play(i);
        }
      }
    });
  },{threshold:0.65});
  document.querySelectorAll('.card').forEach(c=>observer.observe(c));
}

/* ========== SETTINGS / THEME ========== */
function openSettings(){ renderReciters(); document.getElementById('settings').classList.remove('hidden'); }
function closeSettings(){ document.getElementById('settings').classList.add('hidden'); }
function openQuickReciter(){ renderQuickReciters(); document.getElementById('quickReciter').classList.remove('hidden'); }
function closeQuickReciter(){ document.getElementById('quickReciter').classList.add('hidden'); }

function setReciter(id){
  reciter=id;
  renderReciters();
  document.querySelectorAll('.quick-reciter').forEach(el=>el.textContent=getReciterName()+' ▾');
}

function setLang(l){
  lang=l;
  document.getElementById('lang-id').classList.toggle('mode-active', l==='id');
  document.getElementById('lang-en').classList.toggle('mode-active', l==='en');
  if(list.length) list.forEach((_,i)=>{ const [s,a]=list[i]; loadText(i,s,a); });
}

function setTheme(t){
  document.documentElement.classList.toggle('dark', t==='dark');
  document.documentElement.classList.toggle('light', t==='light');
}

function toggleAmbient(){
  const a=document.getElementById('ambient');
  if(a.paused){ a.volume=0.15; a.play().catch(()=>{}); document.getElementById('ambBtn').classList.add('text-sky-400'); }
  else { a.pause(); document.getElementById('ambBtn').classList.remove('text-sky-400'); }
}

function closeFeed(){
  stopAll();
  document.getElementById('feedWrap').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

/* ========== INIT ========== */
document.getElementById('search').oninput = e => render(e.target.value);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeFeed(); closeSettings(); closeQuickReciter(); }
  if(e.key===' ' && list.length){ e.preventDefault(); toggle(idx); }
});
stars();
render();
</script>
