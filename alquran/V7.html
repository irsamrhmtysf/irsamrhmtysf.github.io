<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Al Qur'an Tematik</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:rgba(15,23,42,.88);--accent:#38bdf8;--yellow:#facc15;--safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom)}
.light{--bg:#f8fafc;--card:rgba(255,255,255,.96);--accent:#0284c7;--yellow:#ca8a04}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#e2e8f0}
.light body{color:#0f172a}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at bottom,#0f172a 0%,#020617 90%)}
.light #sky{opacity:.06}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.85}}
.glass{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,.12)}
.font-ar{font-family:Amiri,serif}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .5s ease}
.screen.active{opacity:1;pointer-events:auto}
.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{min-height:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:1rem 1.15rem;padding-top:calc(3.8rem + var(--safe-top));padding-bottom:calc(1.5rem + var(--safe-bot))}
.word{display:inline;transition:color .12s,background .12s;border-radius:3px;padding:0 1px}
.word.active{color:var(--yellow);background:rgba(250,204,21,.18)}
.progress-wrap{position:relative;height:32px;display:flex;align-items:center;cursor:pointer;touch-action:none;user-select:none}
.progress-track{height:4px;width:100%;background:rgba(148,163,184,.28);border-radius:99px;position:relative}
.progress-fill{height:100%;background:var(--accent);width:0%;border-radius:99px;pointer-events:none}
.progress-thumb{position:absolute;top:50%;width:16px;height:16px;background:#fff;border:2.5px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4);left:0%;pointer-events:none}
.btn-play{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--accent);color:#fff;box-shadow:0 8px 28px rgba(56,189,248,.35);transition:transform .15s}
.btn-play:active{transform:scale(.92)}
.btn-side{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.mode-chip{padding:.35rem .85rem;border-radius:999px;font-size:.7rem;font-weight:600;transition:all .2s}
.mode-on{background:var(--accent);color:#fff}
.mode-off{background:rgba(255,255,255,.06);opacity:.75}
.loader{width:24px;height:24px;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-glow{text-shadow:0 0 40px rgba(56,189,248,.55),0 0 80px rgba(56,189,248,.25)}
.fade-up{animation:fadeUp .7s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fade-out{animation:fadeOut .6s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.96)}}
.theme-item:active{transform:scale(.98)}
.op-text{transition:opacity .5s ease}
</style>
</head>
<body>
<div id="sky"></div>

<!-- SPLASH LOGO -->
<div id="splash" class="screen active items-center justify-center">
  <div id="splashInner" class="text-center fade-up">
    <div class="text-6xl mb-3 logo-glow">📖</div>
    <h1 class="text-2xl font-extrabold tracking-tight logo-glow">Al Qur'an</h1>
    <p class="text-sm opacity-45 mt-2">Tematik</p>
  </div>
</div>

<!-- OPENING (no controls) -->
<div id="opening" class="screen items-center justify-center px-6">
  <div class="w-full max-w-md text-center op-text" id="opBox">
    <p id="opLabel" class="text-xs uppercase tracking-[0.2em] opacity-50 mb-5"></p>
    <div id="opAr" class="font-ar text-[1.7rem] leading-relaxed mb-5"></div>
    <div id="opTr" class="text-sm leading-relaxed opacity-80"></div>
  </div>
</div>

<!-- MAIN -->
<div id="main" class="screen">
  <header class="relative z-20 flex items-center justify-between px-3 pt-[calc(0.75rem+var(--safe-top))] pb-2.5">
    <button onclick="openDrawer()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-lg shrink-0">☰</button>
    <h1 class="text-base font-extrabold tracking-tight absolute left-1/2 -translate-x-1/2">Al Qur'an</h1>
    <div class="flex gap-1.5 shrink-0">
      <button onclick="toggleLang()" id="btnLang" class="w-9 h-9 rounded-full glass flex items-center justify-center text-[11px] font-bold">ID</button>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass flex items-center justify-center text-sm">◐</button>
    </div>
  </header>
  <div id="feed" class="feed relative z-10"></div>
</div>

<!-- DRAWER MENU -->
<div id="drawer" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/55 backdrop-blur-sm" onclick="closeDrawer()"></div>
  <div class="absolute top-0 left-0 bottom-0 w-[82%] max-w-xs glass overflow-y-auto" style="padding:calc(1.1rem + var(--safe-top)) 1.1rem calc(1.5rem + var(--safe-bot))">
    <p class="text-xs uppercase tracking-widest opacity-45 mb-3">Tema Qur'an</p>
    <div id="drawerList" class="space-y-1"></div>
  </div>
</div>

<!-- QUICK RECITER -->
<div id="quickReciter" class="fixed inset-0 z-[60] hidden flex items-end justify-center">
  <div class="absolute inset-0 bg-black/50" onclick="closeQuickReciter()"></div>
  <div class="relative glass w-full max-w-md rounded-t-3xl p-5 pb-[calc(1.5rem+var(--safe-bot))]">
    <div class="w-10 h-1 bg-slate-500/40 rounded-full mx-auto mb-4"></div>
    <p class="text-sm font-semibold mb-3 text-center">Pilih Qari</p>
    <div id="quickReciterList" class="space-y-1.5"></div>
  </div>
</div>

<audio id="mainAudio" preload="auto"></audio>

<script>
const SURAH=["","Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Lail","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const THEMES={"Alam Semesta":[[2,164],[3,190],[21,30],[21,33],[36,38],[36,40],[41,11],[51,47],[55,5],[55,7],[67,3],[88,17]],"Tauhid":[[2,163],[2,255],[3,2],[3,18],[4,48],[6,102],[16,36],[17,42],[21,22],[37,35],[39,3],[112,1]],"Iman kepada Allah":[[2,255],[3,2],[6,59],[6,103],[13,9],[20,8],[24,35],[59,22],[59,23],[59,24]],"Hari Akhir":[[3,185],[6,31],[22,7],[36,51],[39,68],[50,20],[69,13],[75,6],[78,17],[81,1],[82,1],[99,1]],"Akhlak Mulia":[[2,177],[3,134],[4,36],[16,90],[17,23],[25,63],[31,18],[49,11],[49,12],[68,4]],"Sabar":[[2,153],[2,155],[3,200],[16,126],[18,28],[31,17],[39,10],[42,43],[70,5],[103,3]],"Shalat":[[2,3],[2,43],[4,103],[11,114],[17,78],[20,14],[29,45],[70,34],[108,2]],"Zakat & Infak":[[2,43],[2,110],[2,261],[2,267],[9,60],[9,103],[57,18],[64,16]],"Kisah Nabi":[[2,124],[7,59],[7,65],[7,73],[7,85],[11,25],[19,16],[21,51],[21,83],[27,15],[37,102]],"Surga":[[2,25],[3,133],[9,72],[13,23],[18,31],[36,55],[47,15],[55,46],[56,12],[76,5]],"Neraka":[[2,24],[3,131],[4,56],[14,16],[18,29],[22,19],[39,16],[67,6],[74,26],[104,4]],"Ilmu":[[2,31],[2,269],[3,18],[16,78],[20,114],[35,28],[39,9],[58,11],[96,1],[96,5]]};
const RECITERS=[{id:'ar.alafasy',name:'Mishary Alafasy'},{id:'ar.husary',name:'Mahmoud Al-Husary'},{id:'ar.shaatree',name:'Abu Bakr Ash-Shaatree'}];
const AYAH_LEN=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
function globalAyah(s,a){let n=0;for(let i=1;i<s;i++)n+=AYAH_LEN[i-1];return n+a}
function fmt(s){if(!isFinite(s)||s<0)return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}

const OPENING=[
  {label:"Ta'awudz", ar:"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", id:"Aku berlindung kepada Allah dari setan yang terkutuk.", en:"I seek refuge in Allah from the accursed Satan.", audio:null},
  {label:"Basmalah", ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", id:"Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.", en:"In the name of Allah, the Most Gracious, the Most Merciful.", audio:"https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3"}
];

let list=[], idx=0, mode='ngaji', lang='id', reciter='ar.alafasy';
let isPlaying=false, seeking=false, observer=null, opStep=0;
const audioEl=document.getElementById('mainAudio');
const themeKeys=Object.keys(THEMES);

(function(){const s=document.getElementById('sky');for(let i=0;i<40;i++){const d=document.createElement('div');d.className='star';const sz=.5+Math.random()*1.2;d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s`;s.appendChild(d)}})();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ========== OPENING (auto, no controls) ========== */
function runOpening(){
  opStep=0;
  showScreen('opening');
  playOpeningStep();
}

function playOpeningStep(){
  const o=OPENING[opStep];
  const box=document.getElementById('opBox');
  box.style.opacity='0';
  setTimeout(()=>{
    document.getElementById('opLabel').textContent=o.label;
    document.getElementById('opAr').textContent=o.ar;
    document.getElementById('opTr').textContent=lang==='id'?o.id:o.en;
    box.style.opacity='1';
    speakOpening(o);
  },400);
}

function speakOpening(o){
  stopAll();
  if(o.audio){
    // Real audio (Basmalah) then TTS meaning
    audioEl.src=o.audio;
    audioEl.onended=()=>{
      // After Arabic audio, speak meaning
      const u=new SpeechSynthesisUtterance(lang==='id'?o.id:o.en);
      u.lang=lang==='id'?'id-ID':'en-US';u.rate=.92;
      u.onend=()=>finishOpeningStep();
      speechSynthesis.speak(u);
    };
    audioEl.onerror=()=>finishOpeningStep();
    audioEl.play().catch(()=>finishOpeningStep());
  } else {
    // Ta'awudz: Arabic TTS then meaning TTS
    const u1=new SpeechSynthesisUtterance(o.ar);
    u1.lang='ar-SA';u1.rate=.85;
    u1.onend=()=>{
      const u2=new SpeechSynthesisUtterance(lang==='id'?o.id:o.en);
      u2.lang=lang==='id'?'id-ID':'en-US';u2.rate=.92;
      u2.onend=()=>finishOpeningStep();
      speechSynthesis.speak(u2);
    };
    u1.onerror=()=>finishOpeningStep();
    speechSynthesis.speak(u1);
  }
}

function finishOpeningStep(){
  document.getElementById('opBox').style.opacity='0';
  setTimeout(()=>{
    if(opStep < OPENING.length-1){
      opStep++;
      playOpeningStep();
    } else {
      // Opening done → main with random theme
      startMainRandom();
    }
  },500);
}

/* ========== MAIN + RANDOM THEME ========== */
function startMainRandom(){
  showScreen('main');
  renderDrawer();
  const randomTema = themeKeys[Math.floor(Math.random()*themeKeys.length)];
  openFeed(randomTema, THEMES[randomTema]);
}

function renderDrawer(){
  const el=document.getElementById('drawerList');el.innerHTML='';
  themeKeys.forEach(tema=>{
    const b=document.createElement('button');
    b.className='theme-item w-full text-left px-3 py-3 rounded-xl text-sm font-medium hover:bg-white/5 transition';
    b.textContent=tema;
    b.onclick=()=>{closeDrawer();openFeed(tema,THEMES[tema])};
    el.appendChild(b);
  });
}
function openDrawer(){document.getElementById('drawer').classList.remove('hidden')}
function closeDrawer(){document.getElementById('drawer').classList.add('hidden')}

/* ========== FEED ========== */
async function openFeed(tema,ayahs){
  list=ayahs;idx=0;mode='ngaji';stopAll();
  const feed=document.getElementById('feed');feed.innerHTML='';
  // Title bar already has "Al Qur'an", theme is shown inside cards

  list.forEach(([s,a],i)=>{
    const card=document.createElement('div');
    card.className='card';card.dataset.i=i;
    card.innerHTML=`
<div class="flex-1 flex flex-col justify-center max-w-lg mx-auto w-full">
  <p class="text-[11px] font-semibold text-center opacity-50 mb-1 uppercase tracking-wide">${tema}</p>
  <p class="text-xs opacity-45 text-center mb-3">${SURAH[s]} • ${s}:${a}</p>
  <div class="font-ar text-[1.4rem] sm:text-[1.55rem] leading-[2.15] text-right mb-3 min-h-[4.5rem]" id="ar-${i}"><div class="loader"></div></div>
  <div class="text-sm leading-relaxed opacity-85 mb-4 min-h-[3rem]" id="tr-${i}"><div class="loader"></div></div>
  <p class="text-[10px] opacity-40 text-center mb-1" id="st-${i}"></p>
  <div class="progress-wrap" id="pw-${i}" data-i="${i}">
    <div class="progress-track"><div class="progress-fill" id="pf-${i}"></div><div class="progress-thumb" id="pt-${i}"></div></div>
  </div>
  <div class="flex justify-between text-[11px] opacity-40 mb-3 px-0.5"><span id="tc-${i}">0:00</span><span id="tt-${i}">—</span></div>
  <div class="flex justify-center gap-2 mb-5">
    <button class="mode-chip mode-on" id="m-ngaji-${i}" onclick="setMode('ngaji',${i})">Ngaji</button>
    <button class="mode-chip mode-off" id="m-arti-${i}" onclick="setMode('arti',${i})">Arti</button>
  </div>
  <div class="flex items-center justify-center gap-5">
    <button class="btn-side" onclick="restart(${i})">↺</button>
    <button class="btn-play" id="play-${i}" onclick="toggle(${i})">▶</button>
    <button class="btn-side" onclick="next()">⏭</button>
  </div>
  <div class="flex justify-center mt-4">
    <button onclick="openQuickReciter()" class="text-[11px] opacity-50 px-3 py-1 rounded-full glass">🎤 Qari</button>
  </div>
</div>`;
    feed.appendChild(card);
    loadText(i,s,a);
    bindSeek(i);
  });
  setupObserver();
  setTimeout(()=>play(0),450);
}

async function loadText(i,s,a){
  const arEl=document.getElementById(`ar-${i}`),trEl=document.getElementById(`tr-${i}`),stEl=document.getElementById(`st-${i}`);
  arEl.innerHTML='<div class="loader"></div>';trEl.innerHTML='<div class="loader"></div>';
  const edition=lang==='id'?'id.indonesian':'en.sahih';
  let tries=0;
  while(tries<2){
    try{
      const [arR,trR]=await Promise.all([
        fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`),
        fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/${edition}`)
      ]);
      if(!arR.ok||!trR.ok) throw 0;
      const arJ=await arR.json(),trJ=await trR.json();
      if(!arJ.data?.text||!trJ.data?.text) throw 0;
      const words=arJ.data.text.split(/\s+/).filter(Boolean);
      arEl.innerHTML=words.map((w,wi)=>`<span class="word" data-w="${wi}">${w}</span>`).join(' ');
      arEl.dataset.wc=words.length;
      trEl.textContent=trJ.data.text;trEl.dataset.text=trJ.data.text;stEl.textContent='';
      return;
    }catch(e){tries++;if(tries>=2){arEl.textContent='';trEl.textContent='Gagal memuat.';stEl.textContent='Error';return}
    await new Promise(r=>setTimeout(r,500))}
  }
}

function bindSeek(i){
  const wrap=document.getElementById(`pw-${i}`);if(!wrap)return;
  const start=e=>{if(i!==idx||mode!=='ngaji'||!audioEl.duration)return;seeking=true;doSeek(e,i)};
  const move=e=>{if(!seeking||i!==idx)return;doSeek(e,i)};
  const end=()=>seeking=false;
  wrap.addEventListener('pointerdown',start);
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
}
function doSeek(e,i){
  if(!audioEl.duration)return;
  const rect=document.getElementById(`pw-${i}`).getBoundingClientRect();
  const x=e.clientX??e.touches?.[0]?.clientX;if(x==null)return;
  let p=Math.max(0,Math.min(1,(x-rect.left)/rect.width));
  audioEl.currentTime=p*audioEl.duration;updateProgress(i,p,audioEl.currentTime);
}
function updateProgress(i,p,t){
  const f=document.getElementById(`pf-${i}`),th=document.getElementById(`pt-${i}`),tc=document.getElementById(`tc-${i}`);
  if(f)f.style.width=(p*100)+'%';if(th)th.style.left=(p*100)+'%';if(tc)tc.textContent=fmt(t);
}

function setMode(m,i){
  mode=m;
  document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>{b.classList.toggle('mode-on',m==='ngaji');b.classList.toggle('mode-off',m!=='ngaji')});
  document.querySelectorAll('[id^=m-arti-]').forEach(b=>{b.classList.toggle('mode-on',m==='arti');b.classList.toggle('mode-off',m!=='arti')});
  if(i===idx)play(i);
}

function play(i){
  stopAll();idx=i;
  const [s,a]=list[i];
  const arEl=document.getElementById(`ar-${i}`),trEl=document.getElementById(`tr-${i}`),stEl=document.getElementById(`st-${i}`);
  if(!arEl||arEl.querySelector('.loader')||!trEl?.dataset?.text){
    stEl.textContent='Menunggu...';setTimeout(()=>play(i),350);return;
  }
  if(mode==='ngaji'){
    stEl.textContent='';
    audioEl.src=`https://cdn.islamic.network/quran/audio/128/${reciter}/${globalAyah(s,a)}.mp3`;
    audioEl.onloadedmetadata=()=>document.getElementById(`tt-${i}`).textContent=fmt(audioEl.duration);
    audioEl.ontimeupdate=()=>{
      if(seeking||!audioEl.duration)return;
      const p=audioEl.currentTime/audioEl.duration;updateProgress(i,p,audioEl.currentTime);
      const wc=+arEl.dataset.wc||1;const ai=Math.min(wc-1,Math.floor(p*wc));
      arEl.querySelectorAll('.word').forEach((w,wi)=>w.classList.toggle('active',wi<=ai));
    };
    audioEl.onended=()=>{
      isPlaying=false;updateBtn(i);
      arEl.querySelectorAll('.word').forEach(w=>w.classList.remove('active'));
      mode='arti';
      document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>{b.classList.remove('mode-on');b.classList.add('mode-off')});
      document.querySelectorAll('[id^=m-arti-]').forEach(b=>{b.classList.add('mode-on');b.classList.remove('mode-off')});
      setTimeout(()=>play(i),400);
    };
    audioEl.onerror=()=>{stEl.textContent='Audio gagal';isPlaying=false;updateBtn(i)};
    audioEl.play().then(()=>{isPlaying=true;updateBtn(i);setupMediaSession(`${SURAH[s]} ${s}:${a}`,trEl.dataset.text||'')}).catch(()=>{stEl.textContent='Tap ▶';isPlaying=false;updateBtn(i)});
  } else {
    const text=trEl.dataset.text;if(!text)return;
    stEl.textContent='Arti';
    const u=new SpeechSynthesisUtterance(text);u.lang=lang==='id'?'id-ID':'en-US';u.rate=.92;
    let t0=0,est=Math.max(5,text.length/11),iv=null;
    u.onstart=()=>{isPlaying=true;updateBtn(i);trEl.style.color='var(--yellow)';iv=setInterval(()=>{if(!isPlaying){clearInterval(iv);return}t0+=.25;updateProgress(i,Math.min(.98,t0/est),t0)},250)};
    u.onend=()=>{isPlaying=false;updateBtn(i);trEl.style.color='';if(iv)clearInterval(iv);updateProgress(i,1,0);setTimeout(next,600)};
    speechSynthesis.speak(u);
  }
}
function toggle(i){if(i!==idx){play(i);return}if(mode==='ngaji'){if(!audioEl.src){play(i);return}if(isPlaying){audioEl.pause();isPlaying=false}else{audioEl.play();isPlaying=true}updateBtn(i)}else{if(isPlaying){speechSynthesis.cancel();isPlaying=false;updateBtn(i)}else play(i)}}
function restart(i){stopAll();mode='ngaji';document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>{b.classList.add('mode-on');b.classList.remove('mode-off')});document.querySelectorAll('[id^=m-arti-]').forEach(b=>{b.classList.remove('mode-on');b.classList.add('mode-off')});play(i)}
function next(){if(idx<list.length-1)document.querySelectorAll('.card')[idx+1]?.scrollIntoView({behavior:'smooth'})}
function stopAll(){audioEl.pause();audioEl.removeAttribute('src');audioEl.load();speechSynthesis.cancel();isPlaying=false;document.querySelectorAll('[id^=play-]').forEach(b=>b.textContent='▶');document.querySelectorAll('.word.active').forEach(w=>w.classList.remove('active'))}
function updateBtn(i){const b=document.getElementById(`play-${i}`);if(b)b.textContent=isPlaying?'⏸':'▶'}

function setupObserver(){
  if(observer)observer.disconnect();
  observer=new IntersectionObserver(ents=>{
    ents.forEach(e=>{
      if(e.isIntersecting&&e.intersectionRatio>.6){
        const i=+e.target.dataset.i;
        if(i!==idx){idx=i;mode='ngaji';
          document.querySelectorAll('[id^=m-ngaji-]').forEach(b=>{b.classList.add('mode-on');b.classList.remove('mode-off')});
          document.querySelectorAll('[id^=m-arti-]').forEach(b=>{b.classList.remove('mode-on');b.classList.add('mode-off')});
          play(i);
        }
      }
    });
  },{threshold:.6});
  document.querySelectorAll('.card').forEach(c=>observer.observe(c));
}

function setupMediaSession(title,artist){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:title||"Al Qur'an",artist:(artist||'').slice(0,80),album:"Al Qur'an Tematik"});
  navigator.mediaSession.setActionHandler('play',()=>{if(list.length)toggle(idx)});
  navigator.mediaSession.setActionHandler('pause',()=>{if(list.length)toggle(idx)});
  navigator.mediaSession.setActionHandler('nexttrack',()=>next());
  navigator.mediaSession.setActionHandler('previoustrack',()=>restart(idx));
}

function toggleLang(){
  lang=lang==='id'?'en':'id';
  document.getElementById('btnLang').textContent=lang==='id'?'ID':'EN';
  if(list.length)list.forEach((_,i)=>{const[s,a]=list[i];loadText(i,s,a)});
}
function toggleTheme(){
  const isDark=document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark',!isDark);
  document.documentElement.classList.toggle('light',isDark);
}
function openQuickReciter(){
  const el=document.getElementById('quickReciterList');el.innerHTML='';
  RECITERS.forEach(r=>{
    const b=document.createElement('button');
    b.className=`w-full text-left px-4 py-3 rounded-xl text-sm glass ${reciter===r.id?'mode-on':''}`;
    b.textContent=r.name;
    b.onclick=()=>{reciter=r.id;closeQuickReciter();if(list.length)play(idx)};
    el.appendChild(b);
  });
  document.getElementById('quickReciter').classList.remove('hidden');
}
function closeQuickReciter(){document.getElementById('quickReciter').classList.add('hidden')}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();closeQuickReciter()}
  if(e.key===' '&&list.length){e.preventDefault();toggle(idx)}
});

/* BOOT: Logo → fade → Opening auto → Main random */
setTimeout(()=>{
  document.getElementById('splashInner').classList.add('fade-out');
  setTimeout(()=>{
    document.getElementById('splash').classList.remove('active');
    runOpening();
  },650);
},1600);
</script>
</body>
