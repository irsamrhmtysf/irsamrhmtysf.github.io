<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecitID Clone - Pengenal Bacaan Al-Qur'an</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #14b8a6;
            --primary-hover: #0d9488;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #2dd4bf;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin: 0 0 8px 0;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }
        
        /* Bagian Utama / Tombol Deteksi Ala Shazam */
        .detect-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 0;
            background: rgba(20, 184, 166, 0.05);
            border: 2px dashed rgba(20, 184, 166, 0.3);
            border-radius: 20px;
        }
        .listen-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .listen-btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }
        .listen-btn.listening {
            animation: pulse 1.5s infinite;
            background-color: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status-text {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Kotak Hasil Identifikasi */
        .result-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            display: none;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        .surah-info {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .arabic-text {
            font-family: 'Amiri', 'Traditional Arabic', serif;
            font-size: 1.8rem;
            text-align: right;
            direction: rtl;
            margin-bottom: 15px;
            line-height: 2.2;
            color: #ffffff;
        }
        .translation-text {
            font-size: 0.95rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        /* Simulasi Database Cepat untuk Demo */
        .manual-search {
            margin-top: 20px;
        }
        .manual-search input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }
        .manual-search input:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>RecitID Web</h1>
        <p>Kenali bacaan ayat yang kamu dengar seketika</p>
    </header>

    <!-- Tombol Deteksi Suara Ala Shazam -->
    <div class="detect-section">
        <button id="listenBtn" class="listen-btn" onclick="toggleListen()">TAP</button>
        <div id="statusText" class="status-text">Ketuk untuk mendengarkan bacaan</div>
    </div>

    <!-- Hasil Deteksi / Pencarian -->
    <div id="resultCard" class="result-card">
        <div class="surah-info">
            <span id="surahTitle">Al-Fatihah : Ayat 1</span>
            <span id="reciterName" style="color: var(--text-muted);">Qari: Misyari Rasyid</span>
        </div>
        <div id="arabicText" class="arabic-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div id="translationText" class="translation-text">
            "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang."
        </div>
    </div>

    <!-- Pencarian Cepat Teks -->
    <div class="manual-search">
        <input type="text" id="searchInput" placeholder="Atau cari surat/ayat (cth: Al-Fatihah, Kursi)..." oninput="searchVerse(this.value)">
    </div>
</div>

<script>
    // Data tiruan database ayat untuk simulasi instan
    const sampleDatabase = [
        {
            keyword: "fatihah",
            title: "Surah Al-Fatihah : Ayat 1",
            arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
            translation: "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.",
            reciter: "Misyari Rasyid"
        },
        {
            keyword: "kursi",
            title: "Surah Al-Baqarah : Ayat 255 (Ayat Kursi)",
            arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",
            translation: "Allah, tidak ada tuhan selain Dia, Yang Maha Hidup, Yang terus menerus mengurus makhluk-Nya...",
            reciter: "Abdurrahman as-Sudais"
        },
        {
            keyword: "ikhlas",
            title: "Surah Al-Ikhlas : Ayat 1",
            arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ",
            translation: "Katakanlah (Muhammad), 'Huwallahu ahad' (Allah itu Esa).",
            reciter: "Saad al-Ghamdi"
        }
    ];

    let isListening = false;

    function toggleListen() {
        const btn = document.getElementById('listenBtn');
        const status = document.getElementById('statusText');
        const card = document.getElementById('resultCard');

        if (!isListening) {
            isListening = true;
            btn.classList.add('listening');
            btn.innerText = "MENDENGAR...";
            status.innerText = "Mendengarkan bacaan di sekitar...";
            card.style.display = 'none';

            // Simulasi proses pencocokan AI dalam 3 detik
            setTimeout(() => {
                isListening = false;
                btn.classList.remove('listening');
                btn.innerText = "TAP";
                status.innerText = "Ketuk untuk mendengarkan bacaan";
                
                // Tampilkan hasil acak/contoh (misal: Ayat Kursi)
                showResult(sampleDatabase[1]);
            }, 3000);
        }
    }

    function showResult(data) {
        document.getElementById('surahTitle').innerText = data.title;
        document.getElementById('reciterName').innerText = "Qari: " + data.reciter;
        document.getElementById('arabicText').innerText = data.arabic;
        document.getElementById('translationText').innerText = `"${data.translation}"`;
        document.getElementById('resultCard').style.display = 'block';
    }

    function searchVerse(query) {
        let q = query.toLowerCase().trim();
        if (q === "") {
            document.getElementById('resultCard').style.display = 'none';
            return;
        }

        let found = sampleDatabase.find(item => item.keyword.includes(q) || item.title.toLowerCase().includes(q));
        if (found) {
            showResult(found);
        }
    }
</script>

</body>
</html>
