<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecitID - Shazam for the Qur'an</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --surface: #111827;
            --surface-card: #1f2937;
            --primary: #14b8a6;
            --primary-glow: rgba(20, 184, 166, 0.3);
            --accent: #2dd4bf;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .app-shell {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        /* Header */
        .app-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--surface-card);
            color: var(--primary);
        }

        /* Content Views */
        .view-section {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
            display: none;
        }
        .view-section.active {
            display: block;
        }

        /* Shazam Core View */
        .shazam-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px 0;
        }
        .shazam-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(20,184,166,0.1), rgba(45,212,191,0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            margin-bottom: 24px;
            border: 2px solid rgba(20, 184, 166, 0.4);
            box-shadow: 0 0 30px var(--primary-glow);
            transition: transform 0.2s;
        }
        .shazam-ring:hover { transform: scale(1.03); }
        .shazam-btn {
            width: 90px;
            height: 90px;
            background: var(--primary);
            border-radius: 50%;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(20, 184, 166, 0.5);
            transition: background 0.3s;
        }
        .shazam-ring.listening .shazam-btn {
            background: #ef4444;
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Result Card */
        .result-box {
            background: var(--surface-card);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            border: 1px solid var(--border);
            display: none;
            margin-top: 10px;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .arabic-display {
            font-family: 'Amiri', serif;
            font-size: 1.75rem;
            text-align: right;
            direction: rtl;
            line-height: 2.2;
            margin-bottom: 14px;
            color: #ffffff;
        }
        .translation-display {
            font-size: 0.9rem;
            color: #d1d5db;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
            line-height: 1.5;
        }

        /* Scanner & Manual View */
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 16px;
        }
        .search-input:focus { border-color: var(--primary); }
        
        .history-item {
            background: var(--surface-card);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .history-item:hover { border-color: var(--primary); }
        .history-title { font-size: 0.9rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
        .history-snippet { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: right; font-family: 'Amiri', serif; }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- Header -->
    <div class="app-header">
        <div class="logo">RecitID AI</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('detect', this)">Deteksi</button>
            <button class="tab-btn" onclick="switchTab('search', this)">Cari/Riwayat</button>
        </div>
    </div>

    <!-- Tab 1: Deteksi Audio (Shazam for Quran) -->
    <div id="detectView" class="view-section active">
        <div class="shazam-container">
            <div id="shazamRing" class="shazam-ring" onclick="toggleListen()">
                <button class="shazam-btn" id="shazamBtn">TAP</button>
            </div>
            <div id="statusLabel" class="status-label">Ketuk lingkaran untuk mendengarkan bacaan</div>

            <!-- Hasil Identifikasi -->
            <div id="resultBox" class="result-box">
                <div class="meta-info">
                    <span id="resMeta">Surah Al-Baqarah : Ayat 255</span>
                    <span id="resReciter">Qari: Al-Sudais</span>
                </div>
                <div id="resArabic" class="arabic-display">اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ</div>
                <div id="resTranslation" class="translation-display">
                    "Allah, tidak ada tuhan selain Dia, Yang Maha Hidup, Yang terus-menerus mengurus makhluk-Nya..."
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 2: Pencarian & Pustaka Ayat -->
    <div id="searchView" class="view-section">
        <input type="text" class="search-input" placeholder="Cari surah, ayat, atau kata kunci..." oninput="filterDatabase(this.value)">
        <div id="historyList">
            <!-- Dynamic Content -->
        </div>
    </div>
</div>

<script>
    const database = [
        {
            title: "Surah Al-Fatihah : Ayat 1",
            arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
            translation: "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.",
            reciter: "Misyari Rasyid Al-Afasy",
            keyword: "fatihah basmalah"
        },
        {
            title: "Surah Al-Baqarah : Ayat 255 (Ayat Kursi)",
            arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ",
            translation: "Allah, tidak ada tuhan selain Dia, Yang Maha Hidup, Yang terus menerus mengurus makhluk-Nya, tidak mengantuk dan tidak tidur...",
            reciter: "Abdurrahman as-Sudais",
            keyword: "kursi baqarah 255"
        },
        {
            title: "Surah Al-Ikhlas : Ayat 1-4",
            arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ",
            translation: "Katakanlah (Muhammad), 'Dialah Allah, Yang Maha Esa. Allah tempat bergantung segala sesuatu.'",
            reciter: "Saad al-Ghamdi",
            keyword: "ikhlas ahad"
        }
    ];

    function switchTab(tabName, el) {
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        if(tabName === 'detect') {
            document.getElementById('detectView').classList.add('active');
        } else {
            document.getElementById('searchView').classList.add('active');
            renderHistory(database);
        }
        el.classList.add('active');
    }

    let listening = false;
    function toggleListen() {
        const ring = document.getElementById('shazamRing');
        const btn = document.getElementById('shazamBtn');
        const label = document.getElementById('statusLabel');
        const box = document.getElementById('resultBox');

        if (!listening) {
            listening = true;
            ring.classList.add('listening');
            btn.innerText = "MENDENGAR...";
            label.innerText = "Menganalisis audio bacaan di sekitar...";
            box.style.display = 'none';

            // Simulasi AI mencocokan sidik jari audio (fingerprinting)
            setTimeout(() => {
                listening = false;
                ring.classList.remove('listening');
                btn.innerText = "TAP";
                label.innerText = "Bacaan berhasil diidentifikasi!";
                
                // Ambil sampel acak yang akurat
                showResult(database[1]);
            }, 3000);
        }
    }

    function showResult(item) {
        document.getElementById('resMeta').innerText = item.title + " • " + item.reciter;
        document.getElementById('resArabic').innerText = item.arabic;
        document.getElementById('resTranslation').innerText = `"${item.translation}"`;
        document.getElementById('resultBox').style.display = 'block';
    }

    function renderHistory(data) {
        const container = document.getElementById('historyList');
        container.innerHTML = '';
        data.forEach(item => {
            container.innerHTML += `
                <div class="history-item" onclick="selectHistory('${item.title}')">
                    <div class="history-title">${item.title}</div>
                    <div class="history-snippet">${item.arabic}</div>
                </div>
            `;
        });
    }

    function filterDatabase(query) {
        let q = query.toLowerCase();
        let filtered = database.filter(item => item.title.toLowerCase().includes(q) || item.keyword.includes(q) || item.arabic.includes(q));
        renderHistory(filtered);
    }

    function selectHistory(title) {
        let found = database.find(i => i.title === title);
        if(found) {
            switchTab('detect', document.querySelectorAll('.tab-btn')[0]);
            showResult(found);
            document.getElementById('statusLabel').innerText = "Riwayat muat ulang berhasil dipanggil.";
        }
    }

    // Inisialisasi awal list pencarian
    renderHistory(database);
</script>

</body>
</html>
