<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sholat Surah Meaning Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 sm:p-8">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-emerald-800">Sholat Surah & Meaning Guide</h1>
            <p class="text-xs text-slate-500 mt-1">Instant lookup for common prayer recitations. No waiting, no backend server.</p>
        </div>

        <!-- Quick Selector for Common Sholat Surahs -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Select Surah Read in Sholat:</label>
            <select id="surahSelect" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                <option value="">-- Choose Surah --</option>
                <option value="1">Al-Fatihah (The Opening)</option>
                <option value="112">Al-Ikhlas (The Sincerity)</option>
                <option value="113">Al-Falaq (The Daybreak)</option>
                <option value="114">An-Nas (Mankind)</option>
                <option value="109">Al-Kafirun (The Disbelievers)</option>
                <option value="110">An-Nasr (The Divine Support)</option>
            </select>
        </div>

        <!-- Upload Audio Option (If they have a recorded MP3 file) -->
        <div class="mb-6 p-4 bg-slate-50 rounded-xl border border-dashed border-slate-300 text-center">
            <span class="block text-xs font-semibold text-slate-600 mb-2">Or Upload Sholat MP3 Recording</span>
            <input type="file" id="audioUpload" accept="audio/*" class="text-xs w-full file:mr-2 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
            <p id="uploadStatus" class="text-[11px] text-slate-400 mt-2">Upload a file to match with Quran database instantly.</p>
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="hidden space-y-4 pt-4 border-t border-slate-100">
            <div class="bg-emerald-50/60 border border-emerald-100 p-4 rounded-xl space-y-3">
                <div class="flex justify-between items-center">
                    <span id="resSurahName" class="text-sm font-bold text-emerald-900">-</span>
                    <span id="resAyahNum" class="text-xs bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full font-medium">-</span>
                </div>
                <div>
                    <p id="resArabic" class="text-2xl text-right font-serif text-slate-900 leading-loose">-</p>
                </div>
                <div>
                    <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-wider block mb-1">Indonesian Meaning (Arti):</span>
                    <p id="resTranslation" class="text-xs text-slate-700 italic leading-relaxed">-</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const surahSelect = document.getElementById('surahSelect');
        const resultBox = document.getElementById('resultBox');
        const resSurahName = document.getElementById('resSurahName');
        const resAyahNum = document.getElementById('resAyahNum');
        const resArabic = document.getElementById('resArabic');
        const resTranslation = document.getElementById('resTranslation');
        const audioUpload = document.getElementById('audioUpload');
        const uploadStatus = document.getElementById('uploadStatus');

        // Fetch Surah data instantly from free public API when selected from dropdown
        surahSelect.addEventListener('change', async (e) => {
            const surahNumber = e.target.value;
            if (!surahNumber) {
                resultBox.classList.add('hidden');
                return;
            }

            resultBox.classList.remove('hidden');
            resSurahName.textContent = "Loading...";
            resArabic.textContent = "...";
            resTranslation.textContent = "...";

            try {
                // Fetching from Al-Quran Cloud API (Fast & Reliable)
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,id.indonesian`);
                const data = await res.json();

                if (data.code === 200) {
                    const arabicEdition = data.data[0];
                    const indonesianEdition = data.data[1];

                    // Let's display the first ayah (or full surah summary)
                    resSurahName.textContent = `${arabicEdition.englishName} (${arabicEdition.name})`;
                    resAyahNum.textContent = `Total Ayah: ${arabicEdition.numberOfAyahs}`;
                    resArabic.textContent = arabicEdition.ayahs[0].text; // First ayah sample
                    resTranslation.textContent = `"${indonesianEdition.ayahs[0].text}"`;
                }
            } catch (err) {
                resSurahName.textContent = "Error loading data";
            }
        });

        // Handle Audio Upload simulation (lightweight processing)
        audioUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                uploadStatus.textContent = `File "${file.name}" selected. (Static mode: Please use the dropdown above for instant meaning lookup).`;
                // You can point users to select the surah they recorded to see its meaning right away!
            }
        });
    </script>
</body>
</html>
