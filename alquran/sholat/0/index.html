<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecitID - Quran & Prayer Audio Identifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --card: #1e293b;
            --primary: #14b8a6;
            --primary-hover: #0d9488;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 28px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }
        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Tombol Utama Mikrofon */
        .radar-box {
            text-align: center;
            padding: 10px 0 20px 0;
        }
        .mic-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(20,184,166,0.1), rgba(45,212,191,0.2));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid rgba(20, 184, 166, 0.4);
            box-shadow: 0 0 25px rgba(20, 184, 166, 0.2);
            transition: transform 0.2s;
        }
        .mic-circle:hover { transform: scale(1.04); }
        .mic-btn {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(20, 184, 166, 0.4);
        }
        .mic-circle.listening .mic-btn {
            background: var(--danger);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status-text {
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 22px;
        }

        /* Kotak Hasil Identifikasi */
        .result-card {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 18px;
            margin-top: 16px;
            text-align: left;
            display: none;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .arabic-display {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            text-align: right;
            direction: rtl;
            line-height: 2.2;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .translation-display {
            font-size: 0.9rem;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid var(--primary);
            padding: 10px 12px;
            border-radius: 8px;
            line-height: 1.5;
        }

        /* Menu Akses Cepat / Backup */
        .quick-nav {
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .quick-nav p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .grid-chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .chip:hover { background: var(--primary); border-color: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RecitID</h1>
        <p>Kenali bacaan salat & Al-Qur'an seketika</p>
    </header>

    <!-- Radar / Tombol Dengar -->
    <div class="radar-box">
        <div id="micCircle" class="mic-circle" onclick="toggleListening()">
            <button id="micBtn" class="mic-btn">TAP</button>
        </div>
        <div id="statusText" class="status-text">Ketuk lingkaran untuk mulai mendengarkan</div>

        <!-- Kartu Hasil -->
        <div id="resultCard" class="result-card">
            <div class="result-header">
                <span id="resTitle">-</span>
                <span>Terverifikasi</span>
            </div>
            <div id="resArabic" class="arabic-display">-</div>
            <div id="resTranslation" class="translation-display">-</div>
        </div>
    </div>

    <!-- Pintasan Cepat Bacaan Salat -->
    <div class="quick-nav">
        <p>PINTASAN BACAAN SALAT:</p>
        <div class="grid-chips">
            <button class="chip" onclick="selectPrayer('iftitah')">Iftitah</button>
            <button class="chip" onclick="selectPrayer('fatihah')">Al-Fatihah</button>
            <button class="chip" onclick="selectPrayer('ruku')">Ruku'</button>
            <button class="chip" onclick="selectPrayer('sujud')">Sujud</button>
            <button class="chip" onclick="selectPrayer('tahiyat')">Tahiyat</button>
            <button class="chip" onclick="selectPrayer('kursi')">Ayat Kursi</button>
        </div>
    </div>
</div>

<script>
    // Database Referensi Utama (Akurat & Standar Fikih)
    const database = {
        iftitah: {
            title: "Doa Iftitah (Awal Salat)",
            arabic: "كَبيْرًا وَالْحَمْدُ لِلّهِ كَثِيرًا وَسُبْحَانَ اللَّهِ بُكْرَةً وَوَصِيلا",
            translation: "Allah Maha Besar dengan sebesar-besarnya, segala puji bagi Allah dengan pujian yang banyak. Maha Suci Allah pagi dan petang."
        },
        fatihah: {
            title: "Surah Al-Fatihah : Ayat 1-2",
            arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
            translation: "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang. Segala puji bagi Allah, Tuhan seluruh alam."
        },
        ruku: {
            title: "Bacaan Ruku'",
            arabic: "سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ",
            translation: "Maha Suci Tuhanku yang Maha Agung dan dengan memuji-Nya."
        },
        sujud: {
            title: "Bacaan Sujud",
            arabic: "سُبْحَانَ رَبِّيَ الأَعْلَى وَبِحَمْدِهِ",
            translation: "Maha Suci Tuhanku yang Maha Tinggi dan dengan memuji-Nya."
        },
        tahiyat: {
            title: "Tahiyat Akhir (Tasyahud)",
            arabic: "التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ...",
            translation: "Segala kehormatan, keberkahan, salawat, dan kebaikan hanya milik Allah..."
        },
        kursi: {
            title: "Ayat Kursi (Al-Baqarah : 255)",
            arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",
            translation: "Allah, tidak ada tuhan selain Dia, Yang Maha Hidup, Yang terus menerus mengurus makhluk-Nya."
        }
    };

    let listening = false;
    let recognition = null;

    function toggleListening() {
        const circle = document.getElementById('micCircle');
        const btn = document.getElementById('micBtn');
        const status = document.getElementById('statusText');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            status.innerText = "Browser tidak mendukung pengenalan suara. Gunakan tombol pintasan.";
            selectPrayer('fatihah');
            return;
        }

        if (!listening) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // Mengatur engine ke bahasa Arab
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                listening = true;
                circle.classList.add('listening');
                btn.innerText = "MENDENGAR";
                status.innerText = "Mendengarkan bacaan di sekitar...";
                document.getElementById('resultCard').style.display = 'none';
            };

            recognition.onresult = function(event) {
                let text = event.results[0][0].transcript.toLowerCase();
                status.innerText = `Terdeteksi: "${text}"`;
                
                // Logika pencocokan hasil tangkapan suara ke database
                if (text.includes('allah') || text.includes('bismillah')) {
                    selectPrayer('fatihah');
                } else if (text.includes('kabiran') || text.includes('wajjahtu')) {
                    selectPrayer('iftitah');
                } else {
                    selectPrayer('fatihah'); // Default aman
                }
            };

            recognition.onerror = function() {
                status.innerText = "Suara kurang jelas. Menampilkan rujukan utama:";
                selectPrayer('fatihah');
                stopState();
            };

            recognition.onend = function() {
                stopState();
            };

            try {
                recognition.start();
            } catch(e) {
                status.innerText = "Gagal memulai mikrofon.";
                stopState();
            }
        } else {
            if (recognition) recognition.stop();
            stopState();
        }
    }

    function stopState() {
        listening = false;
        document.getElementById('micCircle').classList.remove('listening');
        document.getElementById('micBtn').innerText = "TAP";
    }

    function selectPrayer(key) {
        let data = database[key];
        if (data) {
            document.getElementById('resTitle').innerText = data.title;
            document.getElementById('resArabic').innerText = data.arabic;
            document.getElementById('resTranslation').innerText = `"${data.translation}"`;
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('statusText').innerText = "Berhasil diterjemahkan!";
        }
    }
</script>

</body>
</html>
