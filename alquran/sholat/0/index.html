<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecitID - Dynamic Voice to Text & Translate</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --card: #1e293b;
            --primary: #14b8a6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 { font-size: 1.3rem; color: var(--primary); margin-bottom: 4px; }
        p.subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }

        /* Tombol Merekam */
        .mic-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(20, 184, 166, 0.3);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .mic-btn.recording {
            background: var(--danger);
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; min-height: 20px; }

        /* Kotak Hasil Teks & Terjemahan */
        .result-box {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 18px;
            text-align: left;
            display: none;
            margin-bottom: 16px;
        }
        .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .arabic-output {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            text-align: right;
            direction: rtl;
            color: #ffffff;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .translation-output {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .tts-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .tts-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>RecitID Live</h1>
    <p class="subtitle">Speech-to-Text Arab & Dynamic Translation</p>

    <button id="micBtn" class="mic-btn" onclick="toggleRecording()">REKAM</button>
    <div id="status" class="status">Ketuk tombol untuk mulai berbicara/membaca</div>

    <div id="resultBox" class="result-box">
        <div class="label">
            <span>Teks Arab (Speech-to-Text):</span>
        </div>
        <div id="arabicText" class="arabic-output">-</div>
        
        <div class="label">
            <span>Terjemahan Indonesia:</span>
            <button class="tts-btn" onclick="speakTranslation()">🔊 Dengar Suara</button>
        </div>
        <div id="translationText" class="translation-output">-</div>
    </div>
</div>

<script>
    let isRecording = false;
    let recognition = null;
    let lastTranslatedText = "";

    function toggleRecording() {
        const btn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            status.innerText = "Browser kamu tidak mendukung Speech Recognition.";
            return;
        }

        if (!isRecording) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // Wajib set ke Bahasa Arab untuk menangkap bacaan
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                btn.classList.add('recording');
                btn.innerText = "MENDENGAR";
                status.innerText = "Mendengarkan suara Arab... Silakan membaca.";
                resultBox.style.display = 'none';
            };

            recognition.onresult = async function(event) {
                let arabicTranscript = event.results[0][0].transcript;
                document.getElementById('arabicText').innerText = arabicTranscript;
                status.innerText = "Menerjemahkan teks...";

                // Menerjemahkan teks Arab hasil tangkapan secara dinamis menggunakan API Terjemahan Publik (MyMemory API)
                let translatedText = await fetchDynamicTranslation(arabicTranscript);
                lastTranslatedText = translatedText;
                
                document.getElementById('translationText').innerText = translatedText;
                resultBox.style.display = 'block';
                status.innerText = "Selesai diterjemahkan!";
            };

            recognition.onerror = function(event) {
                status.innerText = "Gagal mendengarkan audio. Coba ulangi.";
                stopState();
            };

            recognition.onend = function() {
                stopState();
            };

            try {
                recognition.start();
            } catch (e) {
                status.innerText = "Error mengaktifkan mikrofon.";
                stopState();
            }
        } else {
            if (recognition) recognition.stop();
            stopState();
        }
    }

    function stopState() {
        isRecording = false;
        const btn = document.getElementById('micBtn');
        btn.classList.remove('recording');
        btn.innerText = "REKAM";
    }

    // Fungsi Murni Dinamis: Menerjemahkan teks Arab apa pun ke bahasa Indonesia via API Publik
    async function fetchDynamicTranslation(text) {
        try {
            let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|id`;
            let response = await fetch(url);
            let data = await response.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
            return "Gagal mendapatkan terjemahan otomatis.";
        } catch (error) {
            return "Terjadi kesalahan jaringan saat menerjemahkan.";
        }
    }

    // Fitur Text-to-Speech (Membacakan hasil terjemahan ke suara)
    function speakTranslation() {
        if (!lastTranslatedText) return;
        let utterance = new SpeechSynthesisUtterance(lastTranslatedText);
        utterance.lang = 'id-ID'; // Suara bahasa Indonesia
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
