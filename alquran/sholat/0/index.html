<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecitID - Audio Quran Identifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --accent: #14b8a6;
            --accent-glow: rgba(20, 184, 166, 0.25);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: 700;
        }
        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Bagian Interaksi Utama (Pusat Rekam/Deteksi) */
        .radar-box {
            text-align: center;
            padding: 20px 0;
            position: relative;
        }
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 25px var(--accent-glow);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }
        .mic-btn:hover { transform: scale(1.05); }
        .mic-btn.listening {
            background: #ef4444;
            animation: pulse-wave 1.5s infinite;
        }
        @keyframes pulse-wave {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status-info {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Kartu Hasil Deteksi & Arti (Fokus Utama User) */
        .output-card {
            background: #090d16;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 12px;
        }
        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            text-align: right;
            direction: rtl;
            line-height: 2.2;
            color: #ffffff;
            margin-bottom: 14px;
        }
        .translation-box {
            background: rgba(20, 184, 166, 0.05);
            border-left: 3px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #d1d5db;
            line-height: 1.5;
        }

        /* Simulasi Tes Cepat untuk Ngetes Berbagai Surat */
        .simulation-controls {
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .simulation-controls p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .sim-btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sim-btn {
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sim-btn:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RecitID Engine</h1>
        <p>Deteksi bacaan salat/audio Quran & terjemahkan instan</p>
    </header>

    <!-- Tombol Tangkap Audio -->
    <div class="radar-box">
        <button id="listenBtn" class="mic-btn" onclick="startRecognitionSimulation()">DENGAR</button>
        <div id="statusText" class="status-info">Ketuk untuk mulai merekam bacaan</div>

        <!-- Hasil Terjemahan & Ayat -->
        <div id="outputCard" class="output-card">
            <div class="output-header">
                <span id="metaTitle">Surah Al-Fatihah : 1</span>
                <span id="metaAccuracy">Akurasi 99%</span>
            </div>
            <div id="arabicContent" class="arabic-display">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <div id="translationContent" class="translation-box">
                "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang."
            </div>
        </div>
    </div>

    <!-- Panel Pengujian Cepat Alur Data -->
    <div class="simulation-controls">
        <p>Simulasi Input Suara Imam (Pilih skenario tes):</p>
        <div class="sim-btn-group">
            <button class="sim-btn" onclick="triggerPreset(0)">Al-Fatihah (Ayat 1)</button>
            <button class="sim-btn" onclick="triggerPreset(1)">Ayat Kursi</button>
            <button class="sim-btn" onclick="triggerPreset(2)">Al-Ikhlas</button>
        </div>
    </div>
</div>

<script>
    // Database utama pencocokan hasil tangkapan audio (Voice-to-Quran Mapping)
    const quranDatabase = [
        {
            title: "Surah Al-Fatihah : Ayat 1",
            arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
            translation: "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang."
        },
        {
            title: "Surah Al-Baqarah : Ayat 255 (Ayat Kursi)",
            arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ",
            translation: "Allah, tidak ada tuhan selain Dia, Yang Maha Hidup, Yang terus menerus mengurus makhluk-Nya, tidak mengantuk dan tidak tidur..."
        },
        {
            title: "Surah Al-Ikhlas : Ayat 1-2",
            arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ",
            translation: "Katakanlah (Muhammad), 'Dialah Allah, Yang Maha Esa. Allah tempat bergantung segala sesuatu.'"
        }
    ];

    function startRecognitionSimulation() {
        const btn = document.getElementById('listenBtn');
        const status = document.getElementById('statusText');
        const card = document.getElementById('outputCard');

        // Alur Step 1: Menangkap Audio (Listening State)
        btn.classList.add('listening');
        btn.innerText = "...MENDENGAR";
        status.innerText = "Menganalisis gelombang suara bacaan imam...";
        card.style.display = 'none';

        // Alur Step 2: Proses Fingerprinting & Voice-to-Text (Simulasi 2.5 detik)
        setTimeout(() => {
            btn.classList.remove('listening');
            btn.innerText = "DENGAR";
            status.innerText = "Bacaan berhasil dikenali!";

            // Ambil salah satu secara acak untuk simulasi nyata
            let randomIndex = Math.floor(Math.random() * quranDatabase.length);
            displayResult(quranDatabase[randomIndex]);
        }, 2500);
    }

    function triggerPreset(index) {
        const btn = document.getElementById('listenBtn');
        const status = document.getElementById('statusText');
        
        btn.classList.add('listening');
        btn.innerText = "PROSES";
        status.innerText = "Mencocokkan suara dengan database ayat...";

        setTimeout(() => {
            btn.classList.remove('listening');
            btn.innerText = "DENGAR";
            status.innerText = "Hasil terjemahan ditemukan:";
            displayResult(quranDatabase[index]);
        }, 1000);
    }

    function displayResult(data) {
        document.getElementById('metaTitle').innerText = data.title;
        document.getElementById('arabicContent').innerText = data.arabic;
        document.getElementById('translationContent').innerText = `"${data.translation}"`;
        document.getElementById('outputCard').style.display = 'block';
    }
</script>

</body>
</html>
