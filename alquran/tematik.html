<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Quran Tematik</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-ar { font-family: 'Amiri', serif; }
  html { scroll-behavior: smooth; }
  #sky { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at bottom, #0f172a 0%, #020617 70%); }
  .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d) infinite ease-in-out; will-change: opacity; }
  @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
  .glass { background: rgba(15,23,42,.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(148,163,184,.18); }
  .card-hover { transition: all .25s cubic-bezier(.4,0,.2,1); }
  .card-hover:hover { transform: translateY(-2px); border-color: rgba(96,165,250,.45); box-shadow: 0 8px 32px rgba(59,130,246,.12); }
  .ayah-item { transition: background .2s, transform .15s; }
  .ayah-item:active { transform: scale(.98); }
  .modal-backdrop { transition: opacity .3s ease; }
  .modal-panel { transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
  .modal-enter { opacity: 0; }
  .modal-enter .modal-panel { transform: scale(.92) translateY(20px); opacity: 0; }
  .modal-show { opacity: 1; }
  .modal-show .modal-panel { transform: scale(1) translateY(0); opacity: 1; }
  .loader { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.2); border-top-color: #60a5fa; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.3); border-radius: 3px; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden">
<div id="sky"></div>

<div class="relative z-10 max-w-2xl mx-auto px-4 pb-24 pt-6">
  <!-- Header -->
  <header class="text-center mb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-300 via-indigo-300 to-purple-300 bg-clip-text text-transparent">
      Al Quran (Tematik)
    </h1>
    <p class="text-slate-400 text-sm mt-2">Temukan ayat berdasarkan tema</p>
  </header>

  <!-- Search -->
  <div class="mb-6 sticky top-3 z-20">
    <div class="glass rounded-2xl px-4 py-3 flex items-center gap-3 shadow-lg shadow-black/20">
      <svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="search" type="search" placeholder="Cari tema..." class="bg-transparent w-full outline-none text-sm placeholder:text-slate-500" autocomplete="off">
    </div>
  </div>

  <!-- Themes -->
  <div id="themes" class="space-y-3"></div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 modal-backdrop modal-enter pointer-events-none">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
  <div class="modal-panel relative glass w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[88vh] overflow-y-auto shadow-2xl">
    <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 transition" aria-label="Tutup">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <h3 id="m-title" class="text-lg font-bold text-blue-300 pr-10 mb-4"></h3>
    <div id="m-ar" class="font-ar text-2xl leading-loose text-right text-slate-100 mb-4 min-h-[3rem]"></div>
    <div id="m-id" class="text-slate-300 text-sm leading-relaxed mb-5 min-h-[2.5rem]"></div>
    <a id="m-link" href="#" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300 mb-5 transition">
      Buka di quran.com
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
    </a>
    <div class="flex gap-2 flex-wrap">
      <button onclick="playAudio()" class="flex-1 min-w-[110px] bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-sm font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Ngaji
      </button>
      <button onclick="playTTS()" class="flex-1 min-w-[110px] bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg> Arti
      </button>
      <button onclick="stopAll()" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 text-sm font-medium py-2.5 px-4 rounded-xl transition">Stop</button>
    </div>
  </div>
</div>

<script>
const SURAH = ["","Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadilah","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Lail","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];

const THEMES = {
  "Alam Semesta": [[2,164],[3,190],[21,30],[21,33],[36,38],[36,40],[41,11],[51,47],[55,5],[55,7],[67,3],[88,17]],
  "Tauhid": [[2,163],[2,255],[3,2],[3,18],[4,48],[6,102],[16,36],[17,42],[21,22],[37,35],[39,3],[112,1]],
  "Iman kepada Allah": [[2,255],[3,2],[6,59],[6,103],[13,9],[20,8],[24,35],[59,22],[59,23],[59,24]],
  "Hari Akhir": [[3,185],[6,31],[22,7],[36,51],[39,68],[50,20],[69,13],[75,6],[78,17],[81,1],[82,1],[99,1]],
  "Akhlak Mulia": [[2,177],[3,134],[4,36],[16,90],[17,23],[25,63],[31,18],[49,11],[49,12],[68,4]],
  "Sabar": [[2,153],[2,155],[3,200],[16,126],[18,28],[31,17],[39,10],[42,43],[70,5],[103,3]],
  "Shalat": [[2,3],[2,43],[4,103],[11,114],[17,78],[20,14],[29,45],[70,34],[108,2]],
  "Zakat & Infak": [[2,43],[2,110],[2,261],[2,267],[9,60],[9,103],[57,18],[64,16]],
  "Kisah Nabi": [[2,124],[7,59],[7,65],[7,73],[7,85],[11,25],[19,16],[21,51],[21,83],[27,15],[37,102]],
  "Surga": [[2,25],[3,133],[9,72],[13,23],[18,31],[36,55],[47,15],[55,46],[56,12],[76,5]],
  "Neraka": [[2,24],[3,131],[4,56],[14,16],[18,29],[22,19],[39,16],[67,6],[74,26],[104,4]],
  "Ilmu": [[2,31],[2,269],[3,18],[16,78],[20,114],[35,28],[39,9],[58,11],[96,1],[96,5]]
};

let current = null, audio = null, openTheme = null;

function stars() {
  const sky = document.getElementById('sky');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.8;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*5+2).toFixed(1)}s`;
    sky.appendChild(s);
  }
}

function render(filter = '') {
  const el = document.getElementById('themes');
  el.innerHTML = '';
  const q = filter.toLowerCase().trim();
  Object.entries(THEMES).forEach(([tema, ayahs]) => {
    if (q && !tema.toLowerCase().includes(q)) return;
    const id = tema.replace(/\s+/g, '-');
    const card = document.createElement('div');
    card.className = 'glass rounded-2xl overflow-hidden card-hover';
    card.innerHTML = `
      <button class="w-full flex items-center justify-between px-5 py-4 text-left" data-tema="${id}">
        <span class="font-semibold text-base">${tema}</span>
        <svg class="w-5 h-5 text-slate-400 transition-transform duration-300 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="ayah-list hidden px-3 pb-3 space-y-1.5" id="list-${id}"></div>`;
    el.appendChild(card);

    const btn = card.querySelector('button');
    const list = card.querySelector('.ayah-list');
    const chev = card.querySelector('.chevron');

    ayahs.forEach(([s, a]) => {
      const item = document.createElement('button');
      item.className = 'ayah-item w-full text-left px-4 py-2.5 rounded-xl text-sm text-slate-300 hover:bg-blue-500/15 hover:text-blue-200';
      item.textContent = `${SURAH[s]} (${s}. ${a})`;
      item.onclick = (e) => { e.stopPropagation(); openAyah(s, a); };
      list.appendChild(item);
    });

    btn.onclick = () => {
      const isOpen = !list.classList.contains('hidden');
      document.querySelectorAll('.ayah-list').forEach(l => l.classList.add('hidden'));
      document.querySelectorAll('.chevron').forEach(c => c.style.transform = '');
      if (!isOpen) {
        list.classList.remove('hidden');
        chev.style.transform = 'rotate(180deg)';
        openTheme = id;
      } else openTheme = null;
    };
  });
}

async function openAyah(s, a) {
  current = { s, a };
  const modal = document.getElementById('modal');
  document.getElementById('m-title').textContent = `${SURAH[s]} ${s}:${a}`;
  document.getElementById('m-ar').innerHTML = '<div class="loader mx-auto"></div>';
  document.getElementById('m-id').textContent = '';
  document.getElementById('m-link').href = `https://quran.com/${s}/${a}`;
  modal.classList.remove('pointer-events-none', 'modal-enter');
  modal.classList.add('modal-show');
  document.body.style.overflow = 'hidden';

  try {
    const [arRes, idRes] = await Promise.all([
      fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`),
      fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/id.indonesian`)
    ]);
    const ar = await arRes.json();
    const id = await idRes.json();
    document.getElementById('m-ar').textContent = ar.data.text;
    document.getElementById('m-id').textContent = id.data.text;
  } catch {
    document.getElementById('m-ar').textContent = '';
    document.getElementById('m-id').textContent = 'Gagal memuat. Periksa koneksi.';
  }
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('modal-show');
  modal.classList.add('modal-enter');
  setTimeout(() => modal.classList.add('pointer-events-none'), 300);
  document.body.style.overflow = '';
  stopAll();
}

function playAudio() {
  if (!current) return;
  stopAll();
  const pad = n => String(n).padStart(3, '0');
  audio = new Audio(`https://everyayah.com/data/Alafasy_128kbps/${pad(current.s)}${pad(current.a)}.mp3`);
  audio.play().catch(() => {});
}

function playTTS() {
  if (!current) return;
  stopAll();
  const t = document.getElementById('m-id').textContent;
  if (!t || t.includes('Gagal') || t.includes('Memuat')) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'id-ID';
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

function stopAll() {
  if (audio) { audio.pause(); audio = null; }
  speechSynthesis.cancel();
}

document.getElementById('search').addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

stars();
render();
</script>
</body>
</html>
