<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <meta name="description" content="imgproc Convert — Change image format offline." />
  <title>Convert · imgproc</title>
  <style>
    :root {
      --bg: #0B0B0F; --surface: #141418; --surface-2: #1C1C22; --surface-3: #25252B;
      --border: rgba(255,255,255,0.07); --text: #F4F4F5; --text-2: #A1A1AA; --text-3: #71717A;
      --accent: #A78BFA; --success: #34D399; --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    #app { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }

    .header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; padding-top: max(14px, env(safe-area-inset-top)); flex-shrink: 0; }
    .btn-back { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }
    .btn-back:active { background: var(--surface-3); }
    .header-title h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.02em; }
    .header-title span { font-size: 0.72rem; color: var(--text-3); }

    .view { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
    .view.active { display: flex; }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 28px; text-align: center; }
    .empty-icon { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #8B5CF6, #A78BFA); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 8px 28px rgba(139,92,246,0.3); }
    .empty-icon svg { width: 32px; height: 32px; color: white; }
    .empty h2 { font-size: 1.25rem; font-weight: 650; margin-bottom: 8px; }
    .empty p { font-size: 0.88rem; color: var(--text-2); margin-bottom: 28px; line-height: 1.5; }
    .btn-pick { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 14px; border: none; background: linear-gradient(135deg, #6366F1, #8B5CF6); color: white; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 6px 24px rgba(99,102,241,0.35); }
    .btn-pick:active { transform: scale(0.98); }

    .workspace { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .preview-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 12px; background: #050506; }
    .preview-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }

    .panel { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 14px 16px 18px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }

    .format-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .format-btn { padding: 12px 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font-size: 0.8rem; font-weight: 600; font-family: inherit; cursor: pointer; text-align: center; }
    .format-btn.active { background: linear-gradient(135deg, #8B5CF6, #A78BFA); border-color: transparent; color: white; box-shadow: 0 4px 14px rgba(139,92,246,0.35); }

    .info-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-2); margin-bottom: 14px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); }
    .info-row strong { color: var(--text); }

    .actions { display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 13px 10px; border-radius: 12px; border: none; font-size: 0.9rem; font-weight: 600; font-family: inherit; cursor: pointer; }
    .btn-action.primary { background: linear-gradient(135deg, #6366F1, #8B5CF6); color: white; box-shadow: 0 4px 18px rgba(99,102,241,0.3); }
    .btn-action:active { transform: scale(0.98); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    #file-input { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <a href="./index.html" class="btn-back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="header-title">
        <h1>Convert</h1>
        <span>JPG · PNG · WebP · PDF</span>
      </div>
    </header>

    <section class="view active" id="view-empty">
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </div>
        <h2>Convert format</h2>
        <p>Change between JPG, PNG, WebP or export as PDF.<br>Everything stays on your device.</p>
        <button class="btn-pick" id="btn-pick" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
          </svg>
          Choose Image
        </button>
      </div>
    </section>

    <section class="view" id="view-work">
      <div class="workspace">
        <div class="preview-wrap">
          <img id="preview" alt="Preview" />
        </div>
        <div class="panel">
          <div class="format-grid" id="formats">
            <button class="format-btn active" data-fmt="image/jpeg" data-ext="jpg" type="button">JPG</button>
            <button class="format-btn" data-fmt="image/png" data-ext="png" type="button">PNG</button>
            <button class="format-btn" data-fmt="image/webp" data-ext="webp" type="button">WebP</button>
            <button class="format-btn" data-fmt="application/pdf" data-ext="pdf" type="button">PDF</button>
          </div>
          <div class="info-row">
            <span>Source: <strong id="src-info">—</strong></span>
            <span>Target: <strong id="tgt-info">JPG</strong></span>
          </div>
          <div class="actions">
            <button class="btn-action primary" id="btn-convert" type="button">Convert & Download</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <input type="file" id="file-input" accept="image/*" />

  <script>
  (function () {
    "use strict";

    let file = null;
    let imgEl = null;
    let fmt = "image/jpeg";
    let ext = "jpg";

    const viewEmpty = document.getElementById("view-empty");
    const viewWork = document.getElementById("view-work");
    const preview = document.getElementById("preview");
    const srcInfo = document.getElementById("src-info");
    const tgtInfo = document.getElementById("tgt-info");
    const btnConvert = document.getElementById("btn-convert");

    function show(v) {
      viewEmpty.classList.remove("active");
      viewWork.classList.remove("active");
      v.classList.add("active");
    }

    function loadImage(f) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(f);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Load failed")); };
        img.src = url;
      });
    }

    // Minimal single-page PDF with embedded JPEG
    function imageToPdf(jpegBlob, width, height) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const data = new Uint8Array(reader.result);
          // Scale to fit A4-ish page (595 x 842 points) while keeping aspect
          const pageW = 595, pageH = 842;
          const scale = Math.min(pageW / width, pageH / height, 1);
          const w = width * scale;
          const h = height * scale;
          const x = (pageW - w) / 2;
          const y = (pageH - h) / 2;

          // Build PDF manually (simple)
          const chunks = [];
          const enc = new TextEncoder();

          function add(str) { chunks.push(enc.encode(str)); }
          function addBytes(arr) { chunks.push(arr); }

          // We'll collect offsets
          const objects = [];
          let body = [];

          function pushObj(content) {
            objects.push(content);
          }

          pushObj("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
          pushObj("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
          pushObj(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>\nendobj\n`);
          const stream = `q\n${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm\n/Im0 Do\nQ\n`;
          pushObj(`4 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}endstream\nendobj\n`);
          pushObj(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${data.length} >>\nstream\n`);
          // object 5 continues with binary then endstream

          // Assemble with xref
          let pdf = "%PDF-1.4\n";
          const offsets = [0];
          let pos = pdf.length;

          for (let i = 0; i < 4; i++) {
            offsets.push(pos);
            pdf += objects[i];
            pos = pdf.length;
          }

          // Object 5 with binary
          offsets.push(pos);
          const obj5Header = objects[4];
          pdf += obj5Header;

          // Convert string so far to bytes and append jpeg
          const headerBytes = enc.encode(pdf);
          const endPart = enc.encode("\nendstream\nendobj\n");
          const xrefPos = headerBytes.length + data.length + endPart.length;

          // Build full array
          const parts = [headerBytes, data, endPart];
          // xref
          let xref = `xref\n0 6\n0000000000 65535 f \n`;
          for (let i = 1; i <= 5; i++) {
            xref += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
          }
          xref += `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;
          parts.push(enc.encode(xref));

          // Merge
          const total = parts.reduce((s, p) => s + p.length, 0);
          const out = new Uint8Array(total);
          let o = 0;
          for (const p of parts) { out.set(p, o); o += p.length; }
          resolve(new Blob([out], { type: "application/pdf" }));
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(jpegBlob);
      });
    }

    function convertTo(format) {
      return new Promise((resolve, reject) => {
        if (!imgEl) return reject(new Error("No image"));
        const canvas = document.createElement("canvas");
        canvas.width = imgEl.naturalWidth;
        canvas.height = imgEl.naturalHeight;
        const ctx = canvas.getContext("2d");
        if (format === "image/jpeg") {
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(imgEl, 0, 0);

        if (format === "application/pdf") {
          canvas.toBlob(async (jpegBlob) => {
            if (!jpegBlob) return reject(new Error("Failed"));
            try {
              const pdf = await imageToPdf(jpegBlob, canvas.width, canvas.height);
              resolve(pdf);
            } catch (e) { reject(e); }
          }, "image/jpeg", 0.92);
          return;
        }

        canvas.toBlob((blob) => {
          if (!blob) return reject(new Error("Failed"));
          resolve(blob);
        }, format, format === "image/jpeg" ? 0.92 : undefined);
      });
    }

    document.getElementById("btn-pick").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      try {
        file = f;
        imgEl = await loadImage(f);
        preview.src = URL.createObjectURL(f);
        const type = (f.type || "image/*").replace("image/", "").toUpperCase() || "IMG";
        srcInfo.textContent = type;
        show(viewWork);
      } catch {
        alert("Could not load image.");
      }
    });

    document.getElementById("formats").addEventListener("click", (e) => {
      const btn = e.target.closest(".format-btn");
      if (!btn) return;
      document.querySelectorAll(".format-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      fmt = btn.dataset.fmt;
      ext = btn.dataset.ext;
      tgtInfo.textContent = ext.toUpperCase();
    });

    btnConvert.addEventListener("click", async () => {
      if (!imgEl) return;
      btnConvert.disabled = true;
      btnConvert.textContent = "Converting…";
      try {
        const blob = await convertTo(fmt);
        const a = document.createElement("a");
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = "imgproc-convert-" + Date.now() + "." + ext;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      } catch (err) {
        alert("Convert failed: " + err.message);
      } finally {
        btnConvert.disabled = false;
        btnConvert.textContent = "Convert & Download";
      }
    });
  })();
  </script>
</body>
</html>
