<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <meta name="description" content="imgproc Watermark — Add text or logo with free position. Offline & private." />
  <title>Watermark · imgproc</title>
  <style>
    :root {
      --bg: #0B0B0F;
      --surface: #141418;
      --surface-2: #1C1C22;
      --surface-3: #25252B;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.12);
      --text: #F4F4F5;
      --text-2: #A1A1AA;
      --text-3: #71717A;
      --accent: #818CF8;
      --accent-2: #A78BFA;
      --accent-soft: rgba(129,140,248,0.15);
      --success: #34D399;
      --teal: #14B8A6;
      --radius: 20px;
      --radius-sm: 14px;
      --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
    }

    #app {
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 10px;
      padding-top: max(14px, env(safe-area-inset-top));
      flex-shrink: 0;
      z-index: 5;
    }

    .btn-back {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-back:active { background: var(--surface-3); }

    .header-title {
      flex: 1;
      min-width: 0;
    }

    .header-title h1 {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .header-title span {
      font-size: 0.72rem;
      color: var(--text-3);
    }

    /* Views */
    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .view.active { display: flex; }

    /* Empty state */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
      text-align: center;
    }

    .empty-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #14B8A6, #2DD4BF);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 28px rgba(20,184,166,0.3);
    }

    .empty-icon svg { width: 32px; height: 32px; color: white; }

    .empty h2 {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 0.88rem;
      color: var(--text-2);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-pick {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(99,102,241,0.35);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-pick:active { transform: scale(0.98); }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      background: #050506;
      position: relative;
    }

    #stage {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #stage.dragging { cursor: grabbing; }

    .hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--text-3);
      background: rgba(0,0,0,0.6);
      padding: 5px 12px;
      border-radius: 100px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .hint.show { opacity: 1; }

    /* Panel */
    .panel {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 14px 16px 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      max-height: 48vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      padding: 9px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-2);
      font-size: 0.85rem;
      font-weight: 550;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      background: linear-gradient(135deg, #14B8A6, #2DD4BF);
      color: white;
      box-shadow: 0 2px 10px rgba(20,184,166,0.3);
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .control-group label span.value {
      font-weight: 600;
      color: var(--text);
      background: var(--surface-3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: rgba(20,184,166,0.5);
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--surface-3);
      border-radius: 100px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #14B8A6, #2DD4BF);
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(20,184,166,0.4);
      cursor: pointer;
    }

    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="color"] {
      width: 40px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      cursor: pointer;
      padding: 2px;
    }

    .btn-logo {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px dashed var(--border-strong);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-logo:active { background: var(--surface-3); }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-action {
      flex: 1;
      padding: 13px 10px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }

    .btn-action:active { transform: scale(0.98); }

    .btn-action.primary {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      box-shadow: 0 4px 18px rgba(99,102,241,0.3);
    }

    .btn-action.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .hidden { display: none !important; }

    #file-input, #logo-input { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <a href="./index.html" class="btn-back" id="btn-back" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <div class="header-title">
        <h1>Watermark</h1>
        <span>Add text or logo · free position</span>
      </div>
    </header>

    <!-- Empty view -->
    <section class="view active" id="view-empty">
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h2>Protect your image</h2>
        <p>Choose a photo, then place text or a logo anywhere with drag.</p>
        <button class="btn-pick" id="btn-pick" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          Choose Image
        </button>
      </div>
    </section>

    <!-- Workspace view -->
    <section class="view" id="view-work">
      <div class="workspace">
        <div class="canvas-wrap">
          <canvas id="stage"></canvas>
          <div class="hint" id="hint">Drag watermark to move</div>
        </div>

        <div class="panel">
          <!-- Mode tabs -->
          <div class="tabs">
            <button class="tab active" data-mode="text" type="button">Text</button>
            <button class="tab" data-mode="logo" type="button">Logo</button>
          </div>

          <!-- Text controls -->
          <div id="panel-text">
            <div class="control-group">
              <label>Text</label>
              <input type="text" id="wm-text" value="© imgproc" maxlength="80" placeholder="Your watermark text" />
            </div>
            <div class="control-group">
              <label>Size <span class="value" id="val-size">32</span></label>
              <input type="range" id="wm-size" min="12" max="120" value="32" />
            </div>
            <div class="control-group">
              <label>Color</label>
              <div class="color-row">
                <input type="color" id="wm-color" value="#ffffff" />
              </div>
            </div>
          </div>

          <!-- Logo controls -->
          <div id="panel-logo" class="hidden">
            <div class="control-group">
              <button class="btn-logo" id="btn-logo" type="button">Upload Logo / Icon</button>
            </div>
            <div class="control-group">
              <label>Scale <span class="value" id="val-scale">40%</span></label>
              <input type="range" id="wm-scale" min="10" max="100" value="40" />
            </div>
          </div>

          <!-- Shared -->
          <div class="control-group">
            <label>Opacity <span class="value" id="val-opacity">60%</span></label>
            <input type="range" id="wm-opacity" min="10" max="100" value="60" />
          </div>
          <div class="control-group">
            <label>Rotation <span class="value" id="val-rotation">0°</span></label>
            <input type="range" id="wm-rotation" min="-180" max="180" value="0" />
          </div>

          <div class="actions">
            <button class="btn-action secondary" id="btn-reset" type="button">Reset</button>
            <button class="btn-action primary" id="btn-download" type="button">Download</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <input type="file" id="file-input" accept="image/*" />
  <input type="file" id="logo-input" accept="image/*" />

  <script>
  (function () {
    "use strict";

    /* =========================================================
       State
       ========================================================= */
    const state = {
      base: null,          // HTMLImageElement
      mode: "text",        // "text" | "logo"
      text: "© imgproc",
      fontSize: 32,
      color: "#ffffff",
      opacity: 0.6,
      rotation: 0,         // degrees
      logo: null,          // HTMLImageElement
      logoScale: 0.4,      // relative to base width
      // Position in image coordinates (center of watermark)
      x: 0,
      y: 0,
      // Canvas display scale (image → screen)
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      dragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0
    };

    /* =========================================================
       DOM
       ========================================================= */
    const viewEmpty = document.getElementById("view-empty");
    const viewWork = document.getElementById("view-work");
    const stage = document.getElementById("stage");
    const ctx = stage.getContext("2d");
    const hint = document.getElementById("hint");
    const panelText = document.getElementById("panel-text");
    const panelLogo = document.getElementById("panel-logo");

    const el = {
      text: document.getElementById("wm-text"),
      size: document.getElementById("wm-size"),
      color: document.getElementById("wm-color"),
      opacity: document.getElementById("wm-opacity"),
      rotation: document.getElementById("wm-rotation"),
      scale: document.getElementById("wm-scale"),
      valSize: document.getElementById("val-size"),
      valOpacity: document.getElementById("val-opacity"),
      valRotation: document.getElementById("val-rotation"),
      valScale: document.getElementById("val-scale")
    };

    /* =========================================================
       Helpers
       ========================================================= */
    function showView(view) {
      viewEmpty.classList.remove("active");
      viewWork.classList.remove("active");
      view.classList.add("active");
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Failed to load image"));
        };
        img.src = url;
      });
    }

    /* =========================================================
       Layout canvas to fit container while keeping aspect
       ========================================================= */
    function layoutCanvas() {
      if (!state.base) return;

      const wrap = stage.parentElement;
      const maxW = wrap.clientWidth - 16;
      const maxH = wrap.clientHeight - 16;

      const imgW = state.base.naturalWidth;
      const imgH = state.base.naturalHeight;
      const ratio = Math.min(maxW / imgW, maxH / imgH, 1);

      state.scale = ratio;
      stage.width = Math.round(imgW * ratio);
      stage.height = Math.round(imgH * ratio);

      // CSS size = canvas size
      stage.style.width = stage.width + "px";
      stage.style.height = stage.height + "px";
    }

    /* =========================================================
       Render
       ========================================================= */
    function render() {
      if (!state.base) return;

      const w = stage.width;
      const h = stage.height;
      const s = state.scale;

      ctx.clearRect(0, 0, w, h);

      // Base image
      ctx.drawImage(state.base, 0, 0, w, h);

      // Watermark
      ctx.save();
      ctx.globalAlpha = state.opacity;

      // Position in canvas pixels (state.x/y are image coords)
      const cx = state.x * s;
      const cy = state.y * s;

      ctx.translate(cx, cy);
      ctx.rotate((state.rotation * Math.PI) / 180);

      if (state.mode === "text") {
        const fontPx = Math.max(8, state.fontSize * s);
        ctx.font = `600 ${fontPx}px ${getComputedStyle(document.body).fontFamily}`;
        ctx.fillStyle = state.color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        // Soft shadow for readability
        ctx.shadowColor = "rgba(0,0,0,0.45)";
        ctx.shadowBlur = 4 * s;
        ctx.shadowOffsetX = 1 * s;
        ctx.shadowOffsetY = 1 * s;
        ctx.fillText(state.text || " ", 0, 0);
      } else if (state.mode === "logo" && state.logo) {
        const logoW = state.base.naturalWidth * state.logoScale * s;
        const logoH = (state.logo.naturalHeight / state.logo.naturalWidth) * logoW;
        ctx.drawImage(state.logo, -logoW / 2, -logoH / 2, logoW, logoH);
      }

      ctx.restore();
    }

    function fullRender() {
      layoutCanvas();
      render();
    }

    /* =========================================================
       Export at original resolution
       ========================================================= */
    function exportImage() {
      if (!state.base) return;

      const out = document.createElement("canvas");
      out.width = state.base.naturalWidth;
      out.height = state.base.naturalHeight;
      const octx = out.getContext("2d");

      octx.drawImage(state.base, 0, 0);

      octx.save();
      octx.globalAlpha = state.opacity;
      octx.translate(state.x, state.y);
      octx.rotate((state.rotation * Math.PI) / 180);

      if (state.mode === "text") {
        octx.font = `600 ${state.fontSize}px ${getComputedStyle(document.body).fontFamily}`;
        octx.fillStyle = state.color;
        octx.textAlign = "center";
        octx.textBaseline = "middle";
        octx.shadowColor = "rgba(0,0,0,0.4)";
        octx.shadowBlur = 4;
        octx.shadowOffsetX = 1;
        octx.shadowOffsetY = 1;
        octx.fillText(state.text || " ", 0, 0);
      } else if (state.mode === "logo" && state.logo) {
        const logoW = state.base.naturalWidth * state.logoScale;
        const logoH = (state.logo.naturalHeight / state.logo.naturalWidth) * logoW;
        octx.drawImage(state.logo, -logoW / 2, -logoH / 2, logoW, logoH);
      }

      octx.restore();

      out.toBlob((blob) => {
        if (!blob) return;
        const a = document.createElement("a");
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `imgproc-watermark-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }, "image/png");
    }

    /* =========================================================
       Drag logic (image coordinates)
       ========================================================= */
    function canvasToImage(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const x = (clientX - rect.left) / state.scale;
      const y = (clientY - rect.top) / state.scale;
      return { x, y };
    }

    function onPointerDown(e) {
      if (!state.base) return;
      e.preventDefault();
      const pt = canvasToImage(
        e.clientX ?? e.touches[0].clientX,
        e.clientY ?? e.touches[0].clientY
      );
      state.dragging = true;
      state.dragOffsetX = state.x - pt.x;
      state.dragOffsetY = state.y - pt.y;
      stage.classList.add("dragging");
    }

    function onPointerMove(e) {
      if (!state.dragging) return;
      e.preventDefault();
      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
      if (clientX == null) return;

      const pt = canvasToImage(clientX, clientY);
      state.x = pt.x + state.dragOffsetX;
      state.y = pt.y + state.dragOffsetY;

      // Clamp roughly inside image
      const margin = 20;
      state.x = Math.max(margin, Math.min(state.base.naturalWidth - margin, state.x));
      state.y = Math.max(margin, Math.min(state.base.naturalHeight - margin, state.y));

      render();
    }

    function onPointerUp() {
      state.dragging = false;
      stage.classList.remove("dragging");
    }

    /* =========================================================
       Events
       ========================================================= */
    document.getElementById("btn-pick").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;

      try {
        state.base = await loadImage(file);
        // Default position: center
        state.x = state.base.naturalWidth / 2;
        state.y = state.base.naturalHeight / 2;
        showView(viewWork);
        fullRender();
        hint.classList.add("show");
        setTimeout(() => hint.classList.remove("show"), 2500);
      } catch (err) {
        alert("Could not load image.");
      }
    });

    // Tabs
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        state.mode = tab.dataset.mode;
        panelText.classList.toggle("hidden", state.mode !== "text");
        panelLogo.classList.toggle("hidden", state.mode !== "logo");
        render();
      });
    });

    // Text controls
    el.text.addEventListener("input", () => {
      state.text = el.text.value;
      render();
    });

    el.size.addEventListener("input", () => {
      state.fontSize = parseInt(el.size.value, 10);
      el.valSize.textContent = state.fontSize;
      render();
    });

    el.color.addEventListener("input", () => {
      state.color = el.color.value;
      render();
    });

    el.opacity.addEventListener("input", () => {
      state.opacity = parseInt(el.opacity.value, 10) / 100;
      el.valOpacity.textContent = el.opacity.value + "%";
      render();
    });

    el.rotation.addEventListener("input", () => {
      state.rotation = parseInt(el.rotation.value, 10);
      el.valRotation.textContent = state.rotation + "°";
      render();
    });

    el.scale.addEventListener("input", () => {
      state.logoScale = parseInt(el.scale.value, 10) / 100;
      el.valScale.textContent = el.scale.value + "%";
      render();
    });

    // Logo upload
    document.getElementById("btn-logo").addEventListener("click", () => {
      document.getElementById("logo-input").click();
    });

    document.getElementById("logo-input").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      try {
        state.logo = await loadImage(file);
        render();
      } catch {
        alert("Could not load logo.");
      }
    });

    // Actions
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!state.base) return;
      state.x = state.base.naturalWidth / 2;
      state.y = state.base.naturalHeight / 2;
      state.rotation = 0;
      state.opacity = 0.6;
      state.fontSize = 32;
      state.logoScale = 0.4;
      state.text = "© imgproc";
      state.color = "#ffffff";

      el.text.value = state.text;
      el.size.value = 32;
      el.valSize.textContent = "32";
      el.color.value = "#ffffff";
      el.opacity.value = 60;
      el.valOpacity.textContent = "60%";
      el.rotation.value = 0;
      el.valRotation.textContent = "0°";
      el.scale.value = 40;
      el.valScale.textContent = "40%";
      render();
    });

    document.getElementById("btn-download").addEventListener("click", exportImage);

    // Pointer events (mouse + touch)
    stage.addEventListener("mousedown", onPointerDown);
    stage.addEventListener("touchstart", onPointerDown, { passive: false });
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("touchmove", onPointerMove, { passive: false });
    window.addEventListener("mouseup", onPointerUp);
    window.addEventListener("touchend", onPointerUp);

    // Resize
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (state.base) fullRender();
      }, 120);
    });
  })();
  </script>
</body>
</html>
