<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speedi — Real-Time Fleet & Safety Speedometer</title>
    <!-- Google Material Symbols & Roboto Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; overflow-x: hidden; }
        
        /* Enterprise Header Bar */
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 480px; margin: 0 auto; }
        .brand-group { display: flex; flex-direction: column; }
        .brand { font-size: 0.95rem; font-weight: 900; color: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
        .sub-brand { font-size: 0.65rem; color: #64748b; font-weight: 500; }
        
        .toolbar { display: flex; gap: 8px; align-items: center; }
        
        /* Material Icon Buttons */
        .material-btn { background: #1e293b; border: 1px solid #334155; color: #f8fafc; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .material-btn:active { background: #334155; transform: scale(0.95); }
        .material-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
        .material-btn span { font-size: 22px; }

        /* Main Hero Speed Display */
        .gauge-section { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto; text-align: center; }
        .speed-box { position: relative; padding: 10px; transition: 0.3s; }
        .speed-value { font-size: 7.5rem; font-weight: 900; line-height: 1; color: #ffffff; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
        .speed-unit { font-size: 1.4rem; font-weight: 700; color: #38bdf8; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Speed Warning State */
        body.over-speed .speed-value { color: #ef4444; text-shadow: 0 0 35px rgba(239, 68, 68, 0.6); }
        body.over-speed .speed-box { animation: pulseWarning 0.8s infinite alternate; }
        @keyframes pulseWarning { from { transform: scale(1); } to { transform: scale(1.02); } }

        /* Enterprise Console Drawer */
        .drawer { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; width: 100%; max-width: 480px; margin: 0 auto; display: none; flex-direction: column; gap: 14px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7); animation: slideUp 0.3s ease; }
        .drawer.open { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .drawer-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: #94a3b8; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat-card { background: #070a14; border: 1px solid #1e293b; padding: 10px; border-radius: 12px; text-align: center; }
        .stat-label { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 3px; font-weight: 700; }
        .stat-val { font-size: 0.95rem; font-weight: 700; color: #f1f5f9; font-variant-numeric: tabular-nums; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; background: #070a14; border: 1px solid #1e293b; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; color: #94a3b8; }
        .setting-row input[type="text"], .setting-row input[type="number"] { width: 90px; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 6px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 0.85rem; }

        .enterprise-btn { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; width: 100%; transition: 0.2s; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .enterprise-btn:active { background: #334155; }
        .enterprise-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

        /* Footer Status Bar */
        .status-footer { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 480px; margin: 15px auto 0; font-size: 0.75rem; color: #64748b; padding: 0 4px; }
        .gps-indicator { display: flex; align-items: center; gap: 6px; }
        .gps-dot { height: 8px; width: 8px; background-color: #ef4444; border-radius: 50%; display: inline-block; }
        .gps-dot.locked { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    </style>
</head>
<body>

    <!-- Header Toolbar with Material Icons -->
    <div class="header">
        <div class="brand-group">
            <div class="brand">SPEEDI</div>
            <div id="fleetIdDisplay" class="sub-brand">UNIT: FL-001 (REAL-TIME GPS)</div>
        </div>
        <div class="toolbar">
            <button class="material-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice Safety Assistant">
                <span class="material-symbols-rounded">volume_up</span>
            </button>
            <button class="material-btn" onclick="resetTrip()" title="Reset Session">
                <span class="material-symbols-rounded">restart_alt</span>
            </button>
            <button class="material-btn" id="drawerBtn" onclick="toggleDrawer()" title="Settings & Simulation">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </div>
    </div>

    <!-- Main Hero Screen -->
    <div class="gauge-section">
        <div class="speed-box">
            <div id="speedDisplay" class="speed-value">0.0</div>
            <div id="unitDisplay" class="speed-unit">KM/H</div>
        </div>
    </div>

    <!-- Enterprise Console Drawer (Simulation moved here) -->
    <div class="drawer" id="infoDrawer">
        <div class="drawer-header">
            <span>SETTINGS & SIMULATION</span>
            <span class="material-symbols-rounded" style="cursor: pointer; font-size: 20px;" onclick="toggleDrawer()">close</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Peak Velocity</div>
                <div id="maxSpeed" class="stat-val">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Mean Velocity</div>
                <div id="avgSpeed" class="stat-val">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Odometer</div>
                <div id="distance" class="stat-val">0.00 km</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Duration</div>
                <div id="tripTime" class="stat-val">00:00:00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Precision</div>
                <div id="accuracy" class="stat-val">-- m</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unit</div>
                <div id="unitToggleCard" class="stat-val" style="cursor: pointer; color: #38bdf8;" onclick="toggleUnit()">KM/H ⇄</div>
            </div>
        </div>

        <div class="setting-row">
            <span>Fleet Unit ID</span>
            <input type="text" id="unitIdInput" value="FL-001" onchange="updateFleetId()">
        </div>

        <div class="setting-row">
            <span>Speed Limit Threshold</span>
            <div style="display: flex; gap: 6px; align-items: center;">
                <input type="number" id="speedLimitInput" value="100" min="10" max="300" onchange="updateLimit()">
                <span id="limitUnitLabel" style="font-weight: 700; color: #f1f5f9;">KM/H</span>
            </div>
        </div>

        <button class="enterprise-btn" id="simBtn" onclick="toggleSimulation()">
            <span class="material-symbols-rounded" style="font-size: 18px;">science</span> Test Route Simulation (Off)
        </button>

        <button class="enterprise-btn" onclick="exportAuditLogs()">
            <span class="material-symbols-rounded" style="font-size: 18px;">download</span> Export Audit Log (CSV)
        </button>
    </div>

    <!-- Footer Status -->
    <div class="status-footer">
        <div class="gps-indicator">
            <span id="gpsDot" class="gps-dot"></span>
            <span id="gpsText">Acquiring Real-Time GPS Satellite...</span>
        </div>
        <div id="logCountText">Violations: 0</div>
    </div>

    <script>
        let currentUnit = 'kmh';
        let maxSpeedMs = 0;
        let totalDistanceMeters = 0;
        let movingTimeSeconds = 0;
        let tripStartTime = null;
        let timerInterval = null;
        
        let lastLat = null;
        let lastLon = null;
        let speedLimitVal = 100;
        let fleetUnitId = 'FL-001';
        
        let isVoiceEnabled = false;
        let isOverLimitWarningActive = false;
        let warningInterval = null;
        
        let isSimulating = false;
        let simInterval = null;
        let auditLogs = [];
        let speedBuffer = [];

        function toggleDrawer() {
            document.getElementById('infoDrawer').classList.toggle('open');
            document.getElementById('drawerBtn').classList.toggle('active');
        }

        function toggleUnit() {
            currentUnit = currentUnit === 'kmh' ? 'mph' : 'kmh';
            document.getElementById('unitDisplay').innerText = currentUnit.toUpperCase();
            document.getElementById('unitToggleCard').innerText = currentUnit.toUpperCase() + ' ⇄';
            document.getElementById('limitUnitLabel').innerText = currentUnit.toUpperCase();
            
            let input = document.getElementById('speedLimitInput');
            if (currentUnit === 'mph' && speedLimitVal === 100) {
                speedLimitVal = 60;
                input.value = 60;
            } else if (currentUnit === 'kmh' && speedLimitVal === 60) {
                speedLimitVal = 100;
                input.value = 100;
            }
        }

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            let btn = document.getElementById('voiceBtn');
            btn.classList.toggle('active', isVoiceEnabled);
            if (!isVoiceEnabled) {
                stopOverLimitWarning();
            }
        }

        // Speaks the exact number cleanly in English
        function speakNumber(numericValue) {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let roundedVal = Math.round(numericValue);
            let utterance = new SpeechSynthesisUtterance(roundedVal.toString());
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // Continuous over-limit warning loop: repeats until speed drops safely
        function startOverLimitWarning(currentNumericSpeed) {
            if (!isVoiceEnabled || isOverLimitWarningActive) return;
            isOverLimitWarningActive = true;
            
            speakNumber(currentNumericSpeed);

            warningInterval = setInterval(() => {
                if (!isVoiceEnabled || !isOverLimitWarningActive) {
                    stopOverLimitWarning();
                    return;
                }
                let currentVal = parseFloat(document.getElementById('speedDisplay').innerText) || 0;
                speakNumber(currentVal);
            }, 3500);
        }

        function stopOverLimitWarning() {
            isOverLimitWarningActive = false;
            if (warningInterval) {
                clearInterval(warningInterval);
                warningInterval = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function updateLimit() {
            speedLimitVal = parseFloat(document.getElementById('speedLimitInput').value) || 100;
        }

        function updateFleetId() {
            fleetUnitId = document.getElementById('unitIdInput').value || 'FL-001';
            document.getElementById('fleetIdDisplay').innerText = `UNIT: ${fleetUnitId} (REAL-TIME GPS)`;
        }

        function resetTrip() {
            maxSpeedMs = 0;
            totalDistanceMeters = 0;
            movingTimeSeconds = 0;
            tripStartTime = null;
            lastLat = null;
            lastLon = null;
            speedBuffer = [];
            auditLogs = [];
            stopOverLimitWarning();
            
            document.getElementById('maxSpeed').innerText = formatSpeed(0);
            document.getElementById('avgSpeed').innerText = formatSpeed(0);
            document.getElementById('distance').innerText = formatDistance(0);
            document.getElementById('tripTime').innerText = "00:00:00";
            document.getElementById('speedDisplay').innerText = "0.0";
            document.getElementById('logCountText').innerText = "Violations: 0";
            document.body.classList.remove('over-speed');
        }

        function formatSpeed(speedInMs) {
            if (isNaN(speedInMs) || speedInMs < 0.25) speedInMs = 0;
            let speed = currentUnit === 'kmh' ? speedInMs * 3.6 : speedInMs * 2.23694;
            return speed.toFixed(1);
        }

        function formatDistance(meters) {
            if (currentUnit === 'mph') {
                let miles = meters * 0.000621371;
                return miles < 0.1 ? (meters * 3.28084).toFixed(0) + ' ft' : miles.toFixed(2) + ' mi';
            } else {
                let km = meters / 1000;
                return km < 0.1 ? meters.toFixed(0) + ' m' : km.toFixed(2) + ' km';
            }
        }

        function formatTime(totalSeconds) {
            let hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            let mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let secs = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Kalman Smoothing Filter for Zero Jitter
        function getSmoothedSpeed(rawSpeedMs) {
            speedBuffer.push(rawSpeedMs);
            if (speedBuffer.length > 5) speedBuffer.shift();
            let sum = speedBuffer.reduce((a, b) => a + b, 0);
            return sum / speedBuffer.length;
        }

        function processTelemetry(speedMs, lat, lon, accuracy) {
            let smoothedSpeedMs = getSmoothedSpeed(speedMs);

            if (!tripStartTime && smoothedSpeedMs > 0.5) {
                tripStartTime = Date.now();
                if (!timerInterval) {
                    timerInterval = setInterval(() => {
                        if (tripStartTime) {
                            movingTimeSeconds++;
                            document.getElementById('tripTime').innerText = formatTime(movingTimeSeconds);
                        }
                    }, 1000);
                }
            }

            if (smoothedSpeedMs > maxSpeedMs) {
                maxSpeedMs = smoothedSpeedMs;
                document.getElementById('maxSpeed').innerText = formatSpeed(maxSpeedMs);
            }

            if (lastLat !== null && lastLon !== null && lat !== null && lon !== null) {
                let dist = calculateDistance(lastLat, lastLon, lat, lon);
                if (dist > 1.0 && accuracy < 30) {
                    totalDistanceMeters += dist;
                    document.getElementById('distance').innerText = formatDistance(totalDistanceMeters);
                }
            }
            if (lat !== null) lastLat = lat;
            if (lon !== null) lastLon = lon;

            if (movingTimeSeconds > 0 && totalDistanceMeters > 0) {
                let avgMs = totalDistanceMeters / movingTimeSeconds;
                document.getElementById('avgSpeed').innerText = formatSpeed(avgMs);
            }

            let currentDisplaySpeed = formatSpeed(smoothedSpeedMs);
            document.getElementById('speedDisplay').innerText = currentDisplaySpeed;

            let currentNumericSpeed = currentUnit === 'kmh' ? smoothedSpeedMs * 3.6 : smoothedSpeedMs * 2.23694;
            
            if (currentNumericSpeed > speedLimitVal) {
                document.body.classList.add('over-speed');
                startOverLimitWarning(currentNumericSpeed);
                
                auditLogs.push({
                    timestamp: new Date().toISOString(),
                    unit: fleetUnitId,
                    speed: currentNumericSpeed.toFixed(1),
                    limit: speedLimitVal,
                    unitType: currentUnit.toUpperCase(),
                    lat: lat,
                    lon: lon
                });
                document.getElementById('logCountText').innerText = `Violations: ${auditLogs.length}`;
            } else {
                document.body.classList.remove('over-speed');
                stopOverLimitWarning();
            }

            document.getElementById('accuracy').innerText = accuracy ? Math.round(accuracy) + ' m' : '-- m';
        }

        // REAL-TIME GPS WATCHER (Active by default)
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    if (isSimulating) return;
                    document.getElementById('gpsDot').classList.add('locked');
                    document.getElementById('gpsText').innerText = 'Real-Time GPS Active';
                    let speedMs = position.coords.speed;
                    if (speedMs === null || isNaN(speedMs)) speedMs = 0;
                    processTelemetry(speedMs, position.coords.latitude, position.coords.longitude, position.coords.accuracy);
                },
                (error) => {
                    if (!isSimulating) {
                        document.getElementById('gpsDot').classList.remove('locked');
                        document.getElementById('gpsText').innerText = 'GPS Signal Weak';
                    }
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            document.getElementById('gpsText').innerText = 'Geolocation Unavailable';
        }

        // Simulation Mode (Inside Settings Drawer)
        function toggleSimulation() {
            isSimulating = !isSimulating;
            let simBtn = document.getElementById('simBtn');
            simBtn.classList.toggle('active', isSimulating);
            
            if (isSimulating) {
                simBtn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px;">science</span> Test Route Simulation (On)`;
                document.getElementById('gpsDot').classList.add('locked');
                document.getElementById('gpsText').innerText = 'Simulated Test Route';
                let simStep = 0;
                const simSpeedsMps = [0, 8, 18, 30, 35, 28, 12, 0];
                simInterval = setInterval(() => {
                    let speedMs = simSpeedsMps[simStep % simSpeedsMps.length] + (Math.random() * 0.8);
                    processTelemetry(speedMs, 3.12 + (simStep*0.001), 101.5 + (simStep*0.001), 3.0);
                    simStep++;
                }, 1500);
            } else {
                simBtn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px;">science</span> Test Route Simulation (Off)`;
                clearInterval(simInterval);
                resetTrip();
                document.getElementById('gpsText').innerText = 'Acquiring Real-Time GPS Satellite...';
                document.getElementById('gpsDot').classList.remove('locked');
            }
        }

        function exportAuditLogs() {
            if (auditLogs.length === 0) {
                alert("No speed violation audit logs recorded yet.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Timestamp,FleetUnit,Speed,Limit,Unit,Latitude,Longitude\r\n";
            auditLogs.forEach(row => {
                csvContent += `${row.timestamp},${row.unit},${row.speed},${row.limit},${row.unitType},${row.lat},${row.lon}\r\n`;
            });
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `speedi_audit_${fleetUnitId}_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
